        function getTransactionBalanceDeltas(tx) {
            const deltas = new Map();
            const addDelta = (accountId, delta) => {
                if (accountId) deltas.set(accountId, roundMoney((deltas.get(accountId) || 0) + delta));
            };
            const amount = roundMoney(tx.amount);

            switch (tx.transaction_type) {
                case 'income':
                    addDelta(tx.wallet_id, amount);
                    break;
                case 'transfer':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'credit_payment':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'expense':
                case 'credit_spend':
                    addDelta(tx.wallet_id, -amount);
                    break;
                case 'saving':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
            }
            return deltas;
        }

        async function applySavingsGoalDeltas(deltas) {
            const applied = [];
            const entries = [...deltas].filter(([, delta]) => delta);
            for (const [goalId, delta] of entries) {
                const goal = db.savings_goals.find(item => String(item.id) === String(goalId));
                if (!goal) {
                    showAlert('ไม่พบเป้าหมายเงินออมที่ผูกกับรายการนี้', 'error');
                    break;
                }
                const previousAmount = Number(goal.current_amount) || 0;
                const previousSavedPeriods = Number(goal.saved_periods) || 0;
                const nextAmount = roundMoney(previousAmount + delta);
                const savedPeriods = calculateSavedPeriods(goal, nextAmount);
                if (!await updateInDB('savings_goals', goal.id, { current_amount: nextAmount, saved_periods: savedPeriods })) break;
                applied.push([goal.id, previousAmount, previousSavedPeriods]);
            }

            if (applied.length === entries.length) return true;
            let rollbackFailed = false;
            for (const [goalId, previousAmount, previousSavedPeriods] of applied.reverse()) {
                if (!await updateInDB('savings_goals', goalId, { current_amount: previousAmount, saved_periods: previousSavedPeriods })) rollbackFailed = true;
            }
            if (rollbackFailed) {
                await loadAllData();
                showAlert('คืนยอดเป้าหมายเงินออมไม่สำเร็จ กรุณาตรวจสอบเป้าหมาย', 'error');
            }
            return false;
        }

        async function applyTransactionBalanceDeltas(deltas) {
            const applied = [];
            const rollbackApplied = async () => {
                let rollbackFailed = false;
                for (const [appliedAccountId, originalBalance] of applied.reverse()) {
                    if (!await updateInDB('accounts', appliedAccountId, { balance: originalBalance })) rollbackFailed = true;
                }
                if (rollbackFailed) {
                    await loadAllData();
                    showAlert('ปรับยอดบางบัญชีไม่สำเร็จ และคืนค่ายอดเดิมไม่ครบ กรุณาตรวจสอบบัญชี', 'error');
                }
                return !rollbackFailed;
            };

            for (const [accountId, delta] of deltas) {
                if (!delta) continue;
                const account = db.accounts.find(a => String(a.id) === String(accountId));
                if (!account) {
                    showAlert('ไม่พบบัญชีที่ผูกกับรายการนี้', 'error');
                    await rollbackApplied();
                    return false;
                }
                const previousBalance = Number(account.balance);
                const balance = roundMoney(previousBalance + delta);
                if (!await updateInDB('accounts', accountId, { balance })) {
                    await rollbackApplied();
                    return false;
                }
                applied.push([accountId, previousBalance]);
            }
            return true;
        }

                wallet_id,
                to_wallet_id,
                category_id,
                transaction_note: encodeTransactionNote(note, type === 'saving' ? savingsGoalId : ''),
                is_installment,
                installment_total_months,
                installment_current_month
            };

            const oldTx = editId ? db.transactions.find(tx => String(tx.id) === String(editId)) : null;
            if (editId && !oldTx) {
                showAlert('ไม่พบรายการที่ต้องการแก้ไข กรุณาโหลดข้อมูลใหม่', 'error');
                return;
            }

            const balanceDeltas = new Map();
            const mergeDeltas = (source, multiplier) => {
                for (const [accountId, delta] of getTransactionBalanceDeltas(source)) {
                    balanceDeltas.set(accountId, roundMoney((balanceDeltas.get(accountId) || 0) + delta * multiplier));
                }
            };
            if (oldTx) mergeDeltas(oldTx, -1);
            mergeDeltas(txData, 1);

            const savingsGoalDeltas = new Map();
            const mergeSavingsGoalDelta = (tx, multiplier) => {
                const contribution = getSavingsGoalContribution(tx);
                if (!contribution?.goalId) return;
                savingsGoalDeltas.set(contribution.goalId, roundMoney(
                    (savingsGoalDeltas.get(contribution.goalId) || 0) + contribution.amount * multiplier
                ));
            };
            if (oldTx) mergeSavingsGoalDelta(oldTx, -1);
            mergeSavingsGoalDelta(txData, 1);
            if (!await applySavingsGoalDeltas(savingsGoalDeltas)) return;
            if (!await applyTransactionBalanceDeltas(balanceDeltas)) {
                await applySavingsGoalDeltas(new Map([...savingsGoalDeltas].map(([goalId, delta]) => [goalId, -delta])));
                return;
            }

            const saved = editId
                ? await updateInDB('transactions', editId, txData)
                : await saveToDB('transactions', txData);
            if (!saved) {
                const rollbackDeltas = new Map([...balanceDeltas].map(([accountId, delta]) => [accountId, -delta]));
                const rollbackGoalDeltas = new Map([...savingsGoalDeltas].map(([goalId, delta]) => [goalId, -delta]));
                const [balancesRestored, goalsRestored] = await Promise.all([
                    applyTransactionBalanceDeltas(rollbackDeltas),
                    applySavingsGoalDeltas(rollbackGoalDeltas)
                ]);
                if (!balancesRestored || !goalsRestored) {
                    await loadAllData();
                    showAlert('บันทึกรายการไม่สำเร็จ และคืนยอดบัญชีหรือเป้าหมายไม่ครบ กรุณาตรวจสอบข้อมูล', 'error');
                }
                return;
            }

            closeTransactionModal();
            await loadAllData(['accounts', 'transactions', 'savings_goals']);
            renderCurrentTab();
            showAlert(editId ? 'แก้ไขรายการสำเร็จ' : 'บันทึกรายการสำเร็จ');
            } finally {
                isSavingTransaction = false;
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = originalButtonText;
                }
            }
        }

        async function deleteTransaction(id) {
            if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
                const tx = db.transactions.find(item => String(item.id) === String(id));
                if (!tx) return;
                const balanceDeltas = new Map(
                    [...getTransactionBalanceDeltas(tx)].map(([accountId, delta]) => [accountId, -delta])
                );
                const contribution = getSavingsGoalContribution(tx);
                const goalDeltas = contribution?.goalId
                    ? new Map([[contribution.goalId, -contribution.amount]])
                    : new Map();
                if (!await applySavingsGoalDeltas(goalDeltas)) return;
                if (!await applyTransactionBalanceDeltas(balanceDeltas)) {
                    await applySavingsGoalDeltas(new Map([...goalDeltas].map(([goalId, delta]) => [goalId, -delta])));
                    return;
                }

                if (!await deleteFromDB('transactions', id)) {
                    const rollbackDeltas = new Map([...balanceDeltas].map(([accountId, delta]) => [accountId, -delta]));
                    const rollbackGoalDeltas = new Map([...goalDeltas].map(([goalId, delta]) => [goalId, -delta]));
                    const [balancesRestored, goalsRestored] = await Promise.all([
                        applyTransactionBalanceDeltas(rollbackDeltas),
                        applySavingsGoalDeltas(rollbackGoalDeltas)
                    ]);
                    if (!balancesRestored || !goalsRestored) {
                        await loadAllData();
                        showAlert('ลบรายการไม่สำเร็จ และคืนยอดบัญชีหรือเป้าหมายไม่ครบ กรุณาตรวจสอบข้อมูล', 'error');
                    }
                    return;
                }

                await loadAllData(['accounts', 'transactions', 'savings_goals']);
                renderCurrentTab();
                showAlert('ลบรายการสำเร็จ', 'success');
            }
        }

        // --- Corrected General Ledger Calculations & Display ---
        function setLedgerDateMode(mode) {
            ledgerDateMode = mode;
            ledgerCurrentDate = new Date();
            openAccountLedger(ledgerAccountId);
        }

        function shiftLedgerDate(direction) {
            const date = new Date(ledgerCurrentDate);
            if (ledgerDateMode === 'day') date.setDate(date.getDate() + direction);
            else if (ledgerDateMode === 'week') date.setDate(date.getDate() + direction * 7);
            else if (ledgerDateMode === 'month') {
                date.setDate(1);
                date.setMonth(date.getMonth() + direction);
            } else {
                date.setMonth(0, 1);
                date.setFullYear(date.getFullYear() + direction);
            }
            ledgerCurrentDate = date;
            openAccountLedger(ledgerAccountId);
        }

        function getLedgerDateRange() {
            const selectedDate = new Date(ledgerCurrentDate);
            let start;
            let end;
            if (ledgerDateMode === 'day') {
                start = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
                end = new Date(start);
                end.setDate(end.getDate() + 1);
            } else if (ledgerDateMode === 'week') {
                start = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
                start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
                end = new Date(start);
                end.setDate(end.getDate() + 7);
            } else if (ledgerDateMode === 'year') {
                start = new Date(selectedDate.getFullYear(), 0, 1);
                end = new Date(selectedDate.getFullYear() + 1, 0, 1);
            } else {
                start = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
                end = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + 1, 1);
            }
            const label = ledgerDateMode === 'day'
                ? start.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })
                : ledgerDateMode === 'week'
                    ? `${start.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })} – ${new Date(end.getTime() - 1).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })}`
                    : ledgerDateMode === 'year'
                        ? `ปี ${start.getFullYear() + 543}`
                        : start.toLocaleDateString('th-TH', { year: 'numeric', month: 'long' });
            return { start, end, label };
        }

        function openAccountLedger(accountId) {
            const acc = db.accounts.find(a => String(a.id) === String(accountId));
            if (!acc) return;
            if (String(ledgerAccountId) !== String(accountId)) {
                ledgerDateMode = 'month';
                ledgerCurrentDate = new Date();
            }
            ledgerAccountId = accountId;

            const allAccTxs = db.transactions.filter(t => String(t.wallet_id) === String(accountId) || String(t.to_wallet_id) === String(accountId));
            allAccTxs.sort((a, b) => new Date(a.transaction_date) - new Date(b.transaction_date));
            const { start: rangeStart, end: rangeEnd, label: rangeLabel } = getLedgerDateRange();
            const accTxs = allAccTxs.filter(transaction => {
                const transactionDate = new Date(transaction.transaction_date);
                return transactionDate >= rangeStart && transactionDate < rangeEnd;
            });

            let totalNetChange = 0;
            allAccTxs.forEach(t => {
                totalNetChange += getTransactionBalanceDeltas(t).get(accountId) || 0;
            });

            // หนี้สินเก็บยอดติดลบในฐานข้อมูล แต่แสดงยอดหนี้เป็นจำนวนบวก
            const isLiability = ['credit', 'loan'].includes(acc.account_type);
            const initialStartBalance = Number(acc.balance) - totalNetChange;
            const balanceBeforeRange = initialStartBalance + allAccTxs
                .filter(transaction => new Date(transaction.transaction_date) < rangeStart)
                .reduce((sum, transaction) => sum + (getTransactionBalanceDeltas(transaction).get(accountId) || 0), 0);

            let runningBalance = isLiability ? -balanceBeforeRange : balanceBeforeRange;
            let rowsHtml = '';

            if (accTxs.length === 0) {
                rowsHtml = `<tr><td colspan="4" class="text-center py-6 text-slate-400 text-xs">ยังไม่มีรายการเคลื่อนไหวในบัญชีนี้</td></tr>`;
            } else {
                rowsHtml = accTxs.map(t => {
                    const amount = Number(t.amount);
                    const accountDelta = getTransactionBalanceDeltas(t).get(accountId) || 0;
                    const balanceDelta = isLiability ? -accountDelta : accountDelta;
                    runningBalance += balanceDelta;
                    const increasesBalance = balanceDelta > 0;

                    const d = new Date(t.transaction_date);
                    const dateStr = d.toLocaleDateString('th-TH', { year: '2-digit', month: 'numeric', day: 'numeric' });

                    return `
                        <tr class="border-b border-slate-100 dark:border-slate-700/50 text-[11px]">
                            <td class="py-2.5 px-2 whitespace-nowrap text-slate-400">${dateStr}</td>
                            <td class="py-2.5 px-2 font-medium whitespace-normal break-words">
                                <div>${escapeHtml(getTransactionNote(t) || '-')}</div>
                            </td>
                            <td class="py-2.5 px-2 text-right font-semibold ${increasesBalance ? 'text-emerald-600' : 'text-rose-500'}">${balanceDelta > 0 ? '+' : '−'}${formatBaht(amount)}</td>
                            <td class="py-2.5 px-2 text-right font-bold text-slate-700 dark:text-slate-200">${formatBaht(runningBalance)}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('ledgerTitle').innerHTML = `<i data-lucide="book-open" class="h-5 w-5 shrink-0 text-brand-500"></i> สมุดบัญชี: ${escapeHtml(acc.account_name)}`;
            document.getElementById('ledgerContent').innerHTML = `
                <section class="mb-3 rounded-2xl bg-slate-50 p-3 dark:bg-white/5">
                    <div class="mb-2 flex items-center justify-between gap-2">
                        <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-300">ช่วงเวลาที่แสดง</span>
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="shiftLedgerDate(-1)" aria-label="ช่วงเวลาก่อนหน้า" class="flex h-7 w-7 items-center justify-center rounded-lg bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-200"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
                            <span class="min-w-24 text-center text-[10px] font-bold text-brand-700 dark:text-brand-300">${rangeLabel}</span>
                            <button type="button" onclick="shiftLedgerDate(1)" aria-label="ช่วงเวลาถัดไป" class="flex h-7 w-7 items-center justify-center rounded-lg bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-200"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
                        </div>

        async function deleteCategory(id) {
            const linkedCount = db.transactions.filter(tx => String(tx.category_id) === String(id)).length
                + db.budgets.filter(bud => String(bud.category_id) === String(id)).length;
            if (linkedCount) {
                showAlert(`ลบหมวดหมู่นี้ไม่ได้ เพราะมี ${linkedCount} รายการ/งบประมาณใช้อยู่`, 'error');
                return;

            if (confirm('ต้องการลบหมวดหมู่นี้ใช่หรือไม่?')) {

                await loadAllData(['categories']);

            }

        function parseBudgetPeriodDate(value, isEnd = false) {
            if (!value) return null;
            const match = String(value).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]) - 1;
            const day = match[3] ? Number(match[3]) : (isEnd ? new Date(year, month + 1, 0).getDate() : 1);
            const date = new Date(year, month, day);
            if (isEnd) date.setHours(23, 59, 59, 999);
            return date;
        }

        function formatBudgetPeriod(value, isEnd = false) {
            const date = parseBudgetPeriodDate(value, isEnd);
            return date ? date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : value;
        }

        function budgetPeriodInputValue(value, isEnd = false) {
            const date = parseBudgetPeriodDate(value, isEnd);
            if (!date) return '';
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

                                    <input type="date" id="budEnd" required value="${new Date().getFullYear()}-12-31" class="field min-w-0 !px-2.5 text-[14px]">
                                </div>
                            </div>
                            <button type="submit" class="btn-primary w-full">บันทึกงบ</button>
                        </form>
                    </div>
                </div>

                <!-- Savings goal sheet -->
                <div id="goalModal" class="sheet-backdrop hidden" onclick="if (event.target === this) closeGoalModal()">
                    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
                        <div class="sheet-handle"></div>
                        <div class="mb-4 flex items-center justify-between">
                            <h3 id="goalModalTitle" class="flex items-center gap-2 text-lg font-bold text-slate-900 dark:text-white">เพิ่มเป้าหมายเงินออม</h3>
                            <button type="button" onclick="closeGoalModal()" class="btn-icon -mr-2" aria-label="ปิด"><i data-lucide="x" class="h-5 w-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveGoal(event)" class="space-y-3.5">
                            <input type="hidden" id="editGoalId">
                            <div>
                                <label for="goalTitle" class="label">ชื่อเป้าหมาย</label>
                                <input type="text" id="goalTitle" required placeholder="เช่น เที่ยวญี่ปุ่น" class="field">
                            </div>
                            <div>
                                <label for="goalTarget" class="label">ยอดเป้าหมาย (บาท)</label>
                                <input type="number" step="0.01" inputmode="decimal" id="goalTarget" required placeholder="120000" class="field num">
                            </div>
                            <div>
                                <label for="goalCurrent" class="label">ยอดเก็บสะสมปัจจุบัน (บาท)</label>
                                <input type="number" step="0.01" inputmode="decimal" id="goalCurrent" required value="0" class="field num">
                                <p class="mt-1 text-[12px] muted">ถ้าออมผ่านรายการ "เงินออม" ระบบบวกยอดให้อัตโนมัติ ช่องนี้ใช้ปรับยอดเองเท่านั้น</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label for="goalPeriods" class="label">จำนวนงวด (เดือน)</label>
                                    <input type="number" id="goalPeriods" required value="12" class="field num">
                                </div>
                                <div>
                                    <label for="goalMonthly" class="label">ออมต่อเดือน</label>
                                    <input type="number" step="0.01" inputmode="decimal" id="goalMonthly" required value="10000" class="field num">
                                </div>
                            </div>
                            <button type="submit" class="btn-primary w-full">บันทึกเป้าหมาย</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function openBudgetModal(id = null) {
            if (id) {
                const bud = db.budgets.find(b => b.id === id);
                if (bud) {
                    document.getElementById('editBudId').value = bud.id;
                    document.getElementById('budName').value = bud.budget_name;
                    document.getElementById('budCategoryId').value = bud.category_id;
                    document.getElementById('budLimit').value = bud.budget_limit;
                    document.getElementById('budStart').value = budgetPeriodInputValue(bud.start_period);
                    document.getElementById('budEnd').value = budgetPeriodInputValue(bud.end_period, true);
                    document.getElementById('budModalTitle').innerHTML = '<i data-lucide="edit-3" class="h-5 w-5 text-brand-500"></i> แก้ไขงบประมาณ';
                }
            } else {
                document.getElementById('editBudId').value = '';
                document.getElementById('budName').value = '';
                document.getElementById('budModalTitle').innerHTML = '<i data-lucide="wallet" class="h-5 w-5 text-brand-500"></i> ตั้งงบประมาณรายจ่าย';
            }
            document.getElementById('budModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeBudgetModal() { document.getElementById('budModal').classList.add('hidden'); }

        function openGoalModal(id = null) {
            if (id) {
                const goal = db.savings_goals.find(g => g.id === id);
                if (goal) {
                    document.getElementById('editGoalId').value = goal.id;
                    document.getElementById('goalTitle').value = goal.goal_title;
                    document.getElementById('goalTarget').value = goal.target_amount;
                    document.getElementById('goalCurrent').value = goal.current_amount;
                    document.getElementById('goalPeriods').value = goal.total_periods;
                    document.getElementById('goalMonthly').value = goal.monthly_target;
                    document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="edit-3" class="h-5 w-5 text-brand-500"></i> แก้ไขเป้าหมาย';
                }
            } else {
                document.getElementById('editGoalId').value = '';
                document.getElementById('goalTitle').value = '';
                document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="target" class="h-5 w-5 text-brand-500"></i> เพิ่มเป้าหมายเงินออม';
            }
            document.getElementById('goalModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeGoalModal() { document.getElementById('goalModal').classList.add('hidden'); }

        async function handleSaveBudget(e) {
            e.preventDefault();
            const editId = document.getElementById('editBudId').value;
            const startPeriod = document.getElementById('budStart').value;
            const endPeriod = document.getElementById('budEnd').value;
            if (!startPeriod || !endPeriod || startPeriod > endPeriod) {
                showAlert('กรุณาเลือกช่วงวันที่ให้ถูกต้อง โดยวันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น', 'error');
                return;
            }
            const budData = {
                budget_name: document.getElementById('budName').value,
                category_id: document.getElementById('budCategoryId').value,
                budget_limit: Number(document.getElementById('budLimit').value),
                start_period: startPeriod,
                end_period: endPeriod
            };
            const saved = editId
                ? await updateInDB('budgets', editId, budData)
                : await saveToDB('budgets', budData);
            if (!saved) return;
            showAlert(editId ? 'แก้ไขงบประมาณสำเร็จ' : 'สร้างงบประมาณสำเร็จ');
            closeBudgetModal();
            await loadAllData(['budgets']);
            renderCurrentTab();
        }

        async function handleSaveGoal(e) {
            e.preventDefault();
            const editId = document.getElementById('editGoalId').value;
            const goalData = {
                goal_title: document.getElementById('goalTitle').value,
                target_amount: Number(document.getElementById('goalTarget').value),
                current_amount: Number(document.getElementById('goalCurrent').value),
                total_periods: Number(document.getElementById('goalPeriods').value),
                monthly_target: Number(document.getElementById('goalMonthly').value)
            };
            goalData.saved_periods = calculateSavedPeriods(goalData, goalData.current_amount);
            const saved = editId
                ? await updateInDB('savings_goals', editId, goalData)
                : await saveToDB('savings_goals', goalData);
            if (!saved) return;
            showAlert(editId ? 'แก้ไขเป้าหมายสำเร็จ' : 'สร้างเป้าหมายสำเร็จ');
            closeGoalModal();
            await loadAllData(['savings_goals']);
            renderCurrentTab();
        }

        async function deleteBudget(id) {
            if (confirm('ต้องการลบงบประมาณนี้ใช่หรือไม่?')) {
                if (!await deleteFromDB('budgets', id)) return;
                await loadAllData(['budgets']);
                renderCurrentTab();
                showAlert('ลบงบประมาณสำเร็จ', 'success');
            }
        }
        async function deleteGoal(id) {
            const linkedContributions = db.transactions.some(tx =>
                String(getTransactionSavingsGoalId(tx)) === String(id)
            );
            if (linkedContributions) {
                showAlert('ยังลบเป้าหมายนี้ไม่ได้ เพราะมีรายการเงินออมผูกอยู่', 'error');
                return;
            }
            if (confirm('ต้องการลบเป้าหมายนี้ใช่หรือไม่?')) {
                if (!await deleteFromDB('savings_goals', id)) return;
                await loadAllData(['savings_goals']);
                renderCurrentTab();
                showAlert('ลบเป้าหมายสำเร็จ', 'success');
            }
        }

                function setAnalyticsAccount(accountId) {
            analyticsAccountId = accountId;
            renderCurrentTab();
        }

        function setAnalyticsCategory(categoryId) {
            analyticsCategoryId = categoryId;
            renderCurrentTab();
        }

        function renderAnalytics(container) {
            const filteredTxs = filterTransactionsByDate(db.transactions);
            const { income: periodIncome, expense: periodExpense } = summarizePeriod(filteredTxs);
            const periodNet = periodIncome - periodExpense;
            const savingRate = periodIncome > 0 ? Math.round(periodNet / periodIncome * 100) : null;

            const isAllAccounts = analyticsAccountId === 'all';
            const selectedAccount = isAllAccounts ? null : accountById(analyticsAccountId) || db.accounts[0] || null;
            analyticsAccountId = isAllAccounts ? 'all' : selectedAccount ? selectedAccount.id : '';
            const accountExpenseTxs = isAllAccounts
                ? filteredTxs.filter(tx => SPEND_TYPES.includes(tx.transaction_type))
                : selectedAccount
                    ? filteredTxs.filter(tx => String(tx.wallet_id) === String(selectedAccount.id) && SPEND_TYPES.includes(tx.transaction_type))
                    : [];
            const expenseCategories = db.categories.filter(category => category.category_type === 'expense');
            if (analyticsCategoryId && !expenseCategories.some(category => String(category.id) === String(analyticsCategoryId))) {
                analyticsCategoryId = '';
            }
            const selectedExpenseTxs = accountExpenseTxs
                .filter(tx => !analyticsCategoryId || String(tx.category_id) === String(analyticsCategoryId))
                .sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
            const selectedExpenseTotal = selectedExpenseTxs.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const accountExpenseTotal = accountExpenseTxs.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const accountExpenseByCategory = groupByCategory(accountExpenseTxs);
            const expenseByCategory = groupByCategory(filteredTxs.filter(tx => SPEND_TYPES.includes(tx.transaction_type)), '');
            const palette = ['#2563eb', '#8b5cf6', '#f97316', '#14b8a6', '#ec4899', '#f59e0b', '#06b6d4', '#84cc16'];
            const colorFor = (category, index) => safeColor(category.color, palette[index % palette.length]);

            // Six months ending at the month in focus.
            const anchor = new Date(globalFilter.currentDate);
            const months = Array.from({ length: 6 }, (_, i) => new Date(anchor.getFullYear(), anchor.getMonth() - 5 + i, 1));
            const trend = months.map(month => {
                const txs = db.transactions.filter(tx => {
                    const date = new Date(tx.transaction_date);
                    return date.getFullYear() === month.getFullYear() && date.getMonth() === month.getMonth();
                });
                return summarizePeriod(txs);
            });
            const hasTrend = trend.some(item => item.income || item.expense);

            const accountLabel = type => (ACCOUNT_TYPE_META[type] || {}).label || type;

            container.innerHTML = `
                <div class="fade-in space-y-4">
                    ${renderDateFilterBar()}

                    <section class="grid grid-cols-3 gap-2">
                        <div class="card !rounded-2xl p-3">
                            <div class="flex items-center gap-1 text-[12px] font-semibold text-emerald-600 dark:text-emerald-400"><i data-lucide="arrow-down-left" class="h-3.5 w-3.5"></i>รายรับช่วงนี้</div>
                            <div class="num mt-1 truncate text-[15px] font-bold text-slate-900 dark:text-white">${formatBaht(periodIncome)}</div>
                        </div>
                        <div class="card !rounded-2xl p-3">
                            <div class="flex items-center gap-1 text-[12px] font-semibold text-rose-600 dark:text-rose-400"><i data-lucide="arrow-up-right" class="h-3.5 w-3.5"></i>รายจ่ายช่วงนี้</div>
                            <div class="num mt-1 truncate text-[15px] font-bold text-slate-900 dark:text-white">${formatBaht(periodExpense)}</div>
                        </div>
                        <div class="card !rounded-2xl p-3">
                            <div class="flex items-center gap-1 text-[12px] font-semibold text-brand-600 dark:text-brand-300"><i data-lucide="piggy-bank" class="h-3.5 w-3.5"></i>อัตราออม</div>
                            <div class="num mt-1 truncate text-[15px] font-bold ${savingRate !== null && savingRate < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-slate-900 dark:text-white'}">${savingRate === null ? '—' : `${savingRate}%`}</div>
                        </div>
                    </section>

                    <section class="card p-4">
                        <div class="mb-3 flex items-center justify-between">
                            <div>
                                <h3 class="section-title">แนวโน้ม 6 เดือน</h3>
                                <p class="text-[12px] muted">รายรับเทียบรายจ่ายรายเดือน</p>
                            </div>
                            <div class="flex gap-3 text-[12px]"><span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>รับ</span><span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full bg-rose-500"></span>จ่าย</span></div>
                        </div>
                        <div class="relative h-52">${hasTrend ? '<canvas id="trendChart" aria-label="กราฟแนวโน้มรายรับรายจ่าย 6 เดือน" role="img"></canvas>' : emptyState('chart-column', 'ยังไม่มีข้อมูล 6 เดือนล่าสุด')}</div>
                    </section>

                    <section class="card p-4">
                        <div class="mb-2 flex items-center justify-between">
                            <div>
                                <h3 class="section-title">รายจ่ายตามหมวดหมู่</h3>
                                <p class="text-[12px] muted">${escapeHtml(getFilterLabel())}</p>
                            </div>
                            <span class="rounded-full bg-slate-100 px-2.5 py-1 text-[12px] font-semibold text-slate-600 dark:bg-white/10 dark:text-slate-300">${expenseByCategory.length} หมวด</span>
                        </div>
                        ${expenseByCategory.length ? `
                            <div class="relative mx-auto h-56 max-w-[260px]"><canvas id="expenseChart" aria-label="กราฟสัดส่วนรายจ่ายตามหมวดหมู่" role="img"></canvas></div>
                            <div class="mt-3 space-y-1">
                                ${expenseByCategory.map((category, index) => {
                                    const share = periodExpense ? Math.round(category.total / periodExpense * 100) : 0;
                                    return `<div class="flex items-center justify-between gap-2 rounded-xl px-1 py-1.5 text-[13px]">
                                        <span class="flex min-w-0 items-center gap-2"><span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:${colorFor(category, index)}"></span><span class="truncate font-medium text-slate-700 dark:text-slate-200">${escapeHtml(category.name)}</span></span>
                                        <span class="num shrink-0"><span class="font-semibold text-slate-900 dark:text-white">${formatBaht(category.total)}</span><span class="ml-1.5 inline-block w-9 text-right muted">${share}%</span></span>
                                    </div>`;
                                }).join('')}
                            </div>
                        ` : emptyState('chart-pie', 'ยังไม่มีรายจ่ายในช่วงนี้', 'ลองเปลี่ยนช่วงเวลาเพื่อดูข้อมูล')}
                    </section>

                    <section class="card p-4">
                        <h3 class="section-title">เจาะลึกตามบัญชี</h3>
                        <p class="mb-3 text-[12px] muted">ดูว่าแต่ละบัญชีใช้จ่ายไปกับอะไร</p>
                        ${db.accounts.length ? `
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label for="analyticsAccountSelect" class="label">บัญชี</label>
                                    <select id="analyticsAccountSelect" onchange="setAnalyticsAccount(this.value)" class="field !py-2.5 text-[14px]">
                                        <option value="all" ${isAllAccounts ? 'selected' : ''}>รวมทุกบัญชี</option>
                                        ${db.accounts.map(account => `<option value="${escapeHtml(account.id)}" ${selectedAccount && String(selectedAccount.id) === String(account.id) ? 'selected' : ''}>${escapeHtml(account.account_name)} · ${escapeHtml(accountLabel(account.account_type))}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label for="analyticsCategorySelect" class="label">หมวดรายจ่าย</label>
                                    <select id="analyticsCategorySelect" onchange="setAnalyticsCategory(this.value)" class="field !py-2.5 text-[14px]">
                                        <option value="" ${!analyticsCategoryId ? 'selected' : ''}>ทุกหมวดหมู่</option>
                                        ${expenseCategories.map(category => `<option value="${escapeHtml(category.id)}" ${String(analyticsCategoryId) === String(category.id) ? 'selected' : ''}>${escapeHtml(category.category_name)}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="my-3 flex items-center justify-between rounded-2xl bg-brand-50 p-3.5 dark:bg-brand-500/10">
                                <div class="min-w-0">
                                    <div class="truncate text-[12px] text-brand-700/80 dark:text-brand-200/80">${isAllAccounts ? 'ทุกบัญชี' : escapeHtml(selectedAccount?.account_name || '')} · ${analyticsCategoryId ? escapeHtml(expenseCategories.find(category => String(category.id) === String(analyticsCategoryId))?.category_name || '') : 'รายจ่ายรวม'}</div>
                                    <div class="num text-[20px] font-bold text-brand-700 dark:text-brand-200">${formatBaht(selectedExpenseTotal)}</div>
                                </div>
                                <span class="shrink-0 rounded-full bg-white px-2.5 py-1 text-[12px] font-semibold text-brand-700 dark:bg-slate-900 dark:text-brand-200">${selectedExpenseTxs.length} รายการ</span>
                            </div>
                            <div class="space-y-2.5">
                                ${accountExpenseByCategory.map(category => {
                                    const percent = accountExpenseTotal ? Math.round(category.total / accountExpenseTotal * 100) : 0;
                                    return `<div>
                                        <div class="mb-1 flex items-center justify-between gap-2 text-[13px]"><span class="truncate font-medium text-slate-700 dark:text-slate-200">${escapeHtml(category.name)}</span><span class="num shrink-0 font-semibold text-slate-700 dark:text-slate-200">${formatBaht(category.total)} <span class="font-normal muted">(${percent}%)</span></span></div>
                                        <div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-white/10"><div class="h-full rounded-full" style="width:${percent}%;background-color:${safeColor(category.color)}"></div></div>
                                    </div>`;
                                }).join('') || '<p class="rounded-2xl bg-slate-50 py-5 text-center text-[13px] muted dark:bg-white/5">ไม่มีรายจ่ายของบัญชีนี้ในช่วงเวลาที่เลือก</p>'}
                            </div>
                            ${selectedExpenseTxs.length ? `
                                <div class="mt-4 border-t border-slate-100 pt-3 dark:border-white/5">
                                    <div class="mb-1 text-[13px] font-bold text-slate-600 dark:text-slate-300">รายการที่ตรงกับตัวกรอง</div>
                                    <div class="-mx-2">${selectedExpenseTxs.map(renderTxRow).join('')}</div>
                                </div>
                            ` : ''}
                        ` : emptyState('wallet-cards', 'ยังไม่มีบัญชี', 'เพิ่มบัญชีและบันทึกรายจ่ายเพื่อดูการวิเคราะห์')}
                    </section>
                </div>
            `;

            setTimeout(() => {
                if (!window.Chart) return;
                const isDark = document.documentElement.classList.contains('dark');
                const tickColor = isDark ? '#94a3b8' : '#64748b';
                const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,23,42,0.06)';
                const font = { family: "'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif", size: 12 };

                const trendCanvas = document.getElementById('trendChart');
                if (trendCanvas) {
                    new Chart(trendCanvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: months.map(month => month.toLocaleDateString('th-TH', { month: 'short' })),
                            datasets: [
                                { label: 'รายรับ', data: trend.map(item => item.income), backgroundColor: '#10b981', borderRadius: 6, maxBarThickness: 18 },
                                { label: 'รายจ่าย', data: trend.map(item => item.expense), backgroundColor: '#f43f5e', borderRadius: 6, maxBarThickness: 18 }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: { callbacks: { label: context => ` ${context.dataset.label}: ${formatBaht(context.raw)}` } }
                            },
                            scales: {
                                x: { grid: { display: false }, ticks: { color: tickColor, font } },
                                y: { grid: { color: gridColor }, border: { display: false }, ticks: { color: tickColor, font, maxTicksLimit: 5, callback: value => Number(value).toLocaleString('th-TH', { notation: 'compact' }) } }
                            }
                        }
                    });
                }

                const expenseCanvas = document.getElementById('expenseChart');
                if (expenseCanvas) {
                    new Chart(expenseCanvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: expenseByCategory.map(category => category.name),
                            datasets: [{
                                data: expenseByCategory.map(category => category.total),
                                backgroundColor: expenseByCategory.map(colorFor),
                                borderColor: isDark ? '#0f172a' : '#ffffff',
                                borderWidth: 3,
                                hoverOffset: 6,
                                borderRadius: 4,
                                spacing: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '74%',
                            plugins: {
                                legend: { display: false },
                                tooltip: { callbacks: { label: context => ` ${context.label}: ${formatBaht(context.raw)}` } }
                            }
                        },
                        plugins: [{
                            id: 'expenseCenterLabel',
                            afterDraw(chart) {
                                const { ctx, chartArea } = chart;
                                if (!chartArea) return;
                                const x = (chartArea.left + chartArea.right) / 2;
                                const y = (chartArea.top + chartArea.bottom) / 2;
                                ctx.save();
                                ctx.textAlign = 'center';
                                ctx.fillStyle = tickColor;
                                ctx.font = `13px ${font.family}`;
                                ctx.fillText('รวมรายจ่าย', x, y - 10);
                                ctx.fillStyle = isDark ? '#f8fafc' : '#0f172a';
                                ctx.font = `bold 18px ${font.family}`;
                                ctx.fillText(formatBaht(periodExpense), x, y + 15);
                                ctx.restore();
                            }
                        }]
                    });
                }
            }, 60);
        }

    </script>
</body>
</html>
