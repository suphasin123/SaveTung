<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

    <!-- Sub-Account Drilldown Modal -->

    <!-- Transaction Modal -->
    <div id="txModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-800 rounded-t-3xl sm:rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-4">
                <h3 id="txModalTitle" class="text-sm font-bold flex items-center gap-2">
                    <i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> บันทึกรายการใหม่
                </h3>
                <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveTransaction(event)" class="space-y-3.5">
                <input type="hidden" id="editTxId">
                <div>
                    <label class="block text-[11px] font-medium mb-1">ประเภทรายการ</label>
                    <select id="txType" onchange="onTxTypeChange()" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs">
                        <option value="expense">รายจ่าย (Expense)</option>
                        <option value="income">รายรับ (Income)</option>
                        <option value="transfer">โอนเงิน (Transfer)</option>
                        <option value="credit_spend">รูดบัตรเครดิต (Credit Spend)</option>
                        <option value="credit_payment">จ่ายบิลบัตร (Credit Payment)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-medium mb-1">จำนวนเงิน (บาท)</label>
                        <input type="number" step="0.01" id="txAmount" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium mb-1">วันและเวลา</label>
                        <input type="datetime-local" id="txDate" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-[10px]">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1" id="txWalletLabel">กระเป๋าเงินต้นทาง</label>

                </div>
                <div id="toWalletContainer" class="hidden">
                    <label class="block text-[11px] font-medium mb-1" id="txToWalletLabel">บัญชีปลายทาง</label>
                    <select id="txToWalletId" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1">หมวดหมู่ (Category)</label>
                    <select id="txCategoryId" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1">บันทึกโน้ต / รายละเอียดรายการ</label>
                    <input type="text" id="txNote" placeholder="เช่น ค่าข้าว, ช้อปปิ้งออนไลน์" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs">
                </div>
                <!-- Credit Card Installment Section -->
                <div id="installmentBox" class="p-3 bg-slate-100 dark:bg-slate-900 rounded-2xl space-y-2.5 hidden">
                    <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input type="checkbox" id="txIsInstallment" onchange="toggleInstallmentFields()" class="rounded text-emerald-600">

                    <div id="installmentFields" class="grid grid-cols-2 gap-2 hidden">

                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md shadow-emerald-600/20">บันทึกรายการ</button>

    <!-- Custom Alert Notification -->
    <div id="customAlert" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 -translate-y-20 opacity-0 max-w-xs w-full px-4 pointer-events-none">

        </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://hutcroemvwxhhyvutdfj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_IzlL-c2tws1LY_VfWWflXw_Y7v_IPpj";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isSignUpMode = false;
        let currentTab = 'dashboard';
        let analyticsAccountId = '';
        let expandedAccountType = '';
        let creditRemindersExpanded = false;

        let globalFilter = {
            mode: 'month',
            currentDate: new Date(),
            startDate: '',
            endDate: ''
        };

        let db = {
            accounts: [],
            categories: [],
            budgets: [],
            transactions: [],
            savings_goals: [],
            summary_notes: {}
        };
        const summaryNoteSaveTimers = new Map();

        let lastReminderDate = new Date().toDateString();

        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await checkAuthSession();
            setInterval(refreshCreditRemindersOnDateChange, 60 * 1000);
            document.addEventListener('visibilitychange', refreshCreditRemindersOnDateChange);
        });

        function refreshCreditRemindersOnDateChange() {
            const today = new Date().toDateString();
            if (today === lastReminderDate) return;
            lastReminderDate = today;
            if (currentUser && currentTab === 'dashboard') renderCurrentTab();
        }

        function toggleCreditReminders() {
            creditRemindersExpanded = !creditRemindersExpanded;
            renderCurrentTab();
            if (creditRemindersExpanded) {
                setTimeout(() => document.getElementById('creditReminders')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
            }
        }

        async function checkAuthSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                updateAuthUI(true);
                closeAuthScreen();
                await loadAllData();
                switchTab('dashboard');
            } else {
                currentUser = null;
                updateAuthUI(false);
                openAuthScreen();
            }
        }

        // --- AUTH FUNCTIONS ---
        function openAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function closeAuthScreen() {
            document.getElementById('authScreen').classList.add('hidden');
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authModalTitle').textContent = isSignUpMode ? 'SaveTung Sign Up' : 'SaveTung Login';
            document.getElementById('authSubtitle').textContent = isSignUpMode ? 'สมัครสมาชิกใหม่เพื่อเริ่มใช้งาน' : 'เข้าสู่ระบบด้วย Supabase เพื่อเริ่มใช้งาน';
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            try {
                if (isSignUpMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                    toggleAuthMode();
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    currentUser = data.user;
                    updateAuthUI(true);
                    closeAuthScreen();
                    await loadAllData();
                    switchTab('dashboard');
                    showAlert('เข้าสู่ระบบสำเร็จ');
                }
            } catch (err) {
                showAlert('Auth Error: ' + err.message, 'error');
            }
        }

            await supabaseClient.auth.signOut();
            currentUser = null;
            db = { accounts: [], categories: [], budgets: [], transactions: [], savings_goals: [], summary_notes: {} };
            updateAuthUI(false);

        // ==========================================
        // DIRECT SUPABASE DATABASE OPERATIONS
        // ==========================================
        async function loadAllData() {
            if (!currentUser) return;
            try {
                const userId = currentUser.id;
                const [acc, cat, bud, tx, goal] = await Promise.all([
                    supabaseClient.from('accounts').select('*').eq('user_id', userId).order('created_at', { ascending: true }),
                    supabaseClient.from('categories').select('*').eq('user_id', userId).order('created_at', { ascending: true }),
                    supabaseClient.from('budgets').select('*').eq('user_id', userId).order('created_at', { ascending: true }),
                    supabaseClient.from('transactions').select('*').eq('user_id', userId).order('transaction_date', { ascending: false }),
                    supabaseClient.from('savings_goals').select('*').eq('user_id', userId).order('created_at', { ascending: true })
                ]);

                if (acc.error) showAlert('ไม่สามารถโหลดข้อมูล บัญชี: ' + acc.error.message, 'error');
                if (cat.error) showAlert('ไม่สามารถโหลดข้อมูล หมวดหมู่: ' + cat.error.message, 'error');

                db.accounts = (acc.data || []).map(account => ({
                    ...account,
                    balance: ['credit', 'loan'].includes(account.account_type)
                        ? -Math.abs(Number(account.balance) || 0)
                        : Number(account.balance) || 0
                }));
                db.categories = cat.data || [];
                db.budgets = bud.data || [];
                db.transactions = tx.data || [];
                db.savings_goals = goal.data || [];
                db.summary_notes = Object.fromEntries(db.accounts.map(account => [String(account.id), account.note || '']));

                // Migrate notes previously stored only in this browser into the accounts table.
                for (const account of db.accounts) {
                    const accountId = String(account.id);
                    if (account.note) continue;
                    const legacyKey = `savetung-summary-note-${userId}-${accountId}`;
                    let legacyNote;
                    try {
                        legacyNote = localStorage.getItem(legacyKey);
                    } catch (error) {
                        console.warn('Unable to read legacy summary note:', error);
                        continue;
                    }
                    if (legacyNote === null) continue;
                    const { error } = await supabaseClient.from('accounts').update({ note: legacyNote })
                        .eq('id', account.id).eq('user_id', userId);
                    if (error) {
                        console.error('Summary note migration error:', error);
                    } else {
                        account.note = legacyNote;
                        db.summary_notes[accountId] = legacyNote;
                        try { localStorage.removeItem(legacyKey); } catch (error) { console.warn('Unable to remove migrated note:', error); }
                    }
                }
            } catch (e) {
                console.error("Supabase load exception:", e);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ Supabase: " + e.message, 'error');
            }
        }

        async function saveToDB(tableName, record) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล', 'error');
                return null;
            }
            delete record.id;
            record.user_id = currentUser.id;

            const { data, error } = await supabaseClient.from(tableName).insert([record]).select();
            if (error) { 
                showAlert('บันทึกเข้า Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Insert Error:", error);
                return null; 
            }
            if (data && data[0]) {
                db[tableName].push(data[0]);
            }
            return data ? data[0] : record;
        }

        async function updateInDB(tableName, id, updatedFields) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนแก้ไขข้อมูล', 'error');
                return false;
            }
            delete updatedFields.id;
            delete updatedFields.user_id;

            const { error } = await supabaseClient.from(tableName).update(updatedFields)
                .eq('id', id).eq('user_id', currentUser.id);
            if (error) { 
                showAlert('อัปเดต Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Update Error:", error);
                return false; 
            }
            const idx = db[tableName].findIndex(item => item.id === id);
            if (idx !== -1) {
                db[tableName][idx] = { ...db[tableName][idx], ...updatedFields };
            }
            return true;
        }

        async function deleteFromDB(tableName, id) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนลบข้อมูล', 'error');
                return false;
            }
            const { error } = await supabaseClient.from(tableName).delete()
                .eq('id', id).eq('user_id', currentUser.id);
            if (error) { 
                showAlert('ลบจาก Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Delete Error:", error);
                return false; 
            }
            db[tableName] = db[tableName].filter(item => item.id !== id);
            return true;
        }

        async function moveItemOrder(tableName, id, direction) {
            const list = db[tableName];
            const idx = list.findIndex(item => item.id === id);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= list.length) return;

            const temp = list[idx].order_index ?? idx;
            list[idx].order_index = list[targetIdx].order_index ?? targetIdx;
            list[targetIdx].order_index = temp;

            const item = list.splice(idx, 1)[0];
            list.splice(targetIdx, 0, item);

            for (const it of list) {
                await supabaseClient.from(tableName).update({ order_index: it.order_index })
                    .eq('id', it.id).eq('user_id', currentUser.id);
            }
            renderCurrentTab();
            showAlert('จัดลำดับสำเร็จ');
        }

        function filterTransactionsByDate(txs) {
            const d = new Date(globalFilter.currentDate);
            return txs.filter(tx => {
                if (!tx.transaction_date) return false;
                const txDate = new Date(tx.transaction_date);
                if (globalFilter.mode === 'today') {
                    return txDate.toDateString() === d.toDateString();
                } else if (globalFilter.mode === 'month') {
                    return txDate.getFullYear() === d.getFullYear() && txDate.getMonth() === d.getMonth();
                } else if (globalFilter.mode === 'year') {
                    return txDate.getFullYear() === d.getFullYear();
                } else if (globalFilter.mode === 'custom' && globalFilter.startDate && globalFilter.endDate) {
                    const start = new Date(globalFilter.startDate);
                    const end = new Date(globalFilter.endDate);
                    end.setHours(23, 59, 59, 999);
                    return txDate >= start && txDate <= end;
                }
                return true;
            });
        }

        function getCardPaymentSummary(card, today, asOfDate = today) {
            const dueDay = Number(card.due_date);
            if (!Number.isInteger(dueDay) || dueDay < 1 || dueDay > 31) return null;

            const statementDay = Math.min(Math.max(Number(card.statement_date) || 25, 1), 31);
            const dueDateForMonth = (year, month) => new Date(year, month, Math.min(dueDay, new Date(year, month + 1, 0).getDate()));
            let dueDate = dueDateForMonth(today.getFullYear(), today.getMonth());
            if (dueDate < today) dueDate = dueDateForMonth(today.getFullYear(), today.getMonth() + 1);
            const previousDueDate = dueDateForMonth(dueDate.getFullYear(), dueDate.getMonth() - 1);
            const todayEnd = new Date(asOfDate);
            todayEnd.setHours(23, 59, 59, 999);
            const dueDateEnd = new Date(dueDate);
            dueDateEnd.setHours(23, 59, 59, 999);
            if (todayEnd > dueDateEnd) todayEnd.setTime(dueDateEnd.getTime());
            const monthIndex = date => date.getFullYear() * 12 + date.getMonth();
            const items = [];

            db.transactions.forEach(tx => {
                if (tx.transaction_type !== 'credit_spend' || String(tx.wallet_id) !== String(card.id) || !tx.transaction_date) return;
                const purchaseDate = new Date(tx.transaction_date);
                if (Number.isNaN(purchaseDate.getTime())) return;

                // รายการหลังวันสรุปยอดจะไปอยู่ในรอบถัดไป ส่วนวันครบกำหนด
                // จะอยู่เดือนเดียวกับวันสรุปยอดหรือเดือนถัดไปตามลำดับวันที่
                let statementMonth = new Date(purchaseDate.getFullYear(), purchaseDate.getMonth(), 1);
                if (purchaseDate.getDate() > statementDay) statementMonth.setMonth(statementMonth.getMonth() + 1);
                const dueMonthOffset = dueDay <= statementDay ? 1 : 0;
                const firstDueDate = dueDateForMonth(statementMonth.getFullYear(), statementMonth.getMonth() + dueMonthOffset);
                const cyclesElapsed = monthIndex(dueDate) - monthIndex(firstDueDate);
                if (cyclesElapsed < 0) return;

                const amount = Number(tx.amount) || 0;
                if (tx.is_installment) {
                    const totalMonths = Number(tx.installment_total_months);
                    const currentMonth = Number(tx.installment_current_month) || 1;
                    const installmentNumber = currentMonth + cyclesElapsed;

                        note: tx.transaction_note || 'รายการผ่อนชำระ',
                        amount: amount / totalMonths,
                        installment: `${installmentNumber}/${totalMonths}`
                    });
                } else if (cyclesElapsed === 0) {
                    items.push({ note: tx.transaction_note || 'รายการบัตรเครดิต', amount, installment: '' });
                }
            });

            const scheduledAmount = items.reduce((sum, item) => sum + item.amount, 0);

                .filter(tx => tx.transaction_type === 'credit_payment' && String(tx.to_wallet_id) === String(card.id) && tx.transaction_date)
                .filter(tx => {
                    const paymentDate = new Date(tx.transaction_date);
                    return paymentDate > previousDueDate && paymentDate <= todayEnd;
                })
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            return {
                dueDate,
                items,
                scheduledAmount,
                paymentsMade,
                amountToPrepare: Math.max(0, scheduledAmount - paymentsMade)
            };

        function openTransactionModal(id = null) {
            document.querySelector('#txModal form').reset();
            if (id) {
                const tx = db.transactions.find(t => t.id === id);
                if (tx) {
                    document.getElementById('editTxId').value = tx.id;
                    document.getElementById('txType').value = tx.transaction_type;
                    document.getElementById('txAmount').value = tx.amount;
                    document.getElementById('txDate').value = tx.transaction_date ? tx.transaction_date.slice(0, 16) : new Date().toISOString().slice(0, 16);
                    document.getElementById('txNote').value = tx.transaction_note || '';
                    if (tx.is_installment) {
                        document.getElementById('txIsInstallment').checked = true;
                        document.getElementById('txCurrentMonth').value = tx.installment_current_month || 1;
                        document.getElementById('txTotalMonths').value = tx.installment_total_months || 10;
                        document.getElementById('installmentFields').classList.remove('hidden');
                    }
                    document.getElementById('txModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขรายการ';
                    onTxTypeChange();
                    document.getElementById('txWalletId').value = tx.wallet_id;
                    document.getElementById('txToWalletId').value = tx.to_wallet_id || '';
                    document.getElementById('txCategoryId').value = tx.category_id;
                }
            } else {
                document.getElementById('editTxId').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('txDate').value = now.toISOString().slice(0, 16);
                document.getElementById('txModalTitle').innerHTML = '<i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> บันทึกรายการใหม่';
                onTxTypeChange();
            }
            document.getElementById('txModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function onTxTypeChange() {
            const type = document.getElementById('txType').value;
            const walletSelect = document.getElementById('txWalletId');
            const toWalletSelect = document.getElementById('txToWalletId');
            const categorySelect = document.getElementById('txCategoryId');
            const toWalletContainer = document.getElementById('toWalletContainer');
            const installmentBox = document.getElementById('installmentBox');
            const txWalletLabel = document.getElementById('txWalletLabel');
            const txToWalletLabel = document.getElementById('txToWalletLabel');

            if (!walletSelect || !toWalletSelect || !categorySelect) return;

            // บัญชีและประเภทบัตรเครดิตเท่านั้นสำหรับ credit_spend และ credit_payment
            const creditAccounts = db.accounts.filter(a => a.account_type === 'credit');
            const nonCreditAccounts = db.accounts.filter(a => a.account_type !== 'credit');
            const allAccounts = db.accounts;

            if (type === 'credit_spend') {
                // รูดบัตร -> กระเป๋าหลักต้องเป็นบัตรเครดิตเท่านั้น
                txWalletLabel.textContent = 'เลือกบัตรเครดิตที่รูด';
                walletSelect.innerHTML = creditAccounts.map(a => `<option value="${a.id}">[บัตรเครดิต] ${a.account_name}</option>`).join('');
                toWalletContainer.classList.add('hidden');
                installmentBox.classList.remove('hidden');
            } else if (type === 'credit_payment') {
                // จ่ายบิลบัตร -> กระเป๋าหลักคือบัญชีที่จ่ายเงิน (ธนาคาร/เงินสด), บัญชีปลายทางคือบัตรเครดิต
                txWalletLabel.textContent = 'จ่ายจากบัญชี (เงินสด/ธนาคาร)';
                walletSelect.innerHTML = nonCreditAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                txToWalletLabel.textContent = 'ชำระเข้าบัตรเครดิตใบไหน';
                toWalletSelect.innerHTML = creditAccounts.map(a => `<option value="${a.id}">[บัตรเครดิต] ${a.account_name}</option>`).join('');
                
                toWalletContainer.classList.remove('hidden');
                installmentBox.classList.add('hidden');
            } else if (type === 'transfer') {
                txWalletLabel.textContent = 'บัญชีต้นทาง';
                walletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                txToWalletLabel.textContent = 'บัญชีปลายทาง';
                toWalletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                toWalletContainer.classList.remove('hidden');
                installmentBox.classList.add('hidden');
            } else {
                // expense / income
                txWalletLabel.textContent = 'กระเป๋าเงิน / บัญชี';
                walletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                toWalletContainer.classList.add('hidden');
                installmentBox.classList.add('hidden');
            }

            categorySelect.innerHTML = db.categories.map(c => `<option value="${c.id}">${c.category_name} (${c.category_type})</option>`).join('');
        }

        function toggleInstallmentFields() {
            const checked = document.getElementById('txIsInstallment')?.checked;

            if (checked) fields.classList.remove('hidden');

        function getTransactionBalanceDeltas(tx) {
            const deltas = new Map();
            const addDelta = (accountId, delta) => {
                if (accountId) deltas.set(accountId, (deltas.get(accountId) || 0) + delta);
            };
            const amount = Number(tx.amount) || 0;

            switch (tx.transaction_type) {
                case 'income':
                    addDelta(tx.wallet_id, amount);
                    break;
                case 'transfer':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'credit_payment':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'expense':
                case 'credit_spend':
                    addDelta(tx.wallet_id, -amount);
                    break;
            }
            return deltas;
        }

        async function applyTransactionBalanceDeltas(deltas) {
            for (const [accountId, delta] of deltas) {
                if (!delta) continue;
                const account = db.accounts.find(a => a.id === accountId);
                if (!account) {
                    showAlert('ไม่พบบัญชีที่ผูกกับรายการนี้', 'error');
                    return false;
                }
                const balance = Number(account.balance) + delta;
                if (!await updateInDB('accounts', accountId, { balance })) return false;
            }
            return true;
        }

        async function handleSaveTransaction(e) {
            e.preventDefault();
            const editId = document.getElementById('editTxId').value;
            const type = document.getElementById('txType').value;
            const amount = Number(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;
            const wallet_id = document.getElementById('txWalletId').value;
            const to_wallet_id = document.getElementById('txToWalletId').value || null;
            const category_id = document.getElementById('txCategoryId').value;
            const note = document.getElementById('txNote').value;

            if (!Number.isFinite(amount) || amount <= 0 || !wallet_id || !category_id) {
                showAlert('กรุณาระบุจำนวนเงิน บัญชี และหมวดหมู่ให้ถูกต้อง', 'error');
                return;
            }
            if (['transfer', 'credit_payment'].includes(type) && (!to_wallet_id || wallet_id === to_wallet_id)) {
                showAlert('กรุณาเลือกบัญชีปลายทางที่แตกต่างจากบัญชีต้นทาง', 'error');
                return;
            }

            const is_installment = type === 'credit_spend' && (document.getElementById('txIsInstallment')?.checked || false);
            const installment_current_month = is_installment ? Number(document.getElementById('txCurrentMonth').value) : null;
            const installment_total_months = is_installment ? Number(document.getElementById('txTotalMonths').value) : null;
            const txData = {
                transaction_date: new Date(date).toISOString(),
                transaction_type: type,
                amount,
                wallet_id,
                to_wallet_id,
                category_id,
                transaction_note: note,
                is_installment,
                installment_total_months,
                installment_current_month
            };

            const oldTx = editId ? db.transactions.find(tx => tx.id === editId) : null;
            const saved = editId
                ? await updateInDB('transactions', editId, txData)
                : await saveToDB('transactions', txData);
            if (!saved) return;

            const balanceDeltas = new Map();
            const mergeDeltas = (source, multiplier) => {
                for (const [accountId, delta] of getTransactionBalanceDeltas(source)) {
                    balanceDeltas.set(accountId, (balanceDeltas.get(accountId) || 0) + delta * multiplier);
                }
            };
            if (oldTx) mergeDeltas(oldTx, -1);
            mergeDeltas(txData, 1);
            if (!await applyTransactionBalanceDeltas(balanceDeltas)) return;

            closeTransactionModal();
            await loadAllData();
            renderCurrentTab();
            showAlert(editId ? 'แก้ไขรายการสำเร็จ' : 'บันทึกรายการสำเร็จ');
        }

        async function deleteTransaction(id) {
            if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
                const tx = db.transactions.find(item => item.id === id);
                if (!tx || !await deleteFromDB('transactions', id)) return;
                const reverseDeltas = new Map(
                    [...getTransactionBalanceDeltas(tx)].map(([accountId, delta]) => [accountId, -delta])
                );
                if (!await applyTransactionBalanceDeltas(reverseDeltas)) return;
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบรายการสำเร็จ', 'success');
            }
        }

        // --- Corrected General Ledger Calculations & Display ---
        function openAccountLedger(accountId) {
            const acc = db.accounts.find(a => a.id === accountId);
            if (!acc) return;

            // 1. ดึงรายการธุรกรรมของบัญชีนี้ และเรียงจาก "เก่าไปใหม่" (Chronological Order)
            const accTxs = db.transactions.filter(t => t.wallet_id === accountId || t.to_wallet_id === accountId);
            accTxs.sort((a, b) => new Date(a.transaction_date) - new Date(b.transaction_date));

            // 2. รวมผลกระทบของรายการเพื่อคำนวณยอดตั้งต้น
            let totalNetChange = 0;
            accTxs.forEach(t => {
                totalNetChange += getTransactionBalanceDeltas(t).get(accountId) || 0;
            });

            // หนี้สินเก็บยอดติดลบในฐานข้อมูล แต่แสดงยอดหนี้เป็นจำนวนบวก
            const isLiability = ['credit', 'loan'].includes(acc.account_type);
            const initialStartBalance = Number(acc.balance) - totalNetChange;

            // 3. วนลูปคำนวณยอดคงเหลือ โดยกลับทิศทางผลกระทบสำหรับบัญชีหนี้สิน
            let runningBalance = isLiability ? -initialStartBalance : initialStartBalance;
            let rowsHtml = '';

            if (accTxs.length === 0) {
                rowsHtml = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs">ยังไม่มีรายการเคลื่อนไหวในบัญชีนี้</td></tr>`;
            } else {
                rowsHtml = accTxs.map(t => {
                    const amount = Number(t.amount);
                    const accountDelta = getTransactionBalanceDeltas(t).get(accountId) || 0;
                    const balanceDelta = isLiability ? -accountDelta : accountDelta;
                    runningBalance += balanceDelta;
                    const increasesBalance = balanceDelta > 0;

                    const d = new Date(t.transaction_date);
                    const dateStr = d.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' });
                    const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                    return `
                        <tr class="border-b border-slate-100 dark:border-slate-700/50 text-[11px]">
                            <td class="py-2.5 px-2 text-slate-400">${dateStr} <span class="text-[9px] block">${timeStr}</span></td>
                            <td class="py-2.5 px-2 font-medium">
                                <div>${t.transaction_note || '-'}</div>
                                <div class="text-[9px] text-slate-400 uppercase">ประเภท: ${t.transaction_type}</div>
                            </td>
                            <td class="py-2.5 px-2 text-right text-emerald-600 font-semibold">${increasesBalance ? (isLiability ? '฿' : '+฿') + amount.toLocaleString() : '-'}</td>
                            <td class="py-2.5 px-2 text-right text-rose-500 font-semibold">${balanceDelta < 0 ? (isLiability ? '฿' : '-฿') + amount.toLocaleString() : '-'}</td>
                            <td class="py-2.5 px-2 text-right font-bold text-slate-700 dark:text-slate-200">฿${runningBalance.toLocaleString()}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('ledgerTitle').innerHTML = `<i data-lucide="book-open" class="w-4 h-4 text-emerald-500"></i> สมุดบัญชี: ${acc.account_name}`;
            document.getElementById('ledgerContent').innerHTML = `
                <div class="bg-emerald-50 dark:bg-emerald-950/40 p-3 rounded-2xl flex justify-between items-center text-xs mb-3 border border-emerald-100 dark:border-emerald-900/40">
                    <span class="text-slate-600 dark:text-slate-300 font-medium">${isLiability ? 'ยอดหนี้ปัจจุบัน (Outstanding Debt)' : 'ยอดคงเหลือปัจจุบัน (Ending Balance)'}</span>
                    <span class="font-bold text-base text-emerald-600">฿${Math.abs(Number(acc.balance)).toLocaleString()}</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-700 text-[10px] text-slate-400 uppercase">
                                <th class="py-2 px-2">วัน-เวลา</th>
                                <th class="py-2 px-2">รายการ / โน้ต</th>
                                <th class="py-2 px-2 text-right">${isLiability ? 'หนี้เพิ่ม' : 'เพิ่ม (DEBIT)'}</th>
                                <th class="py-2 px-2 text-right">${isLiability ? 'หนี้ลด' : 'ลด (CREDIT)'}</th>
                                <th class="py-2 px-2 text-right">คงเหลือ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
                ${renderSummaryNote(accountId)}
            `;
            document.getElementById('ledgerModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function openBudgetModal(id = null) {
            if (id) {
                const bud = db.budgets.find(b => b.id === id);
                if (bud) {
                    document.getElementById('editBudId').value = bud.id;
                    document.getElementById('budName').value = bud.budget_name;
                    document.getElementById('budCategoryId').value = bud.category_id;
                    document.getElementById('budLimit').value = bud.budget_limit;
                    document.getElementById('budStart').value = bud.start_period;
                    document.getElementById('budEnd').value = bud.end_period;
                    document.getElementById('budModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขงบประมาณ';
                }
            } else {
                document.getElementById('editBudId').value = '';
                document.getElementById('budName').value = '';
                document.getElementById('budModalTitle').innerHTML = '<i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i> ตั้งงบประมาณรายจ่าย';
            }
            document.getElementById('budModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeBudgetModal() { document.getElementById('budModal').classList.add('hidden'); }

        function openGoalModal(id = null) {
            if (id) {
                const goal = db.savings_goals.find(g => g.id === id);
                if (goal) {
                    document.getElementById('editGoalId').value = goal.id;
                    document.getElementById('goalTitle').value = goal.goal_title;
                    document.getElementById('goalTarget').value = goal.target_amount;
                    document.getElementById('goalCurrent').value = goal.current_amount;
                    document.getElementById('goalPeriods').value = goal.total_periods;
                    document.getElementById('goalMonthly').value = goal.monthly_target;
                    document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขเป้าหมาย';
                }
            } else {
                document.getElementById('editGoalId').value = '';
                document.getElementById('goalTitle').value = '';
                document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> เพิ่มเป้าหมายเงินออม';
            }
            document.getElementById('goalModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeGoalModal() { document.getElementById('goalModal').classList.add('hidden'); }

        async function handleSaveBudget(e) {
            e.preventDefault();
            const editId = document.getElementById('editBudId').value;
            const budData = {
                budget_name: document.getElementById('budName').value,
                category_id: document.getElementById('budCategoryId').value,
                budget_limit: Number(document.getElementById('budLimit').value),
                start_period: document.getElementById('budStart').value,
                end_period: document.getElementById('budEnd').value
            };
            if (editId) {
                await updateInDB('budgets', editId, budData);
                showAlert('แก้ไขงบประมาณสำเร็จ');
            } else {
                await saveToDB('budgets', budData);
                showAlert('สร้างงบประมาณสำเร็จ');
            }
            closeBudgetModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function handleSaveGoal(e) {
            e.preventDefault();
            const editId = document.getElementById('editGoalId').value;
            const goalData = {
                goal_title: document.getElementById('goalTitle').value,
                target_amount: Number(document.getElementById('goalTarget').value),
                current_amount: Number(document.getElementById('goalCurrent').value),
                total_periods: Number(document.getElementById('goalPeriods').value),
                saved_periods: 0,
                monthly_target: Number(document.getElementById('goalMonthly').value)
            };
            if (editId) {
                await updateInDB('savings_goals', editId, goalData);
                showAlert('แก้ไขเป้าหมายสำเร็จ');
            } else {
                await saveToDB('savings_goals', goalData);
                showAlert('สร้างเป้าหมายสำเร็จ');
            }
            closeGoalModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function deleteBudget(id) {
            if (confirm('ต้องการลบงบประมาณนี้ใช่หรือไม่?')) {
                await deleteFromDB('budgets', id);
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบงบประมาณสำเร็จ', 'success');
            }
        }
        async function deleteGoal(id) {
            if (confirm('ต้องการลบเป้าหมายนี้ใช่หรือไม่?')) {
                await deleteFromDB('savings_goals', id);
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบเป้าหมายสำเร็จ', 'success');
            }
        }

        function renderAnalytics(container) {
            const filteredTxs = filterTransactionsByDate(db.transactions);
            const totalAssets = db.accounts
                .filter(account => ['cash', 'bank', 'investment'].includes(account.account_type))

            const totalLiabilities = db.accounts
                .filter(account => ['credit', 'loan'].includes(account.account_type))

            const netWorth = totalAssets - totalLiabilities;

            const isAllAccounts = analyticsAccountId === 'all';

            const accountExpenseByCategory = Object.values(accountExpenseTxs.reduce((groups, tx) => {
                const category = db.categories.find(item => item.id === tx.category_id);

                if (!groups[key]) groups[key] = { name: category ? category.category_name : 'ไม่ระบุหมวดหมู่', color: category?.color || '#94a3b8', total: 0 };
                groups[key].total += Number(tx.amount) || 0;
                return groups;

            const expenseByCategory = db.categories
                .filter(category => category.category_type === 'expense')

                    ? Math.abs(Number(account.balance) || 0)

                                        <div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700"><div class="h-full rounded-full" style="width:${percent}%;background-color:${category.color}"></div></div>
                                    </div>`;
                                }).join('') || '<div class="rounded-2xl bg-slate-50 py-5 text-center text-[10px] text-slate-400 dark:bg-slate-900">ไม่มีรายจ่ายของบัญชีนี้ในช่วงเวลาที่เลือก</div>'}
                            </div>
                            ${accountExpenseTxs.length ? `
                                <div class="mt-4 border-t border-slate-100 pt-3 dark:border-slate-700">
                                    <div class="mb-2 text-[10px] font-bold text-slate-500 dark:text-slate-400">รายการล่าสุด</div>
                                    <div class="space-y-2">
                                        ${[...accountExpenseTxs].sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date)).slice(0, 5).map(tx => {
                                            const category = db.categories.find(item => item.id === tx.category_id);
                                            const account = db.accounts.find(item => item.id === tx.wallet_id);
                                            const date = new Date(tx.transaction_date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                                            const accountLabel = isAllAccounts && account ? ` · ${escapeHtml(account.account_name)}` : '';
                                            return `<div class="flex items-center justify-between gap-2 text-[10px]"><div class="min-w-0"><div class="truncate font-medium text-slate-700 dark:text-slate-200">${escapeHtml(tx.transaction_note || category?.category_name || 'รายจ่าย')}</div><div class="text-[9px] text-slate-400">${escapeHtml(category?.category_name || 'ไม่ระบุหมวดหมู่')}${accountLabel} · ${date}</div></div><span class="shrink-0 font-semibold text-slate-700 dark:text-slate-200">−${formatBaht(Number(tx.amount) || 0)}</span></div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        ` : '<div class="rounded-2xl bg-slate-50 py-6 text-center text-[10px] text-slate-400 dark:bg-slate-900">เพิ่มบัญชีและบันทึกรายจ่ายเพื่อดูการวิเคราะห์</div>'}
                    </section>

                    <section class="rounded-3xl border border-slate-200/80 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                        <div class="mb-3 flex items-center justify-between gap-2">
                            <div><h3 class="text-xs font-bold text-slate-800 dark:text-white">รายจ่ายตามหมวดหมู่</h3>
<p class="mt-0.5 text-[9px] text-slate-400">สัดส่วนจากช่วงเวลาที่เลือก</p></div>
                            <span class="rounded-full bg-orange-50 px-2.5 py-1 text-[9px] font-semibold text-orange-600 dark:bg-orange-950/30 dark:text-orange-300">${expenseByCategory.length} หมวด</span>
                        </div>
                        <div class="relative h-56">
                            ${expenseByCategory.length ? '<canvas id="expenseChart"></canvas>' : '<div class="flex h-full flex-col items-center justify-center rounded-2xl bg-slate-50 text-center dark:bg-slate-900"><span class="mb-2 flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 text-slate-400 dark:bg-slate-800"><i data-lucide="chart-pie" class="h-5 w-5"></i></span><p class="text-xs font-medium text-slate-500">ยังไม่มีรายจ่ายในช่วงนี้</p><p class="mt-1 text-[10px] text-slate-400">ลองเปลี่ยนช่วงเวลาเพื่อดูข้อมูล</p></div>'}
                        </div>
                    </section>

                    <section class="rounded-3xl border border-slate-200/80 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                        <div class="mb-3 flex items-center justify-between gap-2">
                            <div><h3 class="text-xs font-bold text-slate-800 dark:text-white">ยอดแต่ละบัญชี</h3><p class="mt-0.5 text-[9px] text-slate-400">หนี้สินแสดงเป็นยอดหนี้คงค้าง</p></div>
                            <span class="rounded-full bg-blue-50 px-2.5 py-1 text-[9px] font-semibold text-blue-600 dark:bg-blue-950/40 dark:text-blue-300">${accountBalances.length} บัญชี</span>
                        </div>
                        ${accountBalances.length ? `<div style="height:${Math.max(210, accountBalances.length * 38)}px"><canvas id="accountChart"></canvas></div>` : '<div class="flex h-40 flex-col items-center justify-center rounded-2xl bg-slate-50 text-center dark:bg-slate-900"><span class="mb-2 flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 text-slate-400 dark:bg-slate-800"><i data-lucide="wallet" class="h-5 w-5"></i></span><p class="text-xs font-medium text-slate-500">ยังไม่มีบัญชี</p></div>'}
                    </section>
                </div>
            `;

            setTimeout(() => {
                const formatTooltipBaht = value => `฿${Number(value).toLocaleString('th-TH', { maximumFractionDigits: 2 })}`;
                const palette = ['#2563eb', '#8b5cf6', '#f97316', '#14b8a6', '#ec4899', '#f59e0b', '#06b6d4', '#84cc16'];
                const expenseCanvas = document.getElementById('expenseChart');
                if (expenseCanvas) {
                    new Chart(expenseCanvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: expenseByCategory.map(category => category.category_name),
                            datasets: [{
                                data: expenseByCategory.map(category => category.total),
                                backgroundColor: expenseByCategory.map((category, index) => category.color || palette[index % palette.length]),
                                borderColor: document.documentElement.classList.contains('dark') ? '#273449' : '#ffffff',
                                borderWidth: 4,
                                hoverOffset: 7,
                                borderRadius: 5,
                                spacing: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '72%',
                            plugins: {
                                legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 7, padding: 14, font: { family: 'Prompt', size: 10 } } },
                                tooltip: { callbacks: { label: context => ` ${context.label}: ${formatTooltipBaht(context.raw)}` } }
                            }
                        },
                        plugins: [{
                            id: 'expenseCenterLabel',
                            afterDraw(chart) {
                                const { ctx, chartArea } = chart;
                                if (!chartArea) return;
                                const x = (chartArea.left + chartArea.right) / 2;
                                const y = (chartArea.top + chartArea.bottom) / 2;
                                ctx.save();
                                ctx.textAlign = 'center';
                                ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
                                ctx.font = '10px Prompt, sans-serif';
                                ctx.fillText('รวมรายจ่าย', x, y - 8);
                                ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#f8fafc' : '#0f172a';
                                ctx.font = 'bold 14px Prompt, sans-serif';
                                ctx.fillText(formatTooltipBaht(periodExpense), x, y + 14);
                                ctx.restore();
                            }
                        }]
                    });
                }

                const accountCanvas = document.getElementById('accountChart');
                if (accountCanvas) {
                    new Chart(accountCanvas.getContext('2d'), {
                        type: 'bar',
                        data: {
                            labels: accountBalances.map(account => account.name),
                            datasets: [{
                                data: accountBalances.map(account => account.balance),
                                backgroundColor: accountBalances.map(account => ['credit', 'loan'].includes(account.type) ? '#fb7185' : '#3b82f6'),
                                borderRadius: 8,
                                borderSkipped: false,
                                barThickness: 18
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            layout: { padding: { right: 8 } },
                            plugins: {
                                legend: { display: false },
                                tooltip: { callbacks: { label: context => ` ${['credit', 'loan'].includes(accountBalances[context.dataIndex].type) ? 'ยอดหนี้' : 'ยอดเงิน'}: ${formatTooltipBaht(context.raw)}` } }
                            },
                            scales: {
                                x: { beginAtZero: true, grid: { color: 'rgba(148,163,184,0.15)' }, ticks: { callback: value => Number(value).toLocaleString('th-TH'), font: { family: 'Prompt', size: 9 } } },
                                y: { grid: { display: false }, ticks: { font: { family: 'Prompt', size: 10 }, color: document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#475569' } }
                            }
                        }
                    });
                }
            }, 100);
        }
    </script>
</body>
</html>
