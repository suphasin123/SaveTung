<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaveTung - ระบบบันทึกรายรับรายจ่าย (Supabase Online)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Font (Noto Sans Thai) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS for Excel workbooks with multiple worksheets -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { font-size: 17px; }
        body { font-family: 'Noto Sans Thai', sans-serif; -webkit-tap-highlight-color: transparent; }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        @media (min-width: 640px) {
            body { background-color: #eef1f5; }
            .mobile-frame-wrapper {
                display: flex;
                align-items: stretch;
                justify-content: center;
                min-height: 100vh;
                padding: 0;
            }
            .mobile-container {
                width: 100%;
                max-width: 1440px;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: 0;
                overflow: hidden;
            }
            #mainContent {
                padding: 1.5rem 2rem 6rem;
            }
            #mainContent > div {
                width: 100%;
                max-width: 1100px;
                margin-inline: auto;
            }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .account-item:has(details[open]) { z-index: 40; }

        /* Soft neutral surfaces with a navy-and-blue primary palette. */
        body { background-color: #f1f4f8; }
        .mobile-container { background-color: #ffffff; }
        .bg-slate-50 { background-color: #ffffff !important; }
        .bg-slate-100 { background-color: #f3f5f8 !important; }
        .border-slate-200, .border-slate-200\/80 { border-color: #e3e8f0 !important; }
        .bg-emerald-600 { background-color: #2563eb !important; }
        .bg-emerald-600.text-white { color: #ffffff !important; }
        .hover\:bg-emerald-700:hover { background-color: #1d4ed8 !important; }
        .bg-emerald-500 { background-color: #3b82f6 !important; }
        .text-emerald-600, .text-emerald-700 { color: #2563eb !important; }
        .text-emerald-500 { color: #3b82f6 !important; }
        .border-emerald-200, .border-emerald-100 { border-color: #bfdbfe !important; }
        .bg-emerald-50 { background-color: #eff6ff !important; }
        .bg-emerald-100 { background-color: #dbeafe !important; }
        .shadow-emerald-600\/20, .shadow-emerald-600\/40, .shadow-emerald-500\/30 { --tw-shadow-color: rgb(37 99 235 / 0.2) !important; }
        .bg-gradient-to-br.from-emerald-600.to-teal-700 { background-image: linear-gradient(125deg, #17243a 0%, #1e3a68 100%) !important; color: #ffffff !important; }
        .bg-gradient-to-r.from-emerald-600.to-teal-600 { background-image: linear-gradient(to right, #2563eb, #4f46e5) !important; }
        .bg-gradient-to-br.from-emerald-600.to-teal-700 .text-emerald-100,
        .bg-gradient-to-br.from-emerald-600.to-teal-700 .text-emerald-200 { color: #dbeafe !important; }
        input:focus, select:focus, textarea:focus { border-color: #60a5fa !important; }
        ::selection { background: #bfdbfe; color: #172554; }
        @media (min-width: 640px) {
            body { background-color: #eef1f5; }
        }
        .dark [class~="dark:bg-slate-900"] { background-color: #1e293b !important; }
        .dark [class~="dark:bg-slate-950"] { background-color: #111827 !important; }
        .dark [class~="dark:bg-slate-800"] { background-color: #273449 !important; }
        .dark [class~="dark:border-slate-700"], .dark [class~="dark:border-slate-700/50"], .dark [class~="dark:border-slate-700/80"] { border-color: #3b4b63 !important; }
        .dark [class~="dark:text-emerald-300"], .dark [class~="dark:text-emerald-400"] { color: #93c5fd !important; }
        .dark [class~="dark:bg-emerald-900/40"], .dark [class~="dark:bg-emerald-950/30"], .dark [class~="dark:bg-emerald-950/40"], .dark [class~="dark:bg-emerald-950/20"] { background-color: #1e3a5f !important; }
        .dark [class~="dark:border-emerald-700/50"], .dark [class~="dark:border-emerald-900/50"], .dark [class~="dark:border-emerald-900/40"], .dark [class~="dark:border-emerald-900/30"] { border-color: #315b91 !important; }
        .dark [class~="dark:bg-slate-700"] { background-color: #334155 !important; }
        .dark [class~="dark:bg-slate-600"] { background-color: #475569 !important; }
        .dark [class~="dark:text-emerald-400"] { color: #93c5fd !important; }

        /* Improve readability for compact labels and secondary text. */
        [class~="text-[9px]"] { font-size: 11px !important; }
        [class~="text-[10px]"] { font-size: 12px !important; }
        [class~="text-[11px]"] { font-size: 13px !important; }
        [class~="text-xs"] { font-size: 14px !important; }
        .text-slate-400 { color: #64748b !important; }
        .dark .text-slate-400 { color: #a8b7cb !important; }
        .account-select-option { background-color: #ffffff; color: #334155; }
        .dark .account-select-option { background-color: #273449; color: #e2e8f0; }
        .account-picker-source { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .account-picker-menu { scrollbar-width: thin; }
        @media (max-width: 639px) {
            .account-picker-backdrop {
                position: fixed;
                inset: 0;
                z-index: 99;
                background: rgba(15, 23, 42, 0.58);
                backdrop-filter: blur(3px);
            }
            .account-picker-menu.account-picker-fullscreen {
                position: fixed !important;
                inset: 50% auto auto 50% !important;
                z-index: 100 !important;
                width: min(92vw, 480px) !important;
                max-height: 84vh !important;
                max-height: 84dvh !important;
                margin: 0 !important;
                overflow-y: auto;
                border-radius: 1.5rem !important;
                padding: 1rem;
                transform: translate(-50%, -50%);
                box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
            }
            .account-picker-menu .account-picker-heading {
                font-size: 1rem !important;
                line-height: 1.5rem;
                padding: 0.75rem 1rem;
            }
        }
        .account-picker-menu .account-picker-heading {
            font-size: 0.95rem;
            line-height: 1.4rem;
            padding: 0.7rem 0.9rem;
        }
        .account-picker-menu .account-picker-topbar { display: none; }
        @media (max-width: 639px) {
            .account-picker-menu .account-picker-topbar {
                display: flex;
                position: sticky;
                top: -1rem;
                z-index: 2;
                align-items: center;
                justify-content: space-between;
                margin: -1rem -1rem 1rem;
                padding: 1rem;
                background: #ffffff;
                border-bottom: 1px solid #e3e8f0;
            }
            .dark .account-picker-menu .account-picker-topbar {
                background: #1e293b;
                border-color: #3b4b63;
            }
        }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

    <!-- Auth Mandatory Screen Modal -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="text-center space-y-1">
                <div class="w-14 h-14 bg-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-white shadow-lg shadow-emerald-500/30 mb-2">
                    <i data-lucide="wallet" class="w-7 h-7"></i>
                </div>
                <h2 id="authModalTitle" class="text-lg font-bold bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">SaveTung Login</h2>
                <p id="authSubtitle" class="text-xs text-slate-400">เข้าสู่ระบบด้วย Supabase เพื่อเริ่มใช้งาน</p>
            </div>
            
            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium mb-1">อีเมล (Email)</label>
                    <input type="email" id="authEmail" required placeholder="user@example.com" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md shadow-emerald-600/20">เข้าสู่ระบบ</button>
            </form>
            
            <div class="text-center pt-2">
                <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-xs text-emerald-600 dark:text-emerald-400 font-medium hover:underline">ยังไม่มีบัญชี? สมัครสมาชิก</button>
            </div>
        </div>
    </div>

    <div class="mobile-frame-wrapper w-full h-full">
        <div id="app" class="mobile-container w-full h-full bg-slate-50 dark:bg-slate-900 flex flex-col relative overflow-hidden">
            
            <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/80 px-4 py-3 flex items-center justify-between shrink-0 z-20">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-500/30">
                        <i data-lucide="wallet" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold leading-tight bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">SaveTung</h1>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400" id="userEmailDisplay">กรุณาเข้าสู่ระบบ</p>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5">
                    <span id="syncStatusBadge" class="px-2.5 py-1 rounded-full text-[10px] font-medium bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 flex items-center gap-1" role="status" aria-live="polite">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>
                        <span>กำลังเชื่อมต่อ</span>
                    </span>
                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i id="darkModeIcon" data-lucide="moon" class="w-4 h-4"></i>
                    </button>
                    <!-- Logout Button -->
                    <button onclick="handleLogout()" id="logoutBtn" class="p-2 rounded-xl text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition hidden" title="ออกจากระบบ">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <main id="mainContent" class="flex-1 overflow-y-auto p-4 pb-24 no-scrollbar">
                <!-- Views Rendered Here -->
            </main>

            <!-- Floating Quick Add Transaction Button -->
            <div class="absolute bottom-20 right-4 z-30">
                <button onclick="openTransactionModal()" class="w-11 h-11 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center justify-center shadow-xl shadow-emerald-600/40 transform active:scale-95 transition-all" title="บันทึกรายการ">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>

            <nav class="absolute bottom-0 left-0 right-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 px-1 py-2 flex justify-around items-center z-20">
                <button onclick="switchTab('dashboard')" class="nav-btn flex flex-col items-center py-1 px-2 text-emerald-600 dark:text-emerald-400" data-tab="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">ภาพรวม</span>
                </button>
                <button onclick="switchTab('transactions')" class="nav-btn flex flex-col items-center py-1 px-2 text-slate-400 dark:text-slate-400" data-tab="transactions">
                    <i data-lucide="receipt" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">บันทึก</span>
                </button>
                <button onclick="switchTab('accounts')" class="nav-btn flex flex-col items-center py-1 px-2 text-slate-400 dark:text-slate-400" data-tab="accounts">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">กระเป๋าเงิน</span>
                </button>
                <button onclick="switchTab('categories')" class="nav-btn flex flex-col items-center py-1 px-2 text-slate-400 dark:text-slate-400" data-tab="categories">
                    <i data-lucide="tags" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">หมวดหมู่</span>
                </button>
                <button onclick="switchTab('budgets_goals')" class="nav-btn flex flex-col items-center py-1 px-2 text-slate-400 dark:text-slate-400" data-tab="budgets_goals">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">งบ/เป้าหมาย</span>
                </button>
                <button onclick="switchTab('analytics')" class="nav-btn flex flex-col items-center py-1 px-2 text-slate-400 dark:text-slate-400" data-tab="analytics">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i>
                    <span class="text-[10px] mt-0.5 font-medium">วิเคราะห์</span>
                </button>
            </nav>

        </div>
    </div>

    <!-- Sub-Account Drilldown Modal -->
    <div id="subAccountModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-3">
                <h3 id="subAccountTitle" class="text-sm font-bold flex items-center gap-2">
                    <i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i> รายการกระเป๋าเงิน
                </h3>
                <button onclick="closeSubAccountModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="subAccountContent" class="space-y-2.5"></div>
        </div>
    </div>

    <!-- Account General Ledger Modal -->
    <div id="ledgerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-3">
                <h3 id="ledgerTitle" class="text-sm font-bold flex items-center gap-2">
                    <i data-lucide="book-open" class="w-4 h-4 text-emerald-500"></i> สมุดบัญชีแยกประเภท (General Ledger)
                </h3>
                <button onclick="closeAccountLedger()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="ledgerContent" class="space-y-3"></div>
        </div>
    </div>

    <!-- Transaction Modal -->
    <div id="txModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-800 rounded-t-3xl sm:rounded-3xl max-w-md w-full p-4 sm:p-6 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[92vh] max-h-[92dvh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-4">
                <h3 id="txModalTitle" class="text-sm font-bold flex items-center gap-2">
                    <i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> บันทึกรายการใหม่
                </h3>
                <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveTransaction(event)" class="space-y-4">
                <input type="hidden" id="editTxId">
                <div class="rounded-2xl border border-blue-100 bg-blue-50/60 p-3 space-y-2 dark:border-slate-700 dark:bg-slate-900/50">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-200">เลือกประเภทรายการ</label>
                    <select id="txType" onchange="onTxTypeChange()" class="w-full px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-semibold">
                        <option value="expense">รายจ่าย</option>
                        <option value="income">รายรับ</option>
                        <option value="transfer">โอนเงิน</option>
                        <option value="credit_spend">รูดบัตรเครดิต</option>
                        <option value="credit_payment">จ่ายบิลบัตรเครดิต</option>
                        <option value="saving">เงินออม</option>
                    </select>
                </div>
                <div class="rounded-2xl border border-slate-200 p-3 space-y-3 dark:border-slate-700">
                    <div>
                        <label class="block text-xs font-bold mb-1" id="txWalletLabel">เลือกบัญชี</label>
                    <select id="txWalletId" required class="account-picker-source" aria-hidden="true" tabindex="-1"></select>
                </div>
                <div id="toWalletContainer" class="hidden">
                    <label class="block text-[11px] font-medium mb-1" id="txToWalletLabel">บัญชีปลายทาง</label>
                    <select id="txToWalletId" class="account-picker-source" aria-hidden="true" tabindex="-1"></select>
                </div>
                <div id="savingsGoalContainer" class="hidden">
                    <label class="block text-xs font-bold mb-1" for="txSavingsGoalId">เลือกเป้าหมายเงินออม</label>
                    <select id="txSavingsGoalId" class="w-full px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm"></select>
                </div>
                </div>
                <section class="rounded-2xl border border-slate-200 p-3 space-y-3 dark:border-slate-700">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold mb-1.5">จำนวนเงิน (บาท)</label>
                    <input type="number" step="0.01" min="0.01" inputmode="decimal" id="txAmount" required placeholder="0.00" class="w-full px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-lg font-semibold">
                </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">วันที่และเวลา</label>
                        <input type="datetime-local" id="txDate" required class="w-full min-w-0 px-2 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">
                    </div>
                </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">หมวดหมู่</label>
                        <select id="txCategoryId" required class="w-full px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5">รายละเอียด (ไม่บังคับ)</label>
                        <input type="text" id="txNote" placeholder="เช่น ค่าอาหาร หรือเงินเดือน" class="w-full px-3 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm">
                    </div>
                </section>
                <!-- Credit Card Installment Section -->
                <div id="installmentBox" class="p-3 bg-slate-100 dark:bg-slate-900 rounded-2xl space-y-2.5 hidden">
                    <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                        <input type="checkbox" id="txIsInstallment" onchange="toggleInstallmentFields()" class="rounded text-emerald-600">
                        รายการนี้เป็นการผ่อนชำระ
                    </label>
                    <div id="installmentFields" class="grid grid-cols-2 gap-2 hidden">
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-0.5">งวดปัจจุบัน</label>
                            <input type="number" id="txCurrentMonth" value="1" min="1" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-white dark:bg-slate-800">
                        </div>
                        <div>

        function roundMoney(value) {
            const amount = Number(value);
            if (!Number.isFinite(amount)) return 0;
            const adjustment = Math.sign(amount) * Number.EPSILON * Math.max(1, Math.abs(amount));
            return Math.round((amount + adjustment) * 100) / 100;
        }

        function sortByOrderIndex(items) {
            return items.slice().sort((a, b) => {
                const aOrder = a.order_index != null && Number.isFinite(Number(a.order_index)) ? Number(a.order_index) : Number.MAX_SAFE_INTEGER;
                const bOrder = b.order_index != null && Number.isFinite(Number(b.order_index)) ? Number(b.order_index) : Number.MAX_SAFE_INTEGER;
                return aOrder - bOrder || new Date(a.created_at || 0) - new Date(b.created_at || 0);
            });
        }

        async function fetchAllUserRows(tableName, userId, orderColumn) {
            const pageSize = 500;
            const { count, error: countError } = await supabaseClient.from(tableName)
                .select('*', { count: 'exact', head: true }).eq('user_id', userId);
            if (countError) throw countError;
            if (count === null) throw new Error(`อ่านจำนวนข้อมูลในตาราง ${tableName} ไม่สำเร็จ`);

            const pageCount = Math.ceil(count / pageSize);
            const pages = await Promise.all(Array.from({ length: pageCount }, (_, pageIndex) => {
                const query = supabaseClient.from(tableName).select('*')
                    .eq('user_id', userId)
                    .order(orderColumn, { ascending: tableName !== 'transactions' })
                    .order('id', { ascending: true });
                return query.range(pageIndex * pageSize, (pageIndex + 1) * pageSize - 1);
            }));
            const failedPage = pages.find(page => page.error);
            if (failedPage) throw failedPage.error;
            return pages.flatMap(page => page.data || []);
        }

        async function loadAllData() {
            if (!currentUser) return;
            setSyncStatus(navigator.onLine ? 'syncing' : 'offline');
            try {
                const userId = currentUser.id;
                const [accountRows, categoryRows, budgetRows, transactionRows, savingsGoalRows] = await Promise.all([
                    fetchAllUserRows('accounts', userId, 'created_at'),
                    fetchAllUserRows('categories', userId, 'created_at'),
                    fetchAllUserRows('budgets', userId, 'created_at'),
                    fetchAllUserRows('transactions', userId, 'transaction_date'),
                    fetchAllUserRows('savings_goals', userId, 'created_at')
                ]);

                setSyncStatus('online');

                const storedAccountRows = accountRows;
                const storedTransactionRows = transactionRows;
                const moneyRepairs = [
                    ...storedAccountRows
                        .filter(account => Number.isFinite(Number(account.balance)) && Number(account.balance) !== roundMoney(account.balance))
                        .map(account => supabaseClient.from('accounts').update({ balance: roundMoney(account.balance) })
                            .eq('id', account.id).eq('user_id', userId)),
                    ...storedTransactionRows
                        .filter(transaction => Number.isFinite(Number(transaction.amount)) && Number(transaction.amount) !== roundMoney(transaction.amount))
                        .map(transaction => supabaseClient.from('transactions').update({ amount: roundMoney(transaction.amount) })
                            .eq('id', transaction.id).eq('user_id', userId))
                ];
                const repairResults = await Promise.all(moneyRepairs);
                repairResults.filter(result => result.error).forEach(result => console.error('Money precision cleanup error:', result.error));

                db.accounts = storedAccountRows.map(account => ({
                    ...account,
                    balance: ['credit', 'loan'].includes(account.account_type)
                        ? -Math.abs(roundMoney(account.balance))
                        : roundMoney(account.balance)
                })).sort((a, b) => {
                    const aOrder = a.order_index != null && Number.isFinite(Number(a.order_index)) ? Number(a.order_index) : Number.MAX_SAFE_INTEGER;
                    const bOrder = b.order_index != null && Number.isFinite(Number(b.order_index)) ? Number(b.order_index) : Number.MAX_SAFE_INTEGER;
                    return aOrder - bOrder || new Date(a.created_at || 0) - new Date(b.created_at || 0);
                });
                db.categories = sortByOrderIndex(categoryRows);
                db.budgets = sortByOrderIndex(budgetRows);
                db.transactions = storedTransactionRows.map(transaction => ({
                    ...transaction,
                    amount: roundMoney(transaction.amount)
                }));
                db.savings_goals = sortByOrderIndex(savingsGoalRows);
                db.summary_notes = Object.fromEntries(db.accounts.map(account => [String(account.id), account.note || '']));

                // Migrate notes previously stored only in this browser into the accounts table.
                for (const account of db.accounts) {
                    const accountId = String(account.id);
                    if (account.note) continue;
                    const legacyKey = `savetung-summary-note-${userId}-${accountId}`;
                    let legacyNote;
                    try {
                        legacyNote = localStorage.getItem(legacyKey);
                    } catch (error) {
                        console.warn('Unable to read legacy summary note:', error);
                        continue;
                    }
                    if (legacyNote === null) continue;
                    const { error } = await supabaseClient.from('accounts').update({ note: legacyNote })
                        .eq('id', account.id).eq('user_id', userId);
                    if (error) {
                        console.error('Summary note migration error:', error);
                    } else {
                        account.note = legacyNote;
                        db.summary_notes[accountId] = legacyNote;
                        try { localStorage.removeItem(legacyKey); } catch (error) { console.warn('Unable to remove migrated note:', error); }
                    }
                }
            } catch (e) {
                setSyncStatus('error');
                console.error("Supabase load exception:", e);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ Supabase: " + e.message, 'error');
            }
        }

        async function saveToDB(tableName, record) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล', 'error');
                return null;
            }
            delete record.id;
            if (tableName === 'accounts' && record.balance !== undefined) record.balance = roundMoney(record.balance);
            if (tableName === 'transactions' && record.amount !== undefined) record.amount = roundMoney(record.amount);
            record.user_id = currentUser.id;

            const { data, error } = await supabaseClient.from(tableName).insert([record]).select();
            if (error) {
                setSyncStatus('error');
                showAlert('บันทึกเข้า Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Insert Error:", error);
                return null; 
            }
            if (data && data[0]) {
                db[tableName].push(data[0]);
            }
            setSyncStatus('online');
            return data ? data[0] : record;
        }

        async function updateInDB(tableName, id, updatedFields) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนแก้ไขข้อมูล', 'error');
                return false;
            }
            delete updatedFields.id;
            delete updatedFields.user_id;
            if (tableName === 'accounts' && updatedFields.balance !== undefined) updatedFields.balance = roundMoney(updatedFields.balance);
            if (tableName === 'transactions' && updatedFields.amount !== undefined) updatedFields.amount = roundMoney(updatedFields.amount);

            const { data, error } = await supabaseClient.from(tableName).update(updatedFields)
                .eq('id', id).eq('user_id', currentUser.id).select('id');
            if (error || !data?.length) {
                setSyncStatus('error');
                showAlert('อัปเดต Supabase ไม่สำเร็จ: ' + (error?.message || 'ไม่พบข้อมูลหรือไม่มีสิทธิ์แก้ไข'), 'error'); 
                console.error("Supabase Update Error:", error);
                return false; 
            }
            const idx = db[tableName].findIndex(item => item.id === id);
            if (idx !== -1) {
                db[tableName][idx] = { ...db[tableName][idx], ...updatedFields };
            }
            setSyncStatus('online');
            return true;
        }

        async function deleteFromDB(tableName, id) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนลบข้อมูล', 'error');
                return false;
            }
            const { data, error } = await supabaseClient.from(tableName).delete()
                .eq('id', id).eq('user_id', currentUser.id).select('id');
            if (error || !data?.length) {
                setSyncStatus('error');
                showAlert('ลบจาก Supabase ไม่สำเร็จ: ' + (error?.message || 'ไม่พบข้อมูลหรือไม่มีสิทธิ์ลบ'), 'error'); 
                console.error("Supabase Delete Error:", error);
                return false; 
            }
            db[tableName] = db[tableName].filter(item => item.id !== id);
            setSyncStatus('online');
            return true;
        }

        async function reorderItemToPosition(tableName, id, targetIdx) {
            if (!currentUser || !Array.isArray(db[tableName])) return;
            const allItems = db[tableName];
            const item = allItems.find(entry => String(entry.id) === String(id));
            if (!item) return;

            const list = tableName === 'accounts'
                ? allItems.filter(entry => entry.account_type === item.account_type)
                : allItems.slice();
            const currentIdx = list.findIndex(entry => String(entry.id) === String(id));
            if (targetIdx < 0 || targetIdx >= list.length || currentIdx === targetIdx) return;

            const [movedItem] = list.splice(currentIdx, 1);
            list.splice(targetIdx, 0, movedItem);
            list.forEach((entry, index) => { entry.order_index = index; });

            if (tableName === 'accounts') {
                const groupIds = new Set(list.map(entry => String(entry.id)));
                let nextIndex = 0;
                for (let index = 0; index < allItems.length; index++) {
                    if (groupIds.has(String(allItems[index].id))) allItems[index] = list[nextIndex++];
                }
            } else {
                allItems.splice(0, allItems.length, ...list);
            }

            const results = await Promise.all(list.map(entry =>
                supabaseClient.from(tableName).update({ order_index: entry.order_index })
                    .eq('id', entry.id).eq('user_id', currentUser.id)
            ));
            const failed = results.find(result => result.error);
            if (failed) {
                showAlert('บันทึกลำดับไม่สำเร็จ: ' + failed.error.message, 'error');
                await loadAllData();
                renderCurrentTab();
                return;
            }
            renderCurrentTab();
            showAlert('จัดลำดับสำเร็จ');
        }

        async function moveItemOrder(tableName, id, direction) {
            const allItems = db[tableName];
            const item = allItems?.find(entry => String(entry.id) === String(id));
            if (!item) return;
            const list = tableName === 'accounts'
                ? allItems.filter(entry => entry.account_type === item.account_type)
                : allItems;
            const currentIdx = list.findIndex(entry => String(entry.id) === String(id));
            await reorderItemToPosition(tableName, id, currentIdx + direction);
        }

        function moveAccountInMemory(sourceId, targetId, insertAfter) {
            const allItems = db.accounts;
            const source = allItems.find(item => String(item.id) === String(sourceId));
            const target = allItems.find(item => String(item.id) === String(targetId));
            if (!source || !target || source.account_type !== target.account_type || sourceId === targetId) return;

            const group = allItems.filter(item => item.account_type === source.account_type);
            const [moved] = group.splice(group.findIndex(item => String(item.id) === String(sourceId)), 1);
            const targetIndex = group.findIndex(item => String(item.id) === String(targetId));
            group.splice(targetIndex + (insertAfter ? 1 : 0), 0, moved);

            const groupIds = new Set(group.map(item => String(item.id)));
            let nextIndex = 0;
            for (let index = 0; index < allItems.length; index++) {
                if (groupIds.has(String(allItems[index].id))) allItems[index] = group[nextIndex++];
            }
        }

        function startAccountDrag(event, accountId) {
            if (!accountReorderMode) {
                event.preventDefault();
                return;
            }
            draggedAccountId = String(accountId);
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', draggedAccountId);
        }

        function dropAccountBefore(event, targetId) {
            event.preventDefault();
            if (!accountReorderMode) return;
            const sourceId = draggedAccountId || event.dataTransfer.getData('text/plain');
            const target = event.currentTarget;
            const insertAfter = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            moveAccountInMemory(String(sourceId), String(targetId), insertAfter);
            renderCurrentTab();
        }

        function startAccountTouch(event, accountId) {
            if (!accountReorderMode || event.touches.length !== 1) return;
            touchDraggedAccountId = String(accountId);
            event.preventDefault();
            event.currentTarget.classList.add('opacity-60', 'ring-2', 'ring-blue-400');
        }

        function moveAccountTouch(event) {
            if (!accountReorderMode || !touchDraggedAccountId || !event.touches.length) return;
            event.preventDefault();
            const touch = event.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('[data-account-id]');
            if (!target || target.dataset.accountId === touchDraggedAccountId) return;
            const source = db.accounts.find(item => String(item.id) === touchDraggedAccountId);
            const targetAccount = db.accounts.find(item => String(item.id) === target.dataset.accountId);
            if (!source || !targetAccount || source.account_type !== targetAccount.account_type) return;

            const insertAfter = touch.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            moveAccountInMemory(touchDraggedAccountId, target.dataset.accountId, insertAfter);
            const list = document.getElementById(`accountList-${source.account_type}`);
            if (!list) return;
            db.accounts.filter(item => item.account_type === source.account_type).forEach((item, index) => {
                const card = list.querySelector(`[data-account-id="${item.id}"]`);
                if (!card) return;
                list.appendChild(card);
                const number = card.querySelector('.account-order-number');
                if (number) number.textContent = index + 1;
            });
        }

        function endAccountTouch(event) {
            if (!touchDraggedAccountId) return;
            document.querySelectorAll('[data-account-id]').forEach(card => card.classList.remove('opacity-60', 'ring-2', 'ring-blue-400'));
            touchDraggedAccountId = null;
            if (event) event.preventDefault();
        }

        async function saveAccountOrder() {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนบันทึกลำดับ', 'error');
                return;
            }
            const results = await Promise.all(db.accounts.map((account, index, accounts) => {
                const groupIndex = accounts.filter(item => item.account_type === account.account_type)
                    .findIndex(item => String(item.id) === String(account.id));
                return supabaseClient.from('accounts').update({ order_index: groupIndex })
                    .eq('id', account.id).eq('user_id', currentUser.id);
            }));
            const failed = results.find(result => result.error);
            if (failed) {
                showAlert('บันทึกลำดับไม่สำเร็จ: ' + failed.error.message, 'error');
                await loadAllData();
                renderCurrentTab();
                return;
            }
            db.accounts.forEach(account => {
                account.order_index = db.accounts.filter(item => item.account_type === account.account_type)
                    .findIndex(item => String(item.id) === String(account.id));
            });
            accountReorderMode = false;
            draggedAccountId = null;

                    .eq('id', accountId).eq('user_id', currentUser.id);
                if (error) {
                    console.error('Summary note save error:', error);

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({

            })[character]);

            return String(tx?.transaction_note || '').replace(/\u2063savetung_goal=[^\u2063]*\u2063/g, '').trim();

            const match = String(tx?.transaction_note || '').match(/\u2063savetung_goal=([^\u2063]*)\u2063/);

        }

            const visibleNote = String(note || '').trim();
            return savingsGoalId

                : visibleNote;

        function shiftDateRange(direction) {
            const d = new Date(globalFilter.currentDate);
            if (globalFilter.mode === 'today') {
                d.setDate(d.getDate() + direction);
            } else if (globalFilter.mode === 'month') {
                d.setDate(1);
                d.setMonth(d.getMonth() + direction);
            } else if (globalFilter.mode === 'year') {
                d.setDate(1);
                d.setMonth(0);
                d.setFullYear(d.getFullYear() + direction);

            globalFilter.currentDate = d;

        function applyCustomDateFilter() {
            const start = document.getElementById('customStartDate').value;
            const end = document.getElementById('customEndDate').value;
            if (!start || !end) { showAlert('กรุณาเลือกช่วงวันที่ให้ครบถ้วน', 'error'); return; }
            globalFilter.mode = 'custom';
            globalFilter.startDate = start;
            globalFilter.endDate = end;
            renderCurrentTab();
        }

        function filterTransactionsByDate(txs) {
            const d = new Date(globalFilter.currentDate);
            return txs.filter(tx => {
                if (!tx.transaction_date) return false;
                const txDate = new Date(tx.transaction_date);
                if (globalFilter.mode === 'today') {
                    return txDate.toDateString() === d.toDateString();
                } else if (globalFilter.mode === 'month') {
                    return txDate.getFullYear() === d.getFullYear() && txDate.getMonth() === d.getMonth();
                } else if (globalFilter.mode === 'year') {
                    return txDate.getFullYear() === d.getFullYear();
                } else if (globalFilter.mode === 'custom' && globalFilter.startDate && globalFilter.endDate) {
                    const [startYear, startMonth, startDay] = globalFilter.startDate.split('-').map(Number);
                    const [endYear, endMonth, endDay] = globalFilter.endDate.split('-').map(Number);
                    const start = new Date(startYear, startMonth - 1, startDay);
                    const end = new Date(endYear, endMonth - 1, endDay, 23, 59, 59, 999);
                    return txDate >= start && txDate <= end;
                }
                return true;
            });
        }

        function getCardPaymentSummary(card, today, asOfDate = today) {
            const dueDay = Number(card.due_date);
            if (!Number.isInteger(dueDay) || dueDay < 1 || dueDay > 31) return null;

            const statementDay = Math.min(Math.max(Number(card.statement_date) || 25, 1), 31);
            const dueDateForMonth = (year, month) => new Date(year, month, Math.min(dueDay, new Date(year, month + 1, 0).getDate()));
            let dueDate = dueDateForMonth(today.getFullYear(), today.getMonth());
            if (dueDate < today) dueDate = dueDateForMonth(today.getFullYear(), today.getMonth() + 1);
            const previousDueDate = dueDateForMonth(dueDate.getFullYear(), dueDate.getMonth() - 1);
            const todayEnd = new Date(asOfDate);
            todayEnd.setHours(23, 59, 59, 999);
            const dueDateEnd = new Date(dueDate);
            dueDateEnd.setHours(23, 59, 59, 999);
            if (todayEnd > dueDateEnd) todayEnd.setTime(dueDateEnd.getTime());
            const monthIndex = date => date.getFullYear() * 12 + date.getMonth();
            const items = [];

            db.transactions.forEach(tx => {
                if (tx.transaction_type !== 'credit_spend' || String(tx.wallet_id) !== String(card.id) || !tx.transaction_date) return;
                const purchaseDate = new Date(tx.transaction_date);
                if (Number.isNaN(purchaseDate.getTime())) return;

                // รายการหลังวันสรุปยอดจะไปอยู่ในรอบถัดไป ส่วนวันครบกำหนด
                // จะอยู่เดือนเดียวกับวันสรุปยอดหรือเดือนถัดไปตามลำดับวันที่
                let statementMonth = new Date(purchaseDate.getFullYear(), purchaseDate.getMonth(), 1);
                if (purchaseDate.getDate() > statementDay) statementMonth.setMonth(statementMonth.getMonth() + 1);
                const dueMonthOffset = dueDay <= statementDay ? 1 : 0;
                const firstDueDate = dueDateForMonth(statementMonth.getFullYear(), statementMonth.getMonth() + dueMonthOffset);
                const cyclesElapsed = monthIndex(dueDate) - monthIndex(firstDueDate);
                if (cyclesElapsed < 0) return;

                const amount = Number(tx.amount) || 0;
                if (tx.is_installment) {
                    const totalMonths = Number(tx.installment_total_months);
                    const currentMonth = Number(tx.installment_current_month) || 1;
                    const installmentNumber = currentMonth + cyclesElapsed;
                    if (!Number.isInteger(totalMonths) || totalMonths < 1 || installmentNumber > totalMonths) return;
                    items.push({
                        note: tx.transaction_note || 'รายการผ่อนชำระ',
                        amount: amount / totalMonths,
                        installment: `${installmentNumber}/${totalMonths}`
                    });
                } else if (cyclesElapsed === 0) {
                    items.push({ note: tx.transaction_note || 'รายการบัตรเครดิต', amount, installment: '' });
                }
            });

            const scheduledAmount = items.reduce((sum, item) => sum + item.amount, 0);
            const paymentsMade = db.transactions
                .filter(tx => tx.transaction_type === 'credit_payment' && String(tx.to_wallet_id) === String(card.id) && tx.transaction_date)
                .filter(tx => {
                    const paymentDate = new Date(tx.transaction_date);
                    return paymentDate > previousDueDate && paymentDate <= todayEnd;
                })
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            return {
                dueDate,
                items,
                scheduledAmount,
                paymentsMade,
                amountToPrepare: Math.max(0, scheduledAmount - paymentsMade)
            };
        }

        async function exportTransactionsCsvLegacy() {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนส่งออกข้อมูล', 'error');
                return;
            }

            const userId = currentUser.id;
            const tableNames = ['accounts', 'categories', 'budgets', 'transactions', 'savings_goals'];
            const pageSize = 1000;
            try {
                const tableEntries = await Promise.all(tableNames.map(async tableName => {
                    const { count, error: countError } = await supabaseClient.from(tableName)
                        .select('*', { count: 'exact', head: true }).eq('user_id', userId);
                    if (countError) throw countError;
                    if (count === null) throw new Error(`อ่านจำนวนข้อมูลในตาราง ${tableName} ไม่สำเร็จ`);

                    const pageCount = Math.ceil(count / pageSize);
                    const pages = await Promise.all(Array.from({ length: pageCount }, (_, pageIndex) => {
                        const from = pageIndex * pageSize;
                        return supabaseClient.from(tableName).select('*')
                            .eq('user_id', userId).order('id', { ascending: true })
                            .range(from, from + pageSize - 1);
                    }));
                    const failedPage = pages.find(page => page.error);
                    if (failedPage) throw failedPage.error;
                    return [tableName, pages.flatMap(page => page.data || [])];
                }));
                const tables = Object.fromEntries(tableEntries);

                const records = Object.entries(tables).flatMap(([tableName, items]) =>
                    items.map(item => ({ table: tableName, ...item }))
                );
                const headers = ['table', ...new Set(records.flatMap(record => Object.keys(record).filter(key => key !== 'table')))];
                const rows = records.map(record => headers.map(header => record[header] ?? ''));
                const csvCell = value => {
                    let text = typeof value === 'object' && value !== null ? JSON.stringify(value) : String(value ?? '');
                    if (/^[\t\r ]*[=+\-@]/.test(text)) text = `'${text}`;
                    return `"${text.replace(/"/g, '""')}"`;
                };
                const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\\r\\n');
                const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = `savetung-all-data-${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                showAlert('ส่งออกข้อมูลทุกตารางเป็น CSV แล้ว');
            } catch (error) {
                console.error('CSV export error:', error);
                showAlert('ส่งออกข้อมูลไม่สำเร็จ: ' + error.message, 'error');
            }
        }

        async function exportTransactionsCsv() {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนส่งออกข้อมูล', 'error');
                return;
            }
            if (!window.XLSX) {
                showAlert('ไม่สามารถโหลดเครื่องมือสร้างไฟล์ Excel ได้', 'error');
                return;
            }

            const userId = currentUser.id;
            const tableNames = ['accounts', 'categories', 'budgets', 'transactions', 'savings_goals'];
            const pageSize = 500;

            try {
                const tableEntries = await Promise.all(tableNames.map(async tableName => {
                    const { count, error: countError } = await supabaseClient.from(tableName)
                        .select('*', { count: 'exact', head: true }).eq('user_id', userId);
                    if (countError) throw countError;
                    if (count === null) throw new Error(`อ่านจำนวนข้อมูลในตาราง ${tableName} ไม่สำเร็จ`);

                    const pageCount = Math.ceil(count / pageSize);
                    const pages = await Promise.all(Array.from({ length: pageCount }, (_, pageIndex) => {
                        const from = pageIndex * pageSize;
                        return supabaseClient.from(tableName).select('*')
                            .eq('user_id', userId).order('id', { ascending: true })
                            .range(from, from + pageSize - 1);
                    }));
                    const failedPage = pages.find(page => page.error);
                    if (failedPage) throw failedPage.error;
                    return [tableName, pages.flatMap(page => page.data || [])];
                }));

                const workbook = XLSX.utils.book_new();
                tableEntries.forEach(([tableName, rows]) => {
                    const worksheet = XLSX.utils.json_to_sheet(rows);
                    XLSX.utils.book_append_sheet(workbook, worksheet, tableName);
                });
                XLSX.writeFile(workbook, `savetung-all-data-${new Date().toISOString().slice(0, 10)}.xlsx`);
                showAlert('ส่งออกข้อมูลครบ 5 ตารางเป็นไฟล์ Excel แล้ว');

                console.error('Excel export error:', error);
                showAlert('ส่งออกข้อมูลไม่สำเร็จ: ' + error.message, 'error');
            }
        }

        function toggleAccountPicker(selectId) {
            const menu = document.getElementById(`${selectId}PickerMenu`);
            const picker = document.getElementById(`${selectId}Picker`);
            if (!menu || !picker) return;
            document.querySelectorAll('.account-picker-menu').forEach(otherMenu => {
                if (otherMenu !== menu) closeAccountPicker(otherMenu.id.replace('PickerMenu', ''));
            });
            const isOpening = menu.classList.contains('hidden');
            const viewportWidth = Math.min(window.innerWidth, window.screen?.width || window.innerWidth);
            if (isOpening && viewportWidth <= 639) {
                menu._pickerParent = picker;
                const backdrop = document.createElement('div');
                backdrop.className = 'account-picker-backdrop';
                backdrop.addEventListener('click', () => closeAccountPicker(selectId));
                document.body.appendChild(backdrop);
                document.body.appendChild(menu);
                Object.assign(menu.style, {
                    position: 'fixed',
                    left: '50%',
                    top: '50%',
                    right: 'auto',
                    bottom: 'auto',
                    width: 'min(92vw, 480px)',
                    maxHeight: '84dvh',
                    margin: '0',
                    overflowY: 'auto',
                    borderRadius: '24px',
                    padding: '16px',
                    transform: 'translate(-50%, -50%)',
                    zIndex: '100',
                    boxShadow: '0 24px 70px rgba(15, 23, 42, 0.28)'
                });
            }
            menu.classList.toggle('hidden', !isOpening);
            picker.querySelector('button')?.setAttribute('aria-expanded', String(isOpening));
        }

        function closeAccountPicker(selectId) {
            const menu = document.getElementById(`${selectId}PickerMenu`);
            menu?.classList.add('hidden');
            document.querySelector('.account-picker-backdrop')?.remove();
            if (menu?._pickerParent?.isConnected) {
                menu._pickerParent.appendChild(menu);
                menu.style.cssText = '';
                delete menu._pickerParent;
            }
            document.getElementById(`${selectId}Picker`)?.querySelector('button')?.setAttribute('aria-expanded', 'false');
        }

                cash: '#dcfce7',
                bank: '#dbeafe',
                credit: '#ede9fe',
                investment: '#fef3c7',
                loan: '#ffe4e6'
            };
            const renderAccountOptions = accounts => ['cash', 'bank', 'credit', 'investment', 'loan']

        function getTransactionBalanceDeltas(tx) {
            const deltas = new Map();
            const addDelta = (accountId, delta) => {
                if (accountId) deltas.set(accountId, roundMoney((deltas.get(accountId) || 0) + delta));
            };
            const amount = roundMoney(tx.amount);

            switch (tx.transaction_type) {
                case 'income':
                    addDelta(tx.wallet_id, amount);
                    break;
                case 'transfer':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'credit_payment':
                    addDelta(tx.wallet_id, -amount);
                    addDelta(tx.to_wallet_id, amount);
                    break;
                case 'expense':
                case 'credit_spend':
                case 'saving':
                    addDelta(tx.wallet_id, -amount);
                    break;
            }
            return deltas;
        }

        async function applySavingsGoalDeltas(deltas) {
            const applied = [];
            const entries = [...deltas].filter(([, delta]) => delta);
            for (const [goalId, delta] of entries) {
                const goal = db.savings_goals.find(item => String(item.id) === String(goalId));
                if (!goal) {
                    showAlert('ไม่พบเป้าหมายเงินออมที่ผูกกับรายการนี้', 'error');
                    break;
                }
                const previousAmount = Number(goal.current_amount) || 0;
                if (!await updateInDB('savings_goals', goal.id, { current_amount: roundMoney(previousAmount + delta) })) break;
                applied.push([goal.id, previousAmount]);
            }

            if (applied.length === entries.length) return true;
            let rollbackFailed = false;
            for (const [goalId, previousAmount] of applied.reverse()) {
                if (!await updateInDB('savings_goals', goalId, { current_amount: previousAmount })) rollbackFailed = true;
            }
            if (rollbackFailed) {
                await loadAllData();
                showAlert('คืนยอดเป้าหมายเงินออมไม่สำเร็จ กรุณาตรวจสอบเป้าหมาย', 'error');
            }
            return false;
        }

        async function applyTransactionBalanceDeltas(deltas) {
            const applied = [];
            const rollbackApplied = async () => {
                let rollbackFailed = false;
                for (const [appliedAccountId, originalBalance] of applied.reverse()) {
                    if (!await updateInDB('accounts', appliedAccountId, { balance: originalBalance })) rollbackFailed = true;
                }
                if (rollbackFailed) {
                    await loadAllData();
                    showAlert('ปรับยอดบางบัญชีไม่สำเร็จ และคืนค่ายอดเดิมไม่ครบ กรุณาตรวจสอบบัญชี', 'error');
                }
                return !rollbackFailed;
            };

            for (const [accountId, delta] of deltas) {
                if (!delta) continue;
                const account = db.accounts.find(a => String(a.id) === String(accountId));
                if (!account) {
                    showAlert('ไม่พบบัญชีที่ผูกกับรายการนี้', 'error');
                    await rollbackApplied();
                    return false;
                }
                const previousBalance = Number(account.balance);
                const balance = roundMoney(previousBalance + delta);
                if (!await updateInDB('accounts', accountId, { balance })) {
                    await rollbackApplied();
                    return false;
                }
                applied.push([accountId, previousBalance]);
            }
            return true;
        }

        async function handleSaveTransaction(e) {
            e.preventDefault();
            if (isSavingTransaction) return;
            isSavingTransaction = true;
            const submitButton = e.currentTarget.querySelector('button[type="submit"]');
            const originalButtonText = submitButton?.textContent;
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'กำลังบันทึก…';
            }
            try {
            const editId = document.getElementById('editTxId').value;
            const type = document.getElementById('txType').value;
            const amount = Number(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;
            const wallet_id = document.getElementById('txWalletId').value;
            const to_wallet_id = document.getElementById('txToWalletId').value || null;
            const category_id = document.getElementById('txCategoryId').value;
            const note = document.getElementById('txNote').value;
            const savingsGoalId = document.getElementById('txSavingsGoalId').value;

            if (!Number.isFinite(amount) || amount <= 0 || !wallet_id || !category_id) {
                showAlert('กรุณาระบุจำนวนเงิน บัญชี และหมวดหมู่ให้ถูกต้อง', 'error');
                return;
            }
            if (['transfer', 'credit_payment'].includes(type) && (!to_wallet_id || wallet_id === to_wallet_id)) {
                showAlert('กรุณาเลือกบัญชีปลายทางที่แตกต่างจากบัญชีต้นทาง', 'error');
                return;
            }
            if (type === 'saving' && !db.savings_goals.some(goal => String(goal.id) === String(savingsGoalId))) {
                showAlert('กรุณาเลือกเป้าหมายเงินออมที่มีอยู่', 'error');
                return;
            }

            const is_installment = type === 'credit_spend' && (document.getElementById('txIsInstallment')?.checked || false);
            const installment_current_month = is_installment ? Number(document.getElementById('txCurrentMonth').value) : null;
            const installment_total_months = is_installment ? Number(document.getElementById('txTotalMonths').value) : null;
            const txData = {
                transaction_date: new Date(date).toISOString(),
                transaction_type: type,
                amount: roundMoney(amount),
                wallet_id,
                to_wallet_id,
                category_id,
                transaction_note: encodeTransactionNote(note, type === 'saving' ? savingsGoalId : ''),
                is_installment,
                installment_total_months,
                installment_current_month
            };

            const oldTx = editId ? db.transactions.find(tx => String(tx.id) === String(editId)) : null;
            if (editId && !oldTx) {
                showAlert('ไม่พบรายการที่ต้องการแก้ไข กรุณาโหลดข้อมูลใหม่', 'error');
                return;
            }

            const balanceDeltas = new Map();
            const mergeDeltas = (source, multiplier) => {
                for (const [accountId, delta] of getTransactionBalanceDeltas(source)) {
                    balanceDeltas.set(accountId, roundMoney((balanceDeltas.get(accountId) || 0) + delta * multiplier));
                }
            };
            if (oldTx) mergeDeltas(oldTx, -1);
            mergeDeltas(txData, 1);

            const savingsGoalDeltas = new Map();
            const mergeSavingsGoalDelta = (tx, multiplier) => {
                const contribution = getSavingsGoalContribution(tx);
                if (!contribution?.goalId) return;
                savingsGoalDeltas.set(contribution.goalId, roundMoney(
                    (savingsGoalDeltas.get(contribution.goalId) || 0) + contribution.amount * multiplier
                ));
            };
            if (oldTx) mergeSavingsGoalDelta(oldTx, -1);
            mergeSavingsGoalDelta(txData, 1);
            if (!await applySavingsGoalDeltas(savingsGoalDeltas)) return;
            if (!await applyTransactionBalanceDeltas(balanceDeltas)) {
                await applySavingsGoalDeltas(new Map([...savingsGoalDeltas].map(([goalId, delta]) => [goalId, -delta])));
                return;
            }

            const saved = editId
                ? await updateInDB('transactions', editId, txData)
                : await saveToDB('transactions', txData);
            if (!saved) {
                const rollbackDeltas = new Map([...balanceDeltas].map(([accountId, delta]) => [accountId, -delta]));
                const rollbackGoalDeltas = new Map([...savingsGoalDeltas].map(([goalId, delta]) => [goalId, -delta]));
                const [balancesRestored, goalsRestored] = await Promise.all([
                    applyTransactionBalanceDeltas(rollbackDeltas),
                    applySavingsGoalDeltas(rollbackGoalDeltas)
                ]);
                if (!balancesRestored || !goalsRestored) {
                    await loadAllData();
                    showAlert('บันทึกรายการไม่สำเร็จ และคืนยอดบัญชีหรือเป้าหมายไม่ครบ กรุณาตรวจสอบข้อมูล', 'error');
                }
                return;
            }

            closeTransactionModal();
            await loadAllData();
            renderCurrentTab();
            showAlert(editId ? 'แก้ไขรายการสำเร็จ' : 'บันทึกรายการสำเร็จ');
            } finally {
                isSavingTransaction = false;
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = originalButtonText;
                }
            }
        }

        async function deleteTransaction(id) {
            if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
                const tx = db.transactions.find(item => String(item.id) === String(id));
                if (!tx) return;
                const balanceDeltas = new Map(
                    [...getTransactionBalanceDeltas(tx)].map(([accountId, delta]) => [accountId, -delta])
                );
                const contribution = getSavingsGoalContribution(tx);
                const goalDeltas = contribution?.goalId
                    ? new Map([[contribution.goalId, -contribution.amount]])
                    : new Map();
                if (!await applySavingsGoalDeltas(goalDeltas)) return;
                if (!await applyTransactionBalanceDeltas(balanceDeltas)) {
                    await applySavingsGoalDeltas(new Map([...goalDeltas].map(([goalId, delta]) => [goalId, -delta])));
                    return;
                }

                if (!await deleteFromDB('transactions', id)) {
                    const rollbackDeltas = new Map([...balanceDeltas].map(([accountId, delta]) => [accountId, -delta]));
                    const rollbackGoalDeltas = new Map([...goalDeltas].map(([goalId, delta]) => [goalId, -delta]));
                    const [balancesRestored, goalsRestored] = await Promise.all([
                        applyTransactionBalanceDeltas(rollbackDeltas),
                        applySavingsGoalDeltas(rollbackGoalDeltas)
                    ]);
                    if (!balancesRestored || !goalsRestored) {
                        await loadAllData();
                        showAlert('ลบรายการไม่สำเร็จ และคืนยอดบัญชีหรือเป้าหมายไม่ครบ กรุณาตรวจสอบข้อมูล', 'error');
                    }
                    return;
                }

                await loadAllData();
                renderCurrentTab();
                showAlert('ลบรายการสำเร็จ', 'success');
            }
        }

        async function handleSaveAccount(e) {
            e.preventDefault();
            const editId = document.getElementById('editAccId').value;
            const type = document.getElementById('accType').value;
            const enteredBalance = Number(document.getElementById('accBalance').value);
            const accData = {
                account_name: document.getElementById('accName').value,
                account_type: type,
                balance: ['credit', 'loan'].includes(type) ? -Math.abs(enteredBalance) : enteredBalance,
                credit_limit: type === 'credit' ? Number(document.getElementById('accCreditLimit').value) : 0,
                statement_date: type === 'credit' ? Number(document.getElementById('accStatementDate').value) : null,
                due_date: type === 'credit' ? Number(document.getElementById('accDueDate').value) : null
            };

            const saved = editId
                ? await updateInDB('accounts', editId, accData)
                : await saveToDB('accounts', accData);

            showAlert(editId ? 'แก้ไขบัญชีสำเร็จ' : 'เพิ่มบัญชีสำเร็จ');

        // --- Corrected General Ledger Calculations & Display ---
        function openAccountLedger(accountId) {
            const acc = db.accounts.find(a => a.id === accountId);
            if (!acc) return;

            // 1. ดึงรายการธุรกรรมของบัญชีนี้ และเรียงจาก "เก่าไปใหม่" (Chronological Order)
            const accTxs = db.transactions.filter(t => t.wallet_id === accountId || t.to_wallet_id === accountId);
            accTxs.sort((a, b) => new Date(a.transaction_date) - new Date(b.transaction_date));

            // 2. รวมผลกระทบของรายการเพื่อคำนวณยอดตั้งต้น
            let totalNetChange = 0;
            accTxs.forEach(t => {
                totalNetChange += getTransactionBalanceDeltas(t).get(accountId) || 0;
            });

            // หนี้สินเก็บยอดติดลบในฐานข้อมูล แต่แสดงยอดหนี้เป็นจำนวนบวก
            const isLiability = ['credit', 'loan'].includes(acc.account_type);
            const initialStartBalance = Number(acc.balance) - totalNetChange;

            // 3. วนลูปคำนวณยอดคงเหลือ โดยกลับทิศทางผลกระทบสำหรับบัญชีหนี้สิน
            let runningBalance = isLiability ? -initialStartBalance : initialStartBalance;
            let rowsHtml = '';

            if (accTxs.length === 0) {

        function startCategoryDrag(event, categoryId) {
            if (!categoryReorderMode) {
                event.preventDefault();
                return;
            }
            draggedCategoryId = String(categoryId);
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', draggedCategoryId);
        }

        let touchDraggedCategoryId = null;

        function startCategoryTouch(event, categoryId) {
            if (!categoryReorderMode || event.touches.length !== 1) return;
            touchDraggedCategoryId = String(categoryId);
            event.preventDefault();
            event.currentTarget.classList.add('opacity-60', 'ring-2', 'ring-blue-400');
        }

        function moveCategoryTouch(event) {
            if (!categoryReorderMode || !touchDraggedCategoryId || !event.touches.length) return;
            event.preventDefault();
            const touch = event.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('[data-category-id]');
            if (!target || target.dataset.categoryId === touchDraggedCategoryId) return;

            const sourceIndex = db.categories.findIndex(category => String(category.id) === touchDraggedCategoryId);
            const targetIndex = db.categories.findIndex(category => String(category.id) === target.dataset.categoryId);
            if (sourceIndex < 0 || targetIndex < 0) return;

            const insertAfter = touch.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            const [category] = db.categories.splice(sourceIndex, 1);
            const updatedTargetIndex = db.categories.findIndex(item => String(item.id) === target.dataset.categoryId);
            db.categories.splice(updatedTargetIndex + (insertAfter ? 1 : 0), 0, category);

            const list = document.getElementById('categoryList');
            db.categories.forEach((item, index) => {
                const card = list.querySelector(`[data-category-id="${item.id}"]`);
                if (!card) return;
                list.appendChild(card);
                const number = card.querySelector('.category-order-number');
                if (number) number.textContent = index + 1;
            });
        }

        function endCategoryTouch(event) {
            if (!touchDraggedCategoryId) return;
            document.querySelectorAll('[data-category-id]').forEach(card => card.classList.remove('opacity-60', 'ring-2', 'ring-blue-400'));
            touchDraggedCategoryId = null;
            if (event) event.preventDefault();
        }

        function dropCategoryBefore(event, targetId) {
            event.preventDefault();
            if (!categoryReorderMode) return;
            const sourceId = draggedCategoryId || event.dataTransfer.getData('text/plain');
            const fromIndex = db.categories.findIndex(category => String(category.id) === String(sourceId));
            const toIndex = db.categories.findIndex(category => String(category.id) === String(targetId));
            if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return;
            const [category] = db.categories.splice(fromIndex, 1);
            const insertIndex = db.categories.findIndex(item => String(item.id) === String(targetId));
            db.categories.splice(insertIndex, 0, category);
            renderCurrentTab();
        }

        function moveOrderedListItem(tableName, sourceId, targetId, insertAfter) {
            const items = db[tableName];
            const sourceIndex = items.findIndex(item => String(item.id) === String(sourceId));
            const targetIndex = items.findIndex(item => String(item.id) === String(targetId));
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) return false;
            const [moved] = items.splice(sourceIndex, 1);
            const adjustedTargetIndex = items.findIndex(item => String(item.id) === String(targetId));
            items.splice(adjustedTargetIndex + (insertAfter ? 1 : 0), 0, moved);
            return true;
        }

        function parseBudgetPeriodDate(value, isEnd = false) {
            if (!value) return null;
            const match = String(value).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]) - 1;
            const day = match[3] ? Number(match[3]) : (isEnd ? new Date(year, month + 1, 0).getDate() : 1);
            const date = new Date(year, month, day);
            if (isEnd) date.setHours(23, 59, 59, 999);
            return date;
        }

        function formatBudgetPeriod(value, isEnd = false) {
            const date = parseBudgetPeriodDate(value, isEnd);
            return date ? date.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : value;
        }

        function budgetPeriodInputValue(value, isEnd = false) {
            const date = parseBudgetPeriodDate(value, isEnd);
            if (!date) return '';
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

                                    <label class="block text-[10px] font-medium mb-1">วันที่เริ่มต้น</label>
                                    <input type="date" id="budStart" required value="${new Date().getFullYear()}-01-01" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">

                                    <input type="date" id="budEnd" required value="${new Date().getFullYear()}-12-31" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">

                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md">บันทึกงบ</button>

                <div id="goalModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                        <div class="flex justify-between items-center mb-3">
                            <h3 id="goalModalTitle" class="text-sm font-bold flex items-center gap-2"><i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> เพิ่มเป้าหมายเงินออม</h3>
                            <button onclick="closeGoalModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveGoal(event)" class="space-y-3">

                                <label class="block text-[11px] font-medium mb-1">ชื่อเป้าหมาย</label>

                            </div>
                            <div>
                                <label class="block text-[11px] font-medium mb-1">ยอดเป้าหมายรวม (บาท)</label>
