<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SaveTung">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>SaveTung - บันทึกรายรับรายจ่าย</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"IBM Plex Sans Thai"', '"Noto Sans Thai"', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                            950: '#172554'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .card { @apply rounded-3xl border border-slate-200/70 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.04),0_10px_30px_-18px_rgba(15,23,42,0.18)] dark:border-white/[0.06] dark:bg-slate-900 dark:shadow-none; }
            .field { @apply w-full rounded-2xl border border-slate-200 bg-slate-50 px-3.5 py-3 text-[15px] text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-brand-400 focus:bg-white focus:ring-4 focus:ring-brand-100 dark:border-white/10 dark:bg-slate-800 dark:text-white dark:focus:ring-brand-500/20; }
            .label { @apply mb-1.5 block text-[13px] font-semibold text-slate-600 dark:text-slate-300; }
            .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-2xl bg-brand-600 px-4 py-3 text-[15px] font-semibold text-white shadow-lg shadow-brand-600/25 transition hover:bg-brand-700 active:scale-[0.98] disabled:opacity-60 dark:shadow-none; }
            .btn-soft { @apply inline-flex items-center justify-center gap-1.5 rounded-xl bg-slate-100 px-3 py-2 text-[13px] font-semibold text-slate-700 transition hover:bg-slate-200 active:scale-[0.98] dark:bg-white/10 dark:text-slate-200 dark:hover:bg-white/15; }
            .btn-icon { @apply inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-white; }
            .section-title { @apply text-[15px] font-bold text-slate-900 dark:text-white; }
            .muted { @apply text-slate-500 dark:text-slate-400; }
            .sheet-backdrop { @apply fixed inset-0 z-50 flex items-end justify-center bg-slate-950/50 backdrop-blur-sm sm:items-center sm:p-4; }
            .sheet { @apply relative max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-t-[28px] bg-white p-5 pb-8 shadow-2xl dark:bg-slate-900 sm:rounded-[28px] sm:pb-5; }
            .sheet-handle { @apply mx-auto -mt-1 mb-3 h-1.5 w-10 rounded-full bg-slate-200 dark:bg-white/15 sm:hidden; }
        }
    </style>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7"></script>
    <!-- SheetJS for Excel workbooks with multiple worksheets -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10"></script>
    <style>
        :root { --app-bg: #f1f4f8; color-scheme: light; }
        .dark { --app-bg: #111827; color-scheme: dark; }
        body {
            background: var(--app-bg);
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        .num { font-variant-numeric: tabular-nums; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sheet { scrollbar-width: none; }
        .sheet::-webkit-scrollbar { display: none; }
        .sheet { max-height: 92dvh; }
        .account-item:has(details[open]) { z-index: 40; }
        details > summary::-webkit-details-marker { display: none; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* Older templates (ledger, account picker) still use very small arbitrary sizes. */
        [class~="text-[9px]"] { font-size: 11px !important; }
        [class~="text-[10px]"] { font-size: 11.5px !important; }

        .fade-in { animation: fadeIn .22s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .sheet-backdrop:not(.hidden) .sheet { animation: sheetUp .26s cubic-bezier(.2,.8,.2,1); }
        @keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .fade-in, .sheet-backdrop:not(.hidden) .sheet { animation: none; }
        }

        /* Account picker (custom select used in the transaction sheet) */
        .account-picker-source { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .account-select-option { background-color: #ffffff; color: #334155; }
        .dark .account-select-option { background-color: #1e293b; color: #e2e8f0; }
        .account-picker-menu { scrollbar-width: thin; }
        .account-picker-menu .account-picker-heading { font-size: 0.85rem; line-height: 1.3rem; padding: 0.55rem 0.8rem; }
        .account-picker-menu .account-picker-topbar { display: none; }
        @media (max-width: 639px) {
            .account-picker-backdrop {
                position: fixed;
                inset: 0;
                z-index: 99;
                background: rgba(2, 6, 23, 0.55);
                backdrop-filter: blur(3px);
            }
            .account-picker-menu .account-picker-topbar {
                display: flex;
                position: sticky;
                top: -1rem;
                z-index: 2;
                align-items: center;
                justify-content: space-between;
                margin: -1rem -1rem 1rem;
                padding: 1rem;
                background: #ffffff;
                border-bottom: 1px solid #e2e8f0;
            }
            .dark .account-picker-menu .account-picker-topbar { background: #0f172a; border-color: rgba(255,255,255,.08); }
        }
    </style>
</head>
<body class="min-h-full text-slate-800 dark:text-slate-100">

    <!-- Auth Screen -->
    <div id="authScreen" class="fixed inset-0 z-[70] flex items-center justify-center overflow-y-auto bg-gradient-to-br from-[#17243a] to-[#1e3a68] p-5">
        <div class="relative w-full max-w-sm">
            <div class="mb-6 text-center text-white">
                <div class="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-3xl bg-brand-600 text-white">
                    <i data-lucide="wallet" class="h-8 w-8"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">SaveTung</h1>
                <p class="mt-1 text-sm text-white/75">บันทึกรายรับรายจ่าย ง่าย ครบ ในที่เดียว</p>
            </div>
            <div class="rounded-[28px] border border-slate-200/70 bg-white p-6 shadow-sm dark:border-white/[0.06] dark:bg-slate-900">
                <h2 id="authModalTitle" class="text-xl font-bold text-slate-900 dark:text-white">เข้าสู่ระบบ</h2>
                <p id="authSubtitle" class="mt-0.5 text-sm muted">ยินดีต้อนรับกลับมา</p>
                <form onsubmit="handleAuthSubmit(event)" class="mt-5 space-y-3.5">
                    <div>
                        <label for="authEmail" class="label">อีเมล</label>
                        <input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com" class="field">
                    </div>
                    <div>
                        <label for="authPassword" class="label">รหัสผ่าน</label>
                        <input type="password" id="authPassword" required autocomplete="current-password" placeholder="••••••••" class="field">
                    </div>
                    <button type="submit" id="authSubmitBtn" class="btn-primary w-full">เข้าสู่ระบบ</button>
                </form>
                <div class="mt-4 text-center">
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-sm font-semibold text-brand-600 hover:underline dark:text-brand-300">ยังไม่มีบัญชี? สมัครสมาชิก</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="relative mx-auto flex min-h-full max-w-xl flex-col sm:max-w-3xl">
        <header id="appHeader" class="sticky top-0 z-20 flex items-center justify-between gap-3 px-4 pb-3 backdrop-blur-xl" style="background: color-mix(in srgb, var(--app-bg) 85%, transparent); padding-top: max(1rem, env(safe-area-inset-top));">
            <div class="flex min-w-0 items-center gap-1">
                <button id="headerBack" type="button" onclick="switchTab('more')" class="btn-icon -ml-2 hidden" aria-label="ย้อนกลับ"><i data-lucide="chevron-left" class="h-6 w-6"></i></button>
                <div class="min-w-0">
                    <p id="userEmailDisplay" class="truncate text-[12px] font-medium muted">กรุณาเข้าสู่ระบบ</p>
                    <h1 id="headerTitle" class="truncate text-[22px] font-bold leading-tight tracking-tight text-slate-900 dark:text-white">ภาพรวม</h1>
                </div>
            </div>
            <div class="flex shrink-0 items-center gap-1">
                <span id="syncStatusBadge" role="status" aria-live="polite" class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-600 dark:bg-white/10 dark:text-slate-300">
                    <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span><span>กำลังเชื่อมต่อ</span>
                </span>
                <button type="button" onclick="toggleDarkMode()" class="btn-icon" aria-label="สลับโหมดมืด"><i id="darkModeIcon" data-lucide="moon" class="h-[18px] w-[18px]"></i></button>
                <button type="button" onclick="handleLogout()" id="logoutBtn" class="hidden" aria-hidden="true" tabindex="-1"></button>
            </div>
        </header>

        <main id="mainContent" class="flex-1 px-4 pb-36 pt-1"></main>
    </div>

    <!-- Bottom navigation -->
    <nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-30 mx-auto max-w-xl px-3 sm:max-w-3xl" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
        <div class="flex items-center justify-around rounded-[26px] border border-slate-200/70 bg-white/90 px-1.5 py-1.5 shadow-[0_12px_32px_-12px_rgba(15,23,42,0.28)] backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/90">
            <button type="button" onclick="switchTab('dashboard')" data-tab="dashboard" class="nav-btn flex w-16 flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[11px] font-semibold text-slate-400 transition">
                <i data-lucide="house" class="h-[22px] w-[22px]"></i><span>ภาพรวม</span>
            </button>
            <button type="button" onclick="switchTab('transactions')" data-tab="transactions" class="nav-btn flex w-16 flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[11px] font-semibold text-slate-400 transition">
                <i data-lucide="receipt-text" class="h-[22px] w-[22px]"></i><span>รายการ</span>
            </button>
            <button type="button" onclick="openTransactionModal()" aria-label="บันทึกรายการใหม่" class="-mt-8 flex h-14 w-14 items-center justify-center rounded-[20px] bg-brand-600 text-white shadow-xl shadow-brand-600/30 transition active:scale-95" style="box-shadow: 0 0 0 5px var(--app-bg), 0 14px 28px -8px rgba(37,99,235,.4);">
                <i data-lucide="plus" class="h-7 w-7"></i>
            </button>
            <button type="button" onclick="switchTab('accounts')" data-tab="accounts" class="nav-btn flex w-16 flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[11px] font-semibold text-slate-400 transition">
                <i data-lucide="wallet-cards" class="h-[22px] w-[22px]"></i><span>บัญชี</span>
            </button>
            <button type="button" onclick="switchTab('more')" data-tab="more" class="nav-btn flex w-16 flex-col items-center gap-0.5 rounded-2xl py-1.5 text-[11px] font-semibold text-slate-400 transition">
                <i data-lucide="layout-grid" class="h-[22px] w-[22px]"></i><span>เพิ่มเติม</span>
            </button>
        </div>
    </nav>

    <!-- Account General Ledger -->
    <div id="ledgerModal" class="sheet-backdrop hidden" onclick="if (event.target === this) closeAccountLedger()">
        <div class="sheet sm:max-w-xl" role="dialog" aria-modal="true" aria-labelledby="ledgerTitle">
            <div class="sheet-handle"></div>
            <div class="mb-3 flex items-center justify-between gap-2">
                <h3 id="ledgerTitle" class="flex min-w-0 items-center gap-2 text-lg font-bold text-slate-900 dark:text-white">สมุดบัญชี</h3>
                <button type="button" onclick="closeAccountLedger()" class="btn-icon -mr-2" aria-label="ปิด"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div id="ledgerContent" class="space-y-3"></div>
        </div>
    </div>

    <!-- Account action sheet -->
    <div id="accountMenuModal" class="sheet-backdrop hidden" onclick="if (event.target === this) closeAccountMenu()">
        <div class="sheet sm:max-w-sm" role="dialog" aria-modal="true" aria-labelledby="accountMenuTitle">
            <div class="sheet-handle"></div>
            <div class="mb-3 flex items-center gap-3">
                <div class="min-w-0 flex-1">
                    <h3 id="accountMenuTitle" class="truncate text-lg font-bold text-slate-900 dark:text-white"></h3>
                    <p id="accountMenuSubtitle" class="text-[13px] muted"></p>
                </div>
                <button type="button" onclick="closeAccountMenu()" class="btn-icon -mr-2" aria-label="ปิด"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div id="accountMenuActions" class="space-y-1"></div>
        </div>
    </div>

    <!-- Transaction sheet -->
    <div id="txModal" class="sheet-backdrop hidden" onclick="if (event.target === this) closeTransactionModal()">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="txModalTitle">
            <div class="sheet-handle"></div>
            <div class="mb-4 flex items-center justify-between">
                <h3 id="txModalTitle" class="text-lg font-bold text-slate-900 dark:text-white">บันทึกรายการ</h3>
                <button type="button" onclick="closeTransactionModal()" class="btn-icon -mr-2" aria-label="ปิด"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <form onsubmit="handleSaveTransaction(event)" class="space-y-4">
                <input type="hidden" id="editTxId">
                <!-- Internal transaction type; derived from the kind tabs and the chosen accounts. -->
                <select id="txType" class="hidden" aria-hidden="true" tabindex="-1">
                    <option value="expense">รายจ่าย</option>
                    <option value="income">รายรับ</option>
                    <option value="transfer">โอนเงิน</option>
                    <option value="credit_spend">รูดบัตรเครดิต</option>
                    <option value="credit_payment">จ่ายบิลบัตรเครดิต</option>
                    <option value="saving">เงินออม</option>
                </select>

                <div id="txKindTabs" class="grid grid-cols-3 gap-1 rounded-2xl bg-slate-100 p-1 dark:bg-white/5" role="tablist" aria-label="ประเภทรายการ"></div>

                <div class="rounded-3xl bg-slate-50 px-4 py-4 text-center dark:bg-white/5">
                    <label for="txAmount" class="text-[12px] font-semibold muted">จำนวนเงิน (บาท)</label>
                    <div class="mt-1 flex items-center justify-center gap-1">
                        <span class="text-2xl font-bold text-slate-300 dark:text-slate-600">฿</span>
                        <input type="number" step="0.01" min="0.01" inputmode="decimal" id="txAmount" required placeholder="0.00" class="num w-full max-w-[240px] bg-transparent text-center text-[40px] font-bold leading-tight tracking-tight text-slate-900 outline-none placeholder:text-slate-300 dark:text-white dark:placeholder:text-slate-600">
                    </div>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="label" id="txWalletLabel">จ่ายจากบัญชี</label>
                        <select id="txWalletId" required class="account-picker-source" aria-hidden="true" tabindex="-1"></select>
                    </div>
                    <div id="toWalletContainer" class="hidden">
                        <label class="label" id="txToWalletLabel">ไปยังบัญชี</label>
                        <select id="txToWalletId" class="account-picker-source" aria-hidden="true" tabindex="-1"></select>
                    </div>
                    <div id="savingsGoalContainer" class="hidden">
                        <label class="label" for="txSavingsGoalId">นับเข้าเป้าหมายเงินออม</label>
                        <select id="txSavingsGoalId" onchange="syncTxType()" class="field"></select>
                    </div>
                    <p id="txTypeHint" class="hidden items-center gap-1.5 rounded-xl bg-brand-50 px-3 py-2 text-[12px] font-medium text-brand-700 dark:bg-brand-500/10 dark:text-brand-200"></p>
                </div>

                <!-- Credit card installment -->
                <div id="installmentBox" class="hidden space-y-2.5 rounded-2xl border border-violet-200 bg-violet-50/60 p-3 dark:border-violet-500/20 dark:bg-violet-500/10">
                    <label class="flex cursor-pointer items-center gap-2 text-[14px] font-semibold text-violet-800 dark:text-violet-200">
                        <input type="checkbox" id="txIsInstallment" onchange="toggleInstallmentFields()" class="h-4 w-4 rounded accent-violet-600">
                        ผ่อนชำระรายการนี้
                    </label>
                    <div id="installmentFields" class="hidden grid grid-cols-2 gap-2">
                        <div>
                            <label for="txCurrentMonth" class="label">งวดปัจจุบัน</label>
                            <input type="number" id="txCurrentMonth" value="1" min="1" class="field !py-2.5">
                        </div>
                        <div>
                            <label for="txTotalMonths" class="label">จำนวนงวดทั้งหมด</label>
                            <input type="number" id="txTotalMonths" value="10" min="2" class="field !py-2.5">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="label">หมวดหมู่</label>
                    <select id="txCategoryId" required class="account-picker-source" aria-hidden="true" tabindex="-1"></select>
                    <div id="txCategoryChips" class="grid grid-cols-4 gap-1.5"></div>
                </div>

                <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                    <div>
                        <label for="txDate" class="label">วันที่และเวลา</label>
                        <input type="datetime-local" id="txDate" required class="field min-w-0">
                    </div>
                    <div>
                        <label for="txNote" class="label">โน้ต (ไม่บังคับ)</label>
                        <input type="text" id="txNote" placeholder="เช่น ข้าวกลางวัน" class="field">
                    </div>
                </div>

                <div class="sticky bottom-0 z-10 -mx-5 flex gap-2 bg-white/95 px-5 pb-1 pt-3 backdrop-blur dark:bg-slate-900/95">
                    <button type="button" id="txDeleteBtn" onclick="deleteTransactionFromModal()" class="hidden h-[50px] w-[50px] shrink-0 items-center justify-center rounded-2xl bg-rose-50 text-rose-600 transition hover:bg-rose-100 dark:bg-rose-500/10 dark:text-rose-300" aria-label="ลบรายการ"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    <button type="submit" class="btn-primary h-[50px] flex-1">บันทึกรายการ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Period income/expense breakdown -->
    <div id="monthlyBreakdownModal" class="sheet-backdrop hidden z-[60]" onclick="if (event.target === this) closeMonthlyBreakdown()">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="monthlyBreakdownTitle">
            <div class="sheet-handle"></div>
            <div class="mb-3 flex items-center justify-between gap-3">
                <div>
                    <h3 id="monthlyBreakdownTitle" class="text-lg font-bold text-slate-900 dark:text-white">รายละเอียด</h3>
                    <p id="monthlyBreakdownMonth" class="text-[12px] muted"></p>
                </div>
                <button type="button" onclick="closeMonthlyBreakdown()" aria-label="ปิด" class="btn-icon -mr-2"><i data-lucide="x" class="h-5 w-5"></i></button>
            </div>
            <div id="monthlyBreakdownTotal" class="mb-4 flex items-baseline justify-between rounded-2xl bg-slate-50 px-4 py-3 dark:bg-white/5"></div>
            <div id="breakdownBars" class="mb-4 max-h-72 space-y-1 overflow-y-auto no-scrollbar"></div>
            <div id="monthlyBreakdownList"></div>
        </section>
    </div>

    <!-- Toast -->
    <div id="customAlert" class="pointer-events-none fixed left-1/2 top-4 z-[80] w-full max-w-sm -translate-x-1/2 -translate-y-24 px-4 opacity-0 transition-all duration-300">
        <div id="alertContent" class="flex items-center gap-2.5 rounded-2xl px-4 py-3 text-[14px] font-medium shadow-xl">
            <i id="alertIcon" data-lucide="check-circle" class="h-5 w-5 shrink-0"></i>
            <span id="alertMessage">ข้อความแจ้งเตือน</span>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://hutcroemvwxhhyvutdfj.supabase.co";

        function roundMoney(value) {
            const amount = Number(value);
            if (!Number.isFinite(amount)) return 0;
            const adjustment = Math.sign(amount) * Number.EPSILON * Math.max(1, Math.abs(amount));
            return Math.round((amount + adjustment) * 100) / 100;
        }

        function sortByOrderIndex(items) {
            return items.slice().sort((a, b) => {
                const aOrder = a.order_index != null && Number.isFinite(Number(a.order_index)) ? Number(a.order_index) : Number.MAX_SAFE_INTEGER;
                const bOrder = b.order_index != null && Number.isFinite(Number(b.order_index)) ? Number(b.order_index) : Number.MAX_SAFE_INTEGER;
                return aOrder - bOrder || new Date(a.created_at || 0) - new Date(b.created_at || 0);
            });
        }

        async function fetchAllUserRows(tableName, userId, orderColumn) {
            const pageSize = 500;
            const { count, error: countError } = await supabaseClient.from(tableName)
                .select('*', { count: 'exact', head: true }).eq('user_id', userId);
            if (countError) throw countError;
            if (count === null) throw new Error(`อ่านจำนวนข้อมูลในตาราง ${tableName} ไม่สำเร็จ`);

            const pageCount = Math.ceil(count / pageSize);
            const pages = await Promise.all(Array.from({ length: pageCount }, (_, pageIndex) => {
                const query = supabaseClient.from(tableName).select('*')
                    .eq('user_id', userId)
                    .order(orderColumn, { ascending: tableName !== 'transactions' })
                    .order('id', { ascending: true });
                return query.range(pageIndex * pageSize, (pageIndex + 1) * pageSize - 1);
            }));
            const failedPage = pages.find(page => page.error);
            if (failedPage) throw failedPage.error;
            return pages.flatMap(page => page.data || []);
        }

        async function loadAllData(tables = null) {
            if (!currentUser) return;
            setSyncStatus(navigator.onLine ? 'syncing' : 'offline');
            try {
                const userId = currentUser.id;
                // Pass a list of table names to refresh only those; omit it for a full reload.
                const isFullLoad = !tables;
                const wanted = new Set(tables || ['accounts', 'categories', 'budgets', 'transactions', 'savings_goals']);
                const load = (name, orderColumn) => wanted.has(name) ? fetchAllUserRows(name, userId, orderColumn) : Promise.resolve(null);
                const [accountRows, categoryRows, budgetRows, transactionRows, savingsGoalRows] = await Promise.all([
                    load('accounts', 'created_at'),
                    load('categories', 'created_at'),
                    load('budgets', 'created_at'),
                    load('transactions', 'transaction_date'),
                    load('savings_goals', 'created_at')
                ]);

                setSyncStatus('online');

                const storedAccountRows = accountRows || [];
                const storedTransactionRows = transactionRows || [];
                const moneyRepairs = [
                    ...storedAccountRows
                        .filter(account => Number.isFinite(Number(account.balance)) && Number(account.balance) !== roundMoney(account.balance))
                        .map(account => supabaseClient.from('accounts').update({ balance: roundMoney(account.balance) })
                            .eq('id', account.id).eq('user_id', userId)),
                    ...storedTransactionRows
                        .filter(transaction => Number.isFinite(Number(transaction.amount)) && Number(transaction.amount) !== roundMoney(transaction.amount))
                        .map(transaction => supabaseClient.from('transactions').update({ amount: roundMoney(transaction.amount) })
                            .eq('id', transaction.id).eq('user_id', userId))
                ];
                const repairResults = await Promise.all(moneyRepairs);
                repairResults.filter(result => result.error).forEach(result => console.error('Money precision cleanup error:', result.error));

                if (accountRows) db.accounts = storedAccountRows.map(account => ({
                    ...account,
                    balance: ['credit', 'loan'].includes(account.account_type)
                        ? -Math.abs(roundMoney(account.balance))
                        : roundMoney(account.balance)
                })).sort((a, b) => {
                    const aOrder = a.order_index != null && Number.isFinite(Number(a.order_index)) ? Number(a.order_index) : Number.MAX_SAFE_INTEGER;
                    const bOrder = b.order_index != null && Number.isFinite(Number(b.order_index)) ? Number(b.order_index) : Number.MAX_SAFE_INTEGER;
                    return aOrder - bOrder || new Date(a.created_at || 0) - new Date(b.created_at || 0);
                });
                if (categoryRows) db.categories = sortByOrderIndex(categoryRows);
                if (budgetRows) db.budgets = sortByOrderIndex(budgetRows);
                if (transactionRows) db.transactions = storedTransactionRows.map(transaction => ({
                    ...transaction,
                    amount: roundMoney(transaction.amount)
                }));
                if (savingsGoalRows) db.savings_goals = sortByOrderIndex(savingsGoalRows);
                if (accountRows) db.summary_notes = Object.fromEntries(db.accounts.map(account => [String(account.id), account.note || '']));

                // Migrate notes previously stored only in this browser into the accounts table.
                for (const account of (isFullLoad ? db.accounts : [])) {
                    const accountId = String(account.id);
                    if (account.note) continue;
                    const legacyKey = `savetung-summary-note-${userId}-${accountId}`;
                    let legacyNote;
                    try {
                        legacyNote = localStorage.getItem(legacyKey);
                    } catch (error) {
                        console.warn('Unable to read legacy summary note:', error);
                        continue;
                    }
                    if (legacyNote === null) continue;
                    const { error } = await supabaseClient.from('accounts').update({ note: legacyNote })
                        .eq('id', account.id).eq('user_id', userId);
                    if (error) {
                        console.error('Summary note migration error:', error);
                    } else {
                        account.note = legacyNote;
                        db.summary_notes[accountId] = legacyNote;
                        try { localStorage.removeItem(legacyKey); } catch (error) { console.warn('Unable to remove migrated note:', error); }
                    }
                }
            } catch (e) {
                setSyncStatus('error');
                console.error("Supabase load exception:", e);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ Supabase: " + e.message, 'error');
            }
        }

            if (data && data[0]) {
                db[tableName].push(data[0]);

            setSyncStatus('online');
            return data ? data[0] : record;

                .eq('id', id).eq('user_id', currentUser.id).select('id');

                console.error("Supabase Update Error:", error);

            if (idx !== -1) {
                db[tableName][idx] = { ...db[tableName][idx], ...updatedFields };

        // ==========================================
        // DRAG-TO-REORDER (accounts, categories, budgets, savings goals)
        // ==========================================
        const reorderMode = { accounts: false, categories: false, budgets: false, savings_goals: false };
        const reorderSavedMessages = {
            accounts: 'บันทึกลำดับบัญชีสำเร็จ',
            categories: 'บันทึกลำดับหมวดหมู่สำเร็จ',
            budgets: 'บันทึกลำดับงบประมาณสำเร็จ',
            savings_goals: 'บันทึกลำดับเป้าหมายสำเร็จ'
        };
        let draggedReorderItem = null;
        let touchDraggedReorderItem = null;

        function reorderAttrs(tableName, id) {
            const active = reorderMode[tableName];
            return `data-reorder-list="${tableName}" data-reorder-id="${id}" draggable="${active}" ondragstart="startReorderDrag(event, '${tableName}', '${id}')" ondragover="event.preventDefault()" ondrop="dropReorder(event, '${tableName}', '${id}')" ontouchstart="startReorderTouch(event, '${tableName}', '${id}')" ontouchmove="moveReorderTouch(event)" ontouchend="endReorderTouch(event)" ontouchcancel="endReorderTouch(event)" style="${active ? 'touch-action:none;' : ''}"`;
        }

        // Accounts are only reordered within their own account type; other lists are one group.
        function moveReorderItem(tableName, sourceId, targetId, insertAfter) {
            const items = db[tableName];
            const source = items.find(item => String(item.id) === String(sourceId));
            const target = items.find(item => String(item.id) === String(targetId));
            if (!source || !target || source === target) return false;
            if (tableName === 'accounts' && source.account_type !== target.account_type) return false;

            const inGroup = item => tableName !== 'accounts' || item.account_type === source.account_type;
            const group = items.filter(inGroup);
            group.splice(group.indexOf(source), 1);
            group.splice(group.indexOf(target) + (insertAfter ? 1 : 0), 0, source);
            let nextIndex = 0;
            for (let index = 0; index < items.length; index++) {
                if (inGroup(items[index])) items[index] = group[nextIndex++];
            }
            return true;
        }

        function startReorder(tableName) {
            reorderMode[tableName] = true;
            draggedReorderItem = null;
            renderCurrentTab();
        }

        function startReorderDrag(event, tableName, id) {
            if (!reorderMode[tableName]) {
                event.preventDefault();
                return;
            }
            draggedReorderItem = { tableName, id: String(id) };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(id));
        }

        function dropReorder(event, tableName, targetId) {
            event.preventDefault();
            if (!reorderMode[tableName]) return;
            const sourceId = draggedReorderItem?.tableName === tableName
                ? draggedReorderItem.id
                : event.dataTransfer.getData('text/plain');
            const target = event.currentTarget;
            const insertAfter = event.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            if (moveReorderItem(tableName, sourceId, targetId, insertAfter)) renderCurrentTab();
        }

        function startReorderTouch(event, tableName, id) {
            if (!reorderMode[tableName] || event.touches.length !== 1) return;
            touchDraggedReorderItem = { tableName, id: String(id) };
            event.preventDefault();
            event.currentTarget.classList.add('opacity-60', 'ring-2', 'ring-blue-400');
        }

        function moveReorderTouch(event) {
            const dragged = touchDraggedReorderItem;
            if (!dragged || !reorderMode[dragged.tableName] || !event.touches.length) return;
            event.preventDefault();
            const touch = event.touches[0];
            const target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('[data-reorder-id]');
            if (!target || target.dataset.reorderList !== dragged.tableName || target.dataset.reorderId === dragged.id) return;
            const insertAfter = touch.clientY > target.getBoundingClientRect().top + target.offsetHeight / 2;
            if (!moveReorderItem(dragged.tableName, dragged.id, target.dataset.reorderId, insertAfter)) return;

            const list = target.parentElement;
            const cards = new Map([...list.children].map(card => [card.dataset.reorderId, card]));
            db[dragged.tableName].forEach(item => {
                const card = cards.get(String(item.id));
                if (card) list.appendChild(card);
            });
            [...list.children].forEach((card, index) => {
                const number = card.querySelector('.reorder-number');
                if (number) number.textContent = index + 1;
            });
        }

        function endReorderTouch(event) {
            if (!touchDraggedReorderItem) return;
            document.querySelectorAll('[data-reorder-id]').forEach(card => card.classList.remove('opacity-60', 'ring-2', 'ring-blue-400'));
            touchDraggedReorderItem = null;
            if (event) event.preventDefault();
        }

        async function saveReorder(tableName) {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนบันทึกลำดับ', 'error');
                return;
            }
            const items = db[tableName];
            const positionOf = item => tableName === 'accounts'
                ? items.filter(other => other.account_type === item.account_type).indexOf(item)
                : items.indexOf(item);
            const results = await Promise.all(items.map(item =>
                supabaseClient.from(tableName).update({ order_index: positionOf(item) })
                    .eq('id', item.id).eq('user_id', currentUser.id)
            ));
            const failed = results.find(result => result.error);
            if (failed) {
                showAlert('บันทึกลำดับไม่สำเร็จ: ' + failed.error.message, 'error');
                await loadAllData([tableName]);
                renderCurrentTab();
                return;
            }
            reorderMode[tableName] = false;
            draggedReorderItem = null;
            await loadAllData([tableName]);
            renderCurrentTab();
            showAlert(reorderSavedMessages[tableName]);
        }

        async function cancelReorder(tableName) {
            reorderMode[tableName] = false;
            draggedReorderItem = null;
            await loadAllData([tableName]);
            renderCurrentTab();
        }

        async function saveSummaryNote(accountId) {
            const input = document.getElementById(`accountNote-${accountId}`);
            const status = document.getElementById(`summaryNoteStatus-${accountId}`);
            const button = document.getElementById(`saveSummaryNote-${accountId}`);
            if (!currentUser || !input || !accountId) return;

            const note = input.value;
            if (status) status.textContent = 'กำลังบันทึก…';
            if (button) button.disabled = true;

            try {
                const { data, error } = await supabaseClient.from('accounts').update({ note })
                    .eq('id', accountId).eq('user_id', currentUser.id).select('id');
                if (error || !data?.length) throw error || new Error('ไม่พบข้อมูลหรือไม่มีสิทธิ์แก้ไข');

                db.summary_notes[accountId] = note;
                const account = db.accounts.find(item => String(item.id) === String(accountId));
                if (account) account.note = note;
                setSyncStatus('online');
                activeSummaryNoteId = null;
                renderCurrentTab();
            } catch (error) {
                console.error('Summary note save error:', error);
                if (status) status.textContent = 'บันทึกไม่สำเร็จ';
                setSyncStatus('error');
                showAlert('บันทึกโน้ตไม่สำเร็จ: ' + error.message, 'error');
            } finally {
                if (button) button.disabled = false;
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({

        const ASSET_TYPES = ['cash', 'bank', 'investment'];
        const LIABILITY_TYPES = ['credit', 'loan'];

        function getAccountTotals() {
            const totalAssets = db.accounts
                .filter(account => ASSET_TYPES.includes(account.account_type))
                .reduce((sum, account) => sum + (Number(account.balance) || 0), 0);
            const totalLiabilities = db.accounts
                .filter(account => LIABILITY_TYPES.includes(account.account_type))
                .reduce((sum, account) => sum + Math.abs(Number(account.balance) || 0), 0);
            return { totalAssets, totalLiabilities, netWorth: totalAssets - totalLiabilities };

        function summarizePeriod(transactions) {
            const sumOf = types => transactions
                .filter(tx => types.includes(tx.transaction_type))

            return { income: sumOf(['income']), expense: sumOf(SPEND_TYPES) };

        // Groups transactions by category, largest total first. id matches the 'uncategorized' key used by the breakdown modal.
        function groupByCategory(transactions, fallbackColor = '#94a3b8') {
            return Object.values(transactions.reduce((groups, tx) => {
                const category = db.categories.find(item => String(item.id) === String(tx.category_id));
                const key = tx.category_id || 'uncategorized';
                if (!groups[key]) groups[key] = { id: key, name: category?.category_name || 'ไม่ระบุหมวดหมู่', color: category?.color || fallbackColor, total: 0 };
                groups[key].total += Number(tx.amount) || 0;
                return groups;
            }, {})).sort((a, b) => b.total - a.total);
        }

        const SAVINGS_GOAL_MARKER = '\u2063savetung_goal=';
        function getTransactionNote(tx) {
            return String(tx?.transaction_note || '').replace(/\u2063savetung_goal=[^\u2063]*\u2063/g, '').trim();
        }
        function getTransactionSavingsGoalId(tx) {
            const match = String(tx?.transaction_note || '').match(/\u2063savetung_goal=([^\u2063]*)\u2063/);
            if (!match) return '';
            try { return decodeURIComponent(match[1]); } catch { return ''; }
        }
        function encodeTransactionNote(note, savingsGoalId = '') {
            const visibleNote = String(note || '').trim();
            return savingsGoalId
                ? `${visibleNote}${SAVINGS_GOAL_MARKER}${encodeURIComponent(savingsGoalId)}\u2063`
                : visibleNote;

        function getSavingsGoalContribution(tx) {

        function calculateSavedPeriods(goal, currentAmount = goal.current_amount) {
            const totalPeriods = Math.max(0, Math.floor(Number(goal.total_periods) || 0));
            if (!totalPeriods) return 0;
            const amount = Math.max(0, roundMoney(currentAmount));
            const targetAmount = Number(goal.target_amount) || 0;
            if (targetAmount > 0 && amount >= targetAmount) return totalPeriods;
            const monthlyTarget = Number(goal.monthly_target) || 0;
            if (monthlyTarget <= 0) return 0;
            return Math.min(totalPeriods, Math.floor((amount + 0.000001) / monthlyTarget));
        }

        function filterTransactionsByDate(txs) {
            const d = new Date(globalFilter.currentDate);
            return txs.filter(tx => {
                if (!tx.transaction_date) return false;
                const txDate = new Date(tx.transaction_date);
                if (globalFilter.mode === 'today') {
                    return txDate.toDateString() === d.toDateString();
                } else if (globalFilter.mode === 'month') {
                    return txDate.getFullYear() === d.getFullYear() && txDate.getMonth() === d.getMonth();
                } else if (globalFilter.mode === 'year') {
                    return txDate.getFullYear() === d.getFullYear();
                } else if (globalFilter.mode === 'custom' && globalFilter.startDate && globalFilter.endDate) {
                    const [startYear, startMonth, startDay] = globalFilter.startDate.split('-').map(Number);
                    const [endYear, endMonth, endDay] = globalFilter.endDate.split('-').map(Number);
                    const start = new Date(startYear, startMonth - 1, startDay);
                    const end = new Date(endYear, endMonth - 1, endDay, 23, 59, 59, 999);
                    return txDate >= start && txDate <= end;
                }
                return true;
            });
        }

        function getCardPaymentSummary(card, today, asOfDate = today) {
            const dueDay = Number(card.due_date);
            if (!Number.isInteger(dueDay) || dueDay < 1 || dueDay > 31) return null;

            const statementDay = Math.min(Math.max(Number(card.statement_date) || 25, 1), 31);
            const dueDateForMonth = (year, month) => new Date(year, month, Math.min(dueDay, new Date(year, month + 1, 0).getDate()));
            let dueDate = dueDateForMonth(today.getFullYear(), today.getMonth());
            if (dueDate < today) dueDate = dueDateForMonth(today.getFullYear(), today.getMonth() + 1);
            const previousDueDate = dueDateForMonth(dueDate.getFullYear(), dueDate.getMonth() - 1);
            const todayEnd = new Date(asOfDate);
            todayEnd.setHours(23, 59, 59, 999);
            const dueDateEnd = new Date(dueDate);
            dueDateEnd.setHours(23, 59, 59, 999);
            if (todayEnd > dueDateEnd) todayEnd.setTime(dueDateEnd.getTime());
            const monthIndex = date => date.getFullYear() * 12 + date.getMonth();
            const items = [];

            db.transactions.forEach(tx => {
                if (tx.transaction_type !== 'credit_spend' || String(tx.wallet_id) !== String(card.id) || !tx.transaction_date) return;
                const purchaseDate = new Date(tx.transaction_date);
                if (Number.isNaN(purchaseDate.getTime())) return;

                // รายการหลังวันสรุปยอดจะไปอยู่ในรอบถัดไป ส่วนวันครบกำหนด
                // จะอยู่เดือนเดียวกับวันสรุปยอดหรือเดือนถัดไปตามลำดับวันที่
                let statementMonth = new Date(purchaseDate.getFullYear(), purchaseDate.getMonth(), 1);
                if (purchaseDate.getDate() > statementDay) statementMonth.setMonth(statementMonth.getMonth() + 1);
                const dueMonthOffset = dueDay <= statementDay ? 1 : 0;
                const firstDueDate = dueDateForMonth(statementMonth.getFullYear(), statementMonth.getMonth() + dueMonthOffset);
                const cyclesElapsed = monthIndex(dueDate) - monthIndex(firstDueDate);
                if (cyclesElapsed < 0) return;

                const amount = Number(tx.amount) || 0;
                if (tx.is_installment) {
                    const totalMonths = Number(tx.installment_total_months);
                    const currentMonth = Number(tx.installment_current_month) || 1;
                    const installmentNumber = currentMonth + cyclesElapsed;
                    if (!Number.isInteger(totalMonths) || totalMonths < 1 || installmentNumber > totalMonths) return;
                    items.push({
                        note: tx.transaction_note || 'รายการผ่อนชำระ',
                        amount: amount / totalMonths,
                        installment: `${installmentNumber}/${totalMonths}`
                    });
                } else if (cyclesElapsed === 0) {
                    items.push({ note: tx.transaction_note || 'รายการบัตรเครดิต', amount, installment: '' });
                }
            });

            const scheduledAmount = items.reduce((sum, item) => sum + item.amount, 0);
            const paymentsMade = db.transactions
                .filter(tx => tx.transaction_type === 'credit_payment' && String(tx.to_wallet_id) === String(card.id) && tx.transaction_date)
                .filter(tx => {
                    const paymentDate = new Date(tx.transaction_date);
                    return paymentDate > previousDueDate && paymentDate <= todayEnd;
                })
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            return {
                dueDate,
                items,
                scheduledAmount,
                paymentsMade,
                amountToPrepare: Math.max(0, scheduledAmount - paymentsMade)
            };
        }

        function txDirection(tx) {
            if (tx.transaction_type === 'income') return 'in';
            if (SPEND_TYPES.includes(tx.transaction_type)) return 'out';

        function renderTxRow(tx) {
            const category = categoryById(tx.category_id) || { category_name: 'ทั่วไป', color: '#94a3b8', icon: 'tag' };
            const from = accountById(tx.wallet_id);

                    : null;

            const amountClass = direction === 'in'
                ? 'text-emerald-600 dark:text-emerald-400'

        function localDateKey(value) {
            const date = new Date(value);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function dayLabel(value) {
            const date = new Date(value);
            const today = new Date();
            const startOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
            const diffDays = Math.round((startOf(today) - startOf(date)) / 86400000);
            if (diffDays === 0) return 'วันนี้';
            if (diffDays === 1) return 'เมื่อวาน';
            return date.toLocaleDateString('th-TH', {
                weekday: 'short', day: 'numeric', month: 'short',
                ...(date.getFullYear() !== today.getFullYear() ? { year: 'numeric' } : {})
            });
        }

        function renderTxGroups(transactions) {
            const sorted = [...transactions].sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
            const groups = [];
            sorted.forEach(tx => {
                const key = localDateKey(tx.transaction_date);
                let group = groups[groups.length - 1];
                if (!group || group.key !== key) {
                    group = { key, date: tx.transaction_date, items: [] };
                    groups.push(group);
                }
                group.items.push(tx);
            });
            return groups.map(group => {
                const { income, expense } = summarizePeriod(group.items);
                const net = income - expense;
                return `
                    <section>
                        <div class="mb-1.5 flex items-center justify-between px-2">
                            <h3 class="text-[13px] font-bold text-slate-500 dark:text-slate-400">${escapeHtml(dayLabel(group.date))}</h3>
                            ${income || expense ? `<span class="num text-[12px] font-semibold ${net < 0 ? 'text-rose-500' : 'text-emerald-600 dark:text-emerald-400'}">${net < 0 ? '−' : '+'}${formatBaht(Math.abs(net))}</span>` : ''}
                        </div>
                        <div class="card p-1.5">${group.items.map(renderTxRow).join('')}</div>
                    </section>
                `;
            }).join('');
        }

        function getBudgetUsage(budget) {
            const periodStart = parseBudgetPeriodDate(budget.start_period);
            const periodEnd = parseBudgetPeriodDate(budget.end_period, true);
            const spent = db.transactions
                .filter(tx => {
                    if (String(tx.category_id) !== String(budget.category_id) || !SPEND_TYPES.includes(tx.transaction_type)) return false;
                    const txDate = new Date(tx.transaction_date);
                    return (!periodStart || txDate >= periodStart) && (!periodEnd || txDate <= periodEnd);
                })
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const limit = Number(budget.budget_limit) || 0;
            return {
                spent,
                limit,
                percent: limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0,
                isOver: spent > limit,
                remaining: limit - spent
            };
        }

        function progressColor(percent, isOver) {

            if (percent >= 80) return 'bg-amber-500';

            const email = currentUser?.email || '';
            const pages = [
                ['budgets_goals', 'งบประมาณ & เป้าหมายออม', 'ตั้งงบรายจ่าย ติดตามเงินออม', 'piggy-bank', 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300'],
                ['analytics', 'วิเคราะห์', 'กราฟแนวโน้มและสัดส่วนรายจ่าย', 'chart-pie', 'bg-brand-100 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300'],
                ['categories', 'หมวดหมู่', 'เพิ่ม แก้ไข และจัดเรียงหมวดหมู่', 'tags', 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300']
            ];
            const row = (onclick, icon, tone, title, subtitle, trailing = '<i data-lucide="chevron-right" class="h-5 w-5 text-slate-300 dark:text-slate-600"></i>', titleClass = 'text-slate-900 dark:text-white') => `
                <button type="button" onclick="${onclick}" class="flex w-full items-center gap-3 rounded-2xl px-3 py-3 text-left transition hover:bg-slate-50 active:bg-slate-100 dark:hover:bg-white/5">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl ${tone}"><i data-lucide="${icon}" class="h-5 w-5"></i></span>
                    <span class="min-w-0 flex-1"><span class="block text-[15px] font-semibold ${titleClass}">${title}</span>${subtitle ? `<span class="block truncate text-[12px] muted">${subtitle}</span>` : ''}</span>
                    ${trailing}
                </button>
            `;
            container.innerHTML = `
                <div class="fade-in space-y-4">
                    <section class="card flex items-center gap-3 p-4">
                        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-brand-600 text-lg font-bold uppercase text-white">${escapeHtml(email.charAt(0) || 'S')}</span>
                        <div class="min-w-0">
                            <div class="truncate text-[15px] font-bold text-slate-900 dark:text-white">${escapeHtml(email || 'ผู้ใช้ SaveTung')}</div>
                            <div class="text-[12px] muted">${db.accounts.length} บัญชี · ${db.transactions.length} รายการ</div>
                        </div>
                    </section>
                    <section class="card p-1.5">
                        ${pages.map(([tab, title, subtitle, icon, tone]) => row(`switchTab('${tab}')`, icon, tone, title, subtitle)).join('')}
                    </section>
                    <section class="card p-1.5">
                        ${row('exportTransactionsCsv()', 'download', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300', 'ส่งออกข้อมูลทั้งหมด', 'ไฟล์ Excel แยกแผ่นตามตาราง')}
                        ${row('toggleDarkMode(); renderCurrentTab()', isDark ? 'sun' : 'moon', 'bg-slate-100 text-slate-700 dark:bg-white/10 dark:text-slate-200', 'โหมดมืด', isDark ? 'เปิดอยู่' : 'ปิดอยู่',
                            `<span class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition ${isDark ? 'bg-brand-600' : 'bg-slate-200'}"><span class="absolute h-5 w-5 rounded-full bg-white shadow transition ${isDark ? 'left-[22px]' : 'left-0.5'}"></span></span>`)}
                        ${row('handleLogout()', 'log-out', 'bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300', 'ออกจากระบบ', '', '', 'text-rose-600 dark:text-rose-400')}
                    </section>
                    <p class="pb-2 text-center text-[12px] muted">SaveTung · ข้อมูลซิงก์กับ Supabase</p>
                </div>
            `;
        }

        let txSearch = '';

        let txKindFilter = 'all';

        function setTxKindFilter(kind) {
            txKindFilter = kind;
            renderCurrentTab();
        }

        function renderTransactionList() {
            const summaryEl = document.getElementById('txSummary');
            const listEl = document.getElementById('txList');
            if (!summaryEl || !listEl) return;

            const periodTxs = filterTransactionsByDate(db.transactions);
            const query = txSearch.trim().toLowerCase();
            const visible = periodTxs
                .filter(tx => txKindFilter === 'all' || txDirection(tx) === txKindFilter)
                .filter(tx => {
                    if (!query) return true;
                    const category = categoryById(tx.category_id);
                    const haystack = [getTransactionNote(tx), category?.category_name, accountById(tx.wallet_id)?.account_name, accountById(tx.to_wallet_id)?.account_name, TX_TYPE_LABELS[tx.transaction_type]]
                        .filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(query);
                });

            // Totals per payment channel for the whole period (independent of search).
            let cashInc = 0, cashExp = 0, bankInc = 0, bankExp = 0, creditSpend = 0, creditPayment = 0, transferTotal = 0;
            periodTxs.forEach(tx => {
                const sourceType = accountById(tx.wallet_id)?.account_type || 'cash';
                const targetType = accountById(tx.to_wallet_id)?.account_type || null;
                const amount = Number(tx.amount) || 0;
                if (tx.transaction_type === 'income') {
                    if (sourceType === 'cash') cashInc += amount;
                    else if (sourceType === 'bank') bankInc += amount;
                } else if (tx.transaction_type === 'expense') {
                    if (sourceType === 'cash') cashExp += amount;
                    else if (sourceType === 'bank') bankExp += amount;
                } else if (tx.transaction_type === 'credit_spend' && sourceType === 'credit') {
                    creditSpend += amount;
                } else if (tx.transaction_type === 'credit_payment') {
                    if (sourceType === 'cash') cashExp += amount;
                    else if (sourceType === 'bank') bankExp += amount;
                    if (targetType === 'credit') creditPayment += amount;
                } else if (tx.transaction_type === 'transfer') {
                    transferTotal += amount;
                }
            });
            const { income, expense } = summarizePeriod(visible);
            const channel = (icon, tone, title, rows) => `
                <div class="rounded-2xl bg-slate-50 p-3 dark:bg-white/5">
                    <div class="mb-1.5 flex items-center gap-1.5 text-[12px] font-bold ${tone}"><i data-lucide="${icon}" class="h-3.5 w-3.5"></i>${title}</div>
                    ${rows.map(([label, value, cls]) => `<div class="flex justify-between gap-1 text-[12px]"><span class="muted">${label}</span><span class="num font-semibold ${cls}">${formatBaht(value)}</span></div>`).join('')}
                </div>
            `;

            summaryEl.innerHTML = `
                <section class="card p-4">
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><div class="text-[12px] muted">รับ</div><div class="num text-[15px] font-bold text-emerald-600 dark:text-emerald-400">+${formatBaht(income)}</div></div>
                        <div><div class="text-[12px] muted">จ่าย</div><div class="num text-[15px] font-bold text-rose-600 dark:text-rose-400">−${formatBaht(expense)}</div></div>
                        <div><div class="text-[12px] muted">สุทธิ</div><div class="num text-[15px] font-bold ${income - expense < 0 ? 'text-rose-600 dark:text-rose-400' : 'text-slate-900 dark:text-white'}">${formatBaht(income - expense)}</div></div>
                    </div>
                    <details class="group mt-3 border-t border-slate-100 pt-2 dark:border-white/5">
                        <summary class="flex cursor-pointer list-none items-center justify-between rounded-xl px-1 py-1.5 text-[13px] font-semibold text-slate-600 dark:text-slate-300">
                            สรุปตามช่องทางการเงิน
                            <i data-lucide="chevron-down" class="h-4 w-4 transition group-open:rotate-180"></i>
                        </summary>
                        <div class="mt-2 grid grid-cols-3 gap-2">
                            ${channel('wallet', 'text-emerald-700 dark:text-emerald-300', 'เงินสด', [['รับ', cashInc, 'text-emerald-600 dark:text-emerald-400'], ['จ่าย', cashExp, 'text-rose-600 dark:text-rose-400']])}
                            ${channel('landmark', 'text-sky-700 dark:text-sky-300', 'ธนาคาร', [['รับ', bankInc, 'text-emerald-600 dark:text-emerald-400'], ['จ่าย', bankExp, 'text-rose-600 dark:text-rose-400']])}
                            ${channel('credit-card', 'text-violet-700 dark:text-violet-300', 'บัตร', [['รูด', creditSpend, 'text-rose-600 dark:text-rose-400'], ['จ่ายบิล', creditPayment, 'text-emerald-600 dark:text-emerald-400']])}
                        </div>
                        <div class="mt-2 flex justify-between px-1 text-[12px]"><span class="muted">โอนระหว่างบัญชี (ไม่นับรับ/จ่าย)</span><span class="num font-semibold text-brand-600 dark:text-brand-300">${formatBaht(transferTotal)}</span></div>
                    </details>
                </section>
            `;

            listEl.innerHTML = renderTxGroups(visible) || `<div class="card">${emptyState('receipt-text',
                query || txKindFilter !== 'all' ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีรายการในช่วงเวลานี้',
                query || txKindFilter !== 'all' ? 'ลองเปลี่ยนคำค้นหาหรือประเภท' : 'กดปุ่ม + เพื่อบันทึกรายการ')}</div>`;
            lucide.createIcons();
        }

        // The six stored transaction types, shown as explicit choices in the sheet.
        const TX_TYPES = {
            expense: { label: 'รายจ่าย', icon: 'arrow-up-right', tone: 'text-rose-600 dark:text-rose-300', hint: 'ใช้จ่ายด้วยเงินสดหรือบัญชีธนาคาร' },
            income: { label: 'รายรับ', icon: 'arrow-down-left', tone: 'text-emerald-600 dark:text-emerald-300', hint: 'เงินเข้าบัญชี เช่น เงินเดือน' },
            credit_spend: { label: 'รูดบัตร', icon: 'credit-card', tone: 'text-violet-600 dark:text-violet-300', hint: 'ใช้จ่ายด้วยบัตรเครดิต · หนี้บัตรเพิ่มขึ้น (ยังไม่ใช่การจ่ายบิล)' },
            credit_payment: { label: 'จ่ายบิลบัตร', icon: 'receipt-text', tone: 'text-amber-600 dark:text-amber-300', hint: 'ชำระยอดบัตรจากเงินสด/ธนาคาร · หนี้บัตรลดลง' },
            transfer: { label: 'โอนเงิน', icon: 'arrow-left-right', tone: 'text-sky-600 dark:text-sky-300', hint: 'ย้ายเงินระหว่างบัญชีของคุณ · ไม่นับเป็นรายรับหรือรายจ่าย' },
            saving: { label: 'ออมเงิน', icon: 'piggy-bank', tone: 'text-teal-600 dark:text-teal-300', hint: 'ย้ายเงินไปเก็บ และนับยอดเข้าเป้าหมายเงินออม' }
        };
        const TX_TYPE_ORDER = ['expense', 'income', 'credit_spend', 'credit_payment', 'transfer', 'saving'];

        function openTxWithKind(type) {
            openTransactionModal();
            setTxType(type);
        }

        function openSavingFor(goalId) {
            openTxWithKind('saving');
            const walletSelect = document.getElementById('txWalletId');
            const toWalletSelect = document.getElementById('txToWalletId');
            if (toWalletSelect.value === walletSelect.value) {
                const other = [...toWalletSelect.options].find(option => option.value !== walletSelect.value);
                if (other) toWalletSelect.value = other.value;
            }
            document.getElementById('txSavingsGoalId').value = goalId;
            refreshAccountPicker(walletSelect);
            refreshAccountPicker(toWalletSelect);
            syncTxType();
        }

        function setTxType(type) {
            document.getElementById('txType').value = type;
            renderTxForm();
        }

        function renderAccountOptions(accounts) {
            const groupLabels = { cash: 'เงินสด', bank: 'เงินฝากธนาคาร', credit: 'บัตรเครดิต', investment: 'การลงทุน', loan: 'หนี้สิน' };
            return ACCOUNT_TYPE_ORDER.map(accountType => {
                const matching = accounts.filter(account => account.account_type === accountType);
                if (!matching.length) return '';
                return `<optgroup label="${groupLabels[accountType]}">${matching.map(account => `<option class="account-select-option" value="${escapeHtml(account.id)}">${escapeHtml(account.account_name)}</option>`).join('')}</optgroup>`;
            }).join('');
        }

        function fillSelectKeepingValue(select, html) {
            const previous = select.value;
            select.innerHTML = html;
            if ([...select.options].some(option => option.value === previous)) select.value = previous;
        }

        function renderTxForm() {
            const type = document.getElementById('txType').value;
            const walletSelect = document.getElementById('txWalletId');
            const toWalletSelect = document.getElementById('txToWalletId');
            const categorySelect = document.getElementById('txCategoryId');
            const goalSelect = document.getElementById('txSavingsGoalId');
            if (!walletSelect || !toWalletSelect || !categorySelect) return;

            document.getElementById('txKindTabs').innerHTML = TX_TYPE_ORDER.map(key => {
                const meta = TX_TYPES[key];
                const active = key === type;
                return `<button type="button" role="tab" data-kind="${key}" aria-selected="${active}" onclick="setTxType('${key}')" class="tx-kind flex flex-col items-center gap-1 rounded-xl px-1 py-2.5 text-[13px] font-semibold transition ${active ? `bg-white shadow-sm dark:bg-slate-700 ${meta.tone}` : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white'}"><i data-lucide="${meta.icon}" class="h-[18px] w-[18px]"></i><span class="leading-tight">${meta.label}</span></button>`;
            }).join('');

            const accounts = db.accounts;
            const byType = types => accounts.filter(account => types.includes(account.account_type));
            const hasDestination = ['credit_payment', 'transfer', 'saving'].includes(type);
            let sources = accounts, destinations = accounts;
            let fromLabel = 'จ่ายจากบัญชี', toLabel = 'ไปยังบัญชี';
            if (type === 'income') fromLabel = 'รับเข้าบัญชี';
            if (type === 'credit_spend') { sources = byType(['credit']); fromLabel = 'รูดบัตรใบไหน'; }
            if (type === 'credit_payment') { sources = accounts.filter(account => account.account_type !== 'credit'); destinations = byType(['credit']); fromLabel = 'จ่ายจากบัญชี'; toLabel = 'ชำระเข้าบัตรใบไหน'; }
            if (type === 'transfer') { fromLabel = 'โอนจากบัญชี'; toLabel = 'ไปยังบัญชี'; }
            if (type === 'saving') { sources = byType(['cash', 'bank']); destinations = byType(['cash', 'bank', 'investment']); fromLabel = 'ออมจากบัญชี (เงินสด/ธนาคาร)'; toLabel = 'เก็บไว้ที่บัญชี'; }

            fillSelectKeepingValue(walletSelect, renderAccountOptions(sources));
            document.getElementById('txWalletLabel').textContent = fromLabel;
            document.getElementById('toWalletContainer').classList.toggle('hidden', !hasDestination);
            document.getElementById('savingsGoalContainer').classList.toggle('hidden', type !== 'saving');
            if (hasDestination) {
                fillSelectKeepingValue(toWalletSelect, renderAccountOptions(destinations));
                document.getElementById('txToWalletLabel').textContent = toLabel;
                if (toWalletSelect.value === walletSelect.value) {
                    const other = [...toWalletSelect.options].find(option => option.value !== walletSelect.value);
                    if (other) toWalletSelect.value = other.value;
                }
            } else {
                toWalletSelect.innerHTML = '';
            }
            if (goalSelect) {
                fillSelectKeepingValue(goalSelect, `<option value="">เลือกเป้าหมาย</option>${db.savings_goals.map(goal => `<option value="${escapeHtml(goal.id)}">${escapeHtml(goal.goal_title)}</option>`).join('')}`);
                goalSelect.required = type === 'saving';
            }

            const wantedCategoryType = type === 'income' ? 'income' : ['expense', 'credit_spend'].includes(type) ? 'expense' : 'transfer';
            const editingCategoryId = (db.transactions.find(tx => String(tx.id) === document.getElementById('editTxId').value) || {}).category_id;
            let selectable = db.categories.filter(category => category.category_type === wantedCategoryType || String(category.id) === String(editingCategoryId));
            if (!selectable.length) selectable = db.categories;
            fillSelectKeepingValue(categorySelect, selectable.map(category => `<option value="${escapeHtml(category.id)}">${escapeHtml(category.category_name)}</option>`).join(''));

            renderCategoryChips();
            refreshAccountPicker(walletSelect);
            refreshAccountPicker(toWalletSelect);
            syncTxType();
        }

        // Shows the one-line explanation of the chosen type and the instalment box for card charges.
        function syncTxType() {
            const type = document.getElementById('txType')?.value || 'expense';
            document.getElementById('installmentBox').classList.toggle('hidden', type !== 'credit_spend');
            const hint = document.getElementById('txTypeHint');
            if (hint) {
                hint.innerHTML = `<i data-lucide="info" class="h-4 w-4 shrink-0"></i><span>${TX_TYPES[type].hint}</span>`;
                hint.classList.remove('hidden');
                hint.classList.add('flex');
                lucide.createIcons();
            }
            return type;
        }

        function renderCategoryChips() {
            const select = document.getElementById('txCategoryId');
            const box = document.getElementById('txCategoryChips');
            if (!select || !box) return;
            box.innerHTML = [...select.options].map(option => {
                const category = categoryById(option.value) || {};
                const active = option.value === select.value;
                return `<button type="button" onclick="chooseTxCategory('${escapeHtml(option.value)}')" aria-pressed="${active}" class="flex min-w-0 flex-col items-center gap-1.5 rounded-2xl px-1 py-2 text-center transition ${active ? 'bg-brand-50 ring-2 ring-brand-500 dark:bg-brand-500/15' : 'hover:bg-slate-50 dark:hover:bg-white/5'}">
                    ${iconBadge(category.icon, category.color, 'h-10 w-10')}
                    <span class="w-full truncate text-[12px] font-medium ${active ? 'text-brand-700 dark:text-brand-200' : 'text-slate-600 dark:text-slate-300'}">${escapeHtml(category.category_name || option.textContent)}</span>
                </button>`;
            }).join('') || `<div class="col-span-4 rounded-2xl bg-slate-50 p-3 text-center text-[13px] muted dark:bg-white/5">ยังไม่มีหมวดหมู่ประเภทนี้ · <button type="button" onclick="closeTransactionModal(); switchTab('categories')" class="font-semibold text-brand-600 dark:text-brand-300">เพิ่มหมวดหมู่</button></div>`;
            lucide.createIcons();
        }

        function chooseTxCategory(categoryId) {
            document.getElementById('txCategoryId').value = categoryId;
            renderCategoryChips();
        }

        async function deleteTransactionFromModal() {
            const id = document.getElementById('editTxId').value;
            if (!id) return;
            await deleteTransaction(id);
            if (!db.transactions.some(tx => String(tx.id) === String(id))) closeTransactionModal();
        }

        let accountMenuId = null;

        function openAccountMenu(id) {
            const acc = accountById(id);
            if (!acc) return;
            accountMenuId = String(acc.id);
            const isLiability = LIABILITY_TYPES.includes(acc.account_type);
            const balance = isLiability ? Math.abs(Number(acc.balance)) : Number(acc.balance);
            document.getElementById('accountMenuTitle').textContent = acc.account_name;
            document.getElementById('accountMenuSubtitle').textContent = `${(ACCOUNT_TYPE_META[acc.account_type] || {}).label || ''} · ${isLiability ? 'ยอดหนี้' : 'คงเหลือ'} ${formatBaht(balance)}`;
            const hasNote = getSummaryNote(acc.id).trim();
            const item = (action, icon, label, tone = 'text-slate-800 dark:text-slate-100', iconTone = 'bg-slate-100 text-slate-600 dark:bg-white/10 dark:text-slate-300') => `
                <button type="button" onclick="accountMenuAction('${action}')" class="flex w-full items-center gap-3.5 rounded-2xl px-2 py-3 text-left transition active:bg-slate-100 dark:active:bg-white/10">
                    <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl ${iconTone}"><i data-lucide="${icon}" class="h-5 w-5"></i></span>
                    <span class="text-[16px] font-semibold ${tone}">${label}</span>
                </button>`;
            document.getElementById('accountMenuActions').innerHTML =
                item('add', 'plus', acc.account_type === 'credit' ? 'บันทึกรูดบัตรใบนี้' : 'เพิ่มรายการในบัญชีนี้', 'text-brand-700 dark:text-brand-200', 'bg-brand-100 text-brand-600 dark:bg-brand-500/20 dark:text-brand-200') +
                item('ledger', 'book-open', 'ดูสมุดบัญชี') +
                item('note', 'notebook-pen', hasNote ? 'แก้ไขโน้ต' : 'เพิ่มโน้ต') +
                item('edit', 'pencil', 'แก้ไขบัญชี') +
                '<div class="my-1 border-t border-slate-100 dark:border-white/5"></div>' +
                item('delete', 'trash-2', 'ลบบัญชี', 'text-rose-600 dark:text-rose-400', 'bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-300');
            document.getElementById('accountMenuModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeAccountMenu() {
            document.getElementById('accountMenuModal').classList.add('hidden');
        }

        function accountMenuAction(action) {
            const id = accountMenuId;
            closeAccountMenu();
            if (!id) return;
            if (action === 'ledger') openAccountLedger(id);
            else if (action === 'note') showAccountNote(id);
            else if (action === 'edit') openAccountModal(id);
            else if (action === 'delete') deleteAccount(id);
            else if (action === 'add') {
                const acc = accountById(id);
                openTxWithKind(acc?.account_type === 'credit' ? 'credit_spend' : 'expense');
                const walletSelect = document.getElementById('txWalletId');
                walletSelect.value = id;
                refreshAccountPicker(walletSelect);
            }
        }

        function renderAccountCard(acc, index) {
            const isLiability = LIABILITY_TYPES.includes(acc.account_type);
            const balance = isLiability ? Math.abs(Number(acc.balance)) : Number(acc.balance);
            const reordering = reorderMode.accounts;
            const note = getSummaryNote(acc.id);
            const meta = ACCOUNT_TYPE_META[acc.account_type] || ACCOUNT_TYPE_META.cash;
            let subtitle = meta.label;
            if (acc.account_type === 'credit') {
                subtitle = [acc.statement_date ? `สรุปยอดวันที่ ${escapeHtml(acc.statement_date)}` : '', acc.due_date ? `ชำระวันที่ ${escapeHtml(acc.due_date)}` : ''].filter(Boolean).join(' · ') || 'ยังไม่ได้ตั้งรอบบิล';
            }
            const limit = Number(acc.credit_limit) || 0;
            const usedPercent = limit > 0 ? Math.min(100, Math.round(balance / limit * 100)) : 0;

            return `
                <div ${reorderAttrs('accounts', acc.id)} class="account-item relative rounded-2xl bg-slate-50 p-3 transition dark:bg-white/[0.04] ${reordering ? 'cursor-grab ring-1 ring-brand-200 active:cursor-grabbing dark:ring-brand-500/30' : ''}">
                    <div class="flex items-center gap-2.5">
                        ${reordering ? `<span class="reorder-number flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-brand-100 text-[12px] font-bold text-brand-700 dark:bg-brand-500/20 dark:text-brand-200">${index + 1}</span>` : ''}
                        <button type="button" ${reordering ? 'disabled' : `onclick="openAccountLedger('${escapeHtml(acc.id)}')"`} class="flex min-w-0 flex-1 items-center gap-3 text-left">
                            <span class="min-w-0 flex-1">
                                <span class="block truncate text-[15px] font-semibold text-slate-900 dark:text-white">${escapeHtml(acc.account_name)}</span>
                                <span class="block truncate text-[12px] muted">${subtitle}</span>
                            </span>

        async function exportTransactionsCsv() {
            if (!currentUser) {
                showAlert('กรุณาเข้าสู่ระบบก่อนส่งออกข้อมูล', 'error');
                return;
            }
            if (!window.XLSX) {
                showAlert('ไม่สามารถโหลดเครื่องมือสร้างไฟล์ Excel ได้', 'error');
                return;
            }

            const userId = currentUser.id;
            const tableNames = ['accounts', 'categories', 'budgets', 'transactions', 'savings_goals'];
            const pageSize = 500;

            try {
                const tableEntries = await Promise.all(tableNames.map(async tableName => {
                    const { count, error: countError } = await supabaseClient.from(tableName)
                        .select('*', { count: 'exact', head: true }).eq('user_id', userId);
                    if (countError) throw countError;
                    if (count === null) throw new Error(`อ่านจำนวนข้อมูลในตาราง ${tableName} ไม่สำเร็จ`);

                    const pageCount = Math.ceil(count / pageSize);
                    const pages = await Promise.all(Array.from({ length: pageCount }, (_, pageIndex) => {
                        const from = pageIndex * pageSize;
                        return supabaseClient.from(tableName).select('*')
                            .eq('user_id', userId).order('id', { ascending: true })
                            .range(from, from + pageSize - 1);
                    }));
                    const failedPage = pages.find(page => page.error);
                    if (failedPage) throw failedPage.error;
                    return [tableName, pages.flatMap(page => page.data || [])];
                }));

                const workbook = XLSX.utils.book_new();
                tableEntries.forEach(([tableName, rows]) => {
                    const worksheet = XLSX.utils.json_to_sheet(rows);
                    XLSX.utils.book_append_sheet(workbook, worksheet, tableName);
                });
                XLSX.writeFile(workbook, `savetung-all-data-${new Date().toISOString().slice(0, 10)}.xlsx`);
                showAlert('ส่งออกข้อมูลครบ 5 ตารางเป็นไฟล์ Excel แล้ว');
            } catch (error) {
                console.error('Excel export error:', error);
                showAlert('ส่งออกข้อมูลไม่สำเร็จ: ' + error.message, 'error');
            }
        }
