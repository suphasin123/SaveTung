</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

    <!-- Auth Mandatory Screen Modal -->
    <div id="authScreen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">

                </div>

            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">

    <!-- Transaction Modal -->
    <div id="txModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-800 rounded-t-3xl sm:rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-4">
                <h3 id="txModalTitle" class="text-sm font-bold flex items-center gap-2">
                    <i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> บันทึกรายการใหม่
                </h3>
                <button onclick="closeTransactionModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveTransaction(event)" class="space-y-3.5">
                <input type="hidden" id="editTxId">
                <div>
                    <label class="block text-[11px] font-medium mb-1">ประเภทรายการ</label>
                    <select id="txType" onchange="onTxTypeChange()" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs">
                        <option value="expense">รายจ่าย (Expense)</option>
                        <option value="income">รายรับ (Income)</option>
                        <option value="transfer">โอนเงิน (Transfer)</option>

                        <input type="number" step="0.01" id="txAmount" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium mb-1">วันและเวลา</label>
                        <input type="datetime-local" id="txDate" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-[10px]">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium mb-1" id="txWalletLabel">กระเป๋าเงินต้นทาง</label>

                </div>
                <div id="toWalletContainer" class="hidden">
                    <label class="block text-[11px] font-medium mb-1" id="txToWalletLabel">บัญชีปลายทาง</label>
                    <select id="txToWalletId" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-xs"></select>

                <!-- Credit Card Installment Section -->

    <!-- Custom Alert Notification -->
    <div id="customAlert" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 -translate-y-20 opacity-0 max-w-xs w-full px-4 pointer-events-none">
        <div id="alertContent" class="flex items-center space-x-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs font-medium">
            <i id="alertIcon" data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
            <span id="alertMessage">ข้อความแจ้งเตือน</span>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = "https://hutcroemvwxhhyvutdfj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_IzlL-c2tws1LY_VfWWflXw_Y7v_IPpj";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isSignUpMode = false;
        let currentTab = 'dashboard';

        let globalFilter = {
            mode: 'month',
            currentDate: new Date(),
            startDate: '',
            endDate: ''
        };

        let db = {
            accounts: [],
            categories: [],
            budgets: [],
            transactions: [],
            savings_goals: []
        };

        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await checkAuthSession();
        });

        async function checkAuthSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                updateAuthUI(true);
                closeAuthScreen();
                await loadAllData();
                switchTab('dashboard');
            } else {
                currentUser = null;
                updateAuthUI(false);
                openAuthScreen();
            }
        }

        // --- AUTH FUNCTIONS ---
        function openAuthScreen() {
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function closeAuthScreen() {
            document.getElementById('authScreen').classList.add('hidden');
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authModalTitle').textContent = isSignUpMode ? 'SaveTung Sign Up' : 'SaveTung Login';
            document.getElementById('authSubtitle').textContent = isSignUpMode ? 'สมัครสมาชิกใหม่เพื่อเริ่มใช้งาน' : 'เข้าสู่ระบบด้วย Supabase เพื่อเริ่มใช้งาน';
            document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
            document.getElementById('authToggleBtn').textContent = isSignUpMode ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิก';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            try {
                if (isSignUpMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) throw error;
                    showAlert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ');
                    toggleAuthMode();
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    currentUser = data.user;
                    updateAuthUI(true);
                    closeAuthScreen();
                    await loadAllData();
                    switchTab('dashboard');
                    showAlert('เข้าสู่ระบบสำเร็จ');
                }
            } catch (err) {
                showAlert('Auth Error: ' + err.message, 'error');
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            db = { accounts: [], categories: [], budgets: [], transactions: [], savings_goals: [] };
            updateAuthUI(false);
            openAuthScreen();
            showAlert('ออกจากระบบเรียบร้อย');
        }

        function updateAuthUI(isLoggedIn) {
            const userEmailDisplay = document.getElementById('userEmailDisplay');
            const logoutBtn = document.getElementById('logoutBtn');

            if (isLoggedIn && currentUser) {
                userEmailDisplay.textContent = currentUser.email;
                logoutBtn.classList.remove('hidden');
            } else {
                userEmailDisplay.textContent = 'กรุณาเข้าสู่ระบบ';
                logoutBtn.classList.add('hidden');
            }
        }

        function showAlert(message, type = 'success') {
            const alertEl = document.getElementById('customAlert');
            const contentEl = document.getElementById('alertContent');
            const iconEl = document.getElementById('alertIcon');
            const msgEl = document.getElementById('alertMessage');

            if (!alertEl || !contentEl) return;

            msgEl.textContent = message;
            contentEl.className = type === 'success' 
                ? 'flex items-center space-x-2.5 px-4 py-3 rounded-2xl shadow-xl border bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950 dark:border-emerald-800 dark:text-emerald-200'
                : 'flex items-center space-x-2.5 px-4 py-3 rounded-2xl shadow-xl border bg-rose-50 border-rose-200 text-rose-800 dark:bg-rose-950 dark:border-rose-800 dark:text-rose-200';
            
            iconEl.setAttribute('data-lucide', type === 'success' ? 'check-circle' : 'alert-circle');
            lucide.createIcons();

            alertEl.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => { alertEl.classList.add('-translate-y-20', 'opacity-0'); }, 3500);
        }

        // ==========================================
        // DIRECT SUPABASE DATABASE OPERATIONS
        // ==========================================
        async function loadAllData() {
            if (!currentUser) return;
            try {
                const [acc, cat, bud, tx, goal] = await Promise.all([
                    supabaseClient.from('accounts').select('*').order('created_at', { ascending: true }),
                    supabaseClient.from('categories').select('*').order('created_at', { ascending: true }),
                    supabaseClient.from('budgets').select('*').order('created_at', { ascending: true }),
                    supabaseClient.from('transactions').select('*').order('transaction_date', { ascending: false }),
                    supabaseClient.from('savings_goals').select('*').order('created_at', { ascending: true })
                ]);

                if (acc.error) showAlert('ไม่สามารถโหลดข้อมูล บัญชี: ' + acc.error.message, 'error');
                if (cat.error) showAlert('ไม่สามารถโหลดข้อมูล หมวดหมู่: ' + cat.error.message, 'error');

                db.accounts = acc.data || [];
                db.categories = cat.data || [];
                db.budgets = bud.data || [];
                db.transactions = tx.data || [];
                db.savings_goals = goal.data || [];
            } catch (e) {
                console.error("Supabase load exception:", e);
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ Supabase: " + e.message, 'error');
            }
        }

        async function saveToDB(tableName, record) {
            delete record.id;
            delete record.user_id;

            const { data, error } = await supabaseClient.from(tableName).insert([record]).select();
            if (error) { 
                showAlert('บันทึกเข้า Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Insert Error:", error);
                return null; 
            }
            if (data && data[0]) {
                db[tableName].push(data[0]);
            }
            return data ? data[0] : record;
        }

        async function updateInDB(tableName, id, updatedFields) {
            delete updatedFields.id;
            delete updatedFields.user_id;

            const { error } = await supabaseClient.from(tableName).update(updatedFields).eq('id', id);
            if (error) { 
                showAlert('อัปเดต Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Update Error:", error);
                return; 
            }
            const idx = db[tableName].findIndex(item => item.id === id);
            if (idx !== -1) {
                db[tableName][idx] = { ...db[tableName][idx], ...updatedFields };
            }
        }

        async function deleteFromDB(tableName, id) {
            const { error } = await supabaseClient.from(tableName).delete().eq('id', id);
            if (error) { 
                showAlert('ลบจาก Supabase ไม่สำเร็จ: ' + error.message, 'error'); 
                console.error("Supabase Delete Error:", error);
                return; 
            }
            db[tableName] = db[tableName].filter(item => item.id !== id);
        }

        async function moveItemOrder(tableName, id, direction) {
            const list = db[tableName];
            const idx = list.findIndex(item => item.id === id);
            if (idx === -1) return;
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= list.length) return;

            const temp = list[idx].order_index ?? idx;
            list[idx].order_index = list[targetIdx].order_index ?? targetIdx;
            list[targetIdx].order_index = temp;

            const item = list.splice(idx, 1)[0];
            list.splice(targetIdx, 0, item);

            for (const it of list) {
                await supabaseClient.from(tableName).update({ order_index: it.order_index }).eq('id', it.id);
            }
            renderCurrentTab();
            showAlert('จัดลำดับสำเร็จ');
        }

        function setGlobalFilterMode(mode) {
            globalFilter.mode = mode;
            globalFilter.currentDate = new Date();
            renderCurrentTab();
        }

        function shiftDateRange(direction) {
            const d = new Date(globalFilter.currentDate);
            if (globalFilter.mode === 'today') {
                d.setDate(d.getDate() + direction);
            } else if (globalFilter.mode === 'month') {
                d.setMonth(d.getMonth() + direction);
            } else if (globalFilter.mode === 'year') {
                d.setFullYear(d.getFullYear() + direction);
            }
            globalFilter.currentDate = d;
            renderCurrentTab();
        }

        function applyCustomDateFilter() {
            const start = document.getElementById('customStartDate').value;
            const end = document.getElementById('customEndDate').value;
            if (!start || !end) { showAlert('กรุณาเลือกช่วงวันที่ให้ครบถ้วน', 'error'); return; }
            globalFilter.mode = 'custom';
            globalFilter.startDate = start;
            globalFilter.endDate = end;
            renderCurrentTab();
        }

        function filterTransactionsByDate(txs) {
            const d = new Date(globalFilter.currentDate);
            return txs.filter(tx => {
                if (!tx.transaction_date) return false;
                const txDate = new Date(tx.transaction_date);
                if (globalFilter.mode === 'today') {
                    return txDate.toDateString() === d.toDateString();
                } else if (globalFilter.mode === 'month') {
                    return txDate.getFullYear() === d.getFullYear() && txDate.getMonth() === d.getMonth();
                } else if (globalFilter.mode === 'year') {
                    return txDate.getFullYear() === d.getFullYear();
                } else if (globalFilter.mode === 'custom' && globalFilter.startDate && globalFilter.endDate) {
                    const start = new Date(globalFilter.startDate);
                    const end = new Date(globalFilter.endDate);
                    end.setHours(23, 59, 59, 999);
                    return txDate >= start && txDate <= end;
                }
                return true;
            });
        }

            const filteredTxs = filterTransactionsByDate(db.transactions);

            let bankInc = 0, bankExp = 0;
            let creditSpend = 0, creditRefund = 0;

            filteredTxs.forEach(tx => {
                const acc = db.accounts.find(a => a.id === tx.wallet_id);
                const type = acc ? acc.account_type : 'cash';
                const amt = Number(tx.amount);

                if (type === 'cash') {
                    if (tx.transaction_type === 'income') cashInc += amt;
                    else if (tx.transaction_type === 'expense') cashExp += amt;
                } else if (type === 'bank') {
                    if (tx.transaction_type === 'income') bankInc += amt;
                    else if (tx.transaction_type === 'expense') bankExp += amt;
                } else if (type === 'credit') {
                    if (tx.transaction_type === 'credit_spend') creditSpend += amt;
                    else if (tx.transaction_type === 'credit_payment') creditRefund += amt;
                }
            });

            const netSummary = (cashInc + bankInc + creditRefund) - (cashExp + bankExp + creditSpend);

            container.innerHTML = `
                <div class="space-y-4 animate-in fade-in duration-200">

        function openTransactionModal(id = null) {
            if (id) {
                const tx = db.transactions.find(t => t.id === id);
                if (tx) {
                    document.getElementById('editTxId').value = tx.id;
                    document.getElementById('txType').value = tx.transaction_type;
                    document.getElementById('txAmount').value = tx.amount;
                    document.getElementById('txDate').value = tx.transaction_date ? tx.transaction_date.slice(0, 16) : new Date().toISOString().slice(0, 16);
                    document.getElementById('txNote').value = tx.transaction_note || '';
                    if (tx.is_installment) {
                        document.getElementById('txIsInstallment').checked = true;
                        document.getElementById('txCurrentMonth').value = tx.installment_current_month || 1;
                        document.getElementById('txTotalMonths').value = tx.installment_total_months || 10;
                        document.getElementById('installmentFields').classList.remove('hidden');
                    }
                    document.getElementById('txModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขรายการ';
                    onTxTypeChange();
                    document.getElementById('txWalletId').value = tx.wallet_id;
                    document.getElementById('txToWalletId').value = tx.to_wallet_id || '';
                    document.getElementById('txCategoryId').value = tx.category_id;
                }
            } else {
                document.getElementById('editTxId').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('txDate').value = now.toISOString().slice(0, 16);
                document.getElementById('txModalTitle').innerHTML = '<i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> บันทึกรายการใหม่';
                onTxTypeChange();
            }
            document.getElementById('txModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeTransactionModal() { document.getElementById('txModal').classList.add('hidden'); }

        function onTxTypeChange() {
            const type = document.getElementById('txType').value;
            const walletSelect = document.getElementById('txWalletId');
            const toWalletSelect = document.getElementById('txToWalletId');
            const categorySelect = document.getElementById('txCategoryId');
            const toWalletContainer = document.getElementById('toWalletContainer');
            const installmentBox = document.getElementById('installmentBox');
            const txWalletLabel = document.getElementById('txWalletLabel');
            const txToWalletLabel = document.getElementById('txToWalletLabel');

            if (!walletSelect || !toWalletSelect || !categorySelect) return;

            // บัญชีและประเภทบัตรเครดิตเท่านั้นสำหรับ credit_spend และ credit_payment
            const creditAccounts = db.accounts.filter(a => a.account_type === 'credit');
            const nonCreditAccounts = db.accounts.filter(a => a.account_type !== 'credit');
            const allAccounts = db.accounts;

            if (type === 'credit_spend') {
                // รูดบัตร -> กระเป๋าหลักต้องเป็นบัตรเครดิตเท่านั้น
                txWalletLabel.textContent = 'เลือกบัตรเครดิตที่รูด';
                walletSelect.innerHTML = creditAccounts.map(a => `<option value="${a.id}">[บัตรเครดิต] ${a.account_name}</option>`).join('');
                toWalletContainer.classList.add('hidden');
                installmentBox.classList.remove('hidden');
            } else if (type === 'credit_payment') {
                // จ่ายบิลบัตร -> กระเป๋าหลักคือบัญชีที่จ่ายเงิน (ธนาคาร/เงินสด), บัญชีปลายทางคือบัตรเครดิต
                txWalletLabel.textContent = 'จ่ายจากบัญชี (เงินสด/ธนาคาร)';
                walletSelect.innerHTML = nonCreditAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                txToWalletLabel.textContent = 'ชำระเข้าบัตรเครดิตใบไหน';
                toWalletSelect.innerHTML = creditAccounts.map(a => `<option value="${a.id}">[บัตรเครดิต] ${a.account_name}</option>`).join('');
                
                toWalletContainer.classList.remove('hidden');
                installmentBox.classList.add('hidden');
            } else if (type === 'transfer') {
                txWalletLabel.textContent = 'บัญชีต้นทาง';
                walletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                txToWalletLabel.textContent = 'บัญชีปลายทาง';
                toWalletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                
                toWalletContainer.classList.remove('hidden');
                installmentBox.classList.add('hidden');
            } else {
                // expense / income
                txWalletLabel.textContent = 'กระเป๋าเงิน / บัญชี';
                walletSelect.innerHTML = allAccounts.map(a => `<option value="${a.id}">[${a.account_type.toUpperCase()}] ${a.account_name}</option>`).join('');
                toWalletContainer.classList.add('hidden');
                installmentBox.classList.add('hidden');
            }

            categorySelect.innerHTML = db.categories.map(c => `<option value="${c.id}">${c.category_name} (${c.category_type})</option>`).join('');
        }

        function toggleInstallmentFields() {
            const checked = document.getElementById('txIsInstallment')?.checked;
            const fields = document.getElementById('installmentFields');
            if (!fields) return;
            if (checked) fields.classList.remove('hidden');
            else fields.classList.add('hidden');
        }

        async function handleSaveTransaction(e) {
            e.preventDefault();
            const editId = document.getElementById('editTxId').value;
            const type = document.getElementById('txType').value;
            const amount = Number(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;
            const wallet_id = document.getElementById('txWalletId').value;
            const to_wallet_id = document.getElementById('txToWalletId').value || null;
            const category_id = document.getElementById('txCategoryId').value;
            const note = document.getElementById('txNote').value;
            
            const is_installment = document.getElementById('txIsInstallment')?.checked || false;
            const installment_current_month = is_installment ? Number(document.getElementById('txCurrentMonth').value) : null;
            const installment_total_months = is_installment ? Number(document.getElementById('txTotalMonths').value) : null;

            const account = db.accounts.find(a => a.id === wallet_id);
            if (account) {
                if (type === 'income') {
                    account.balance = Number(account.balance) + amount;
                } else if (type === 'expense' || type === 'transfer') {
                    account.balance = Number(account.balance) - amount;
                } else if (type === 'credit_spend') {
                    // รูดบัตรเครดิต ยอดเงินลดลง (หรือยอดหนี้เพิ่มขึ้น)
                    account.balance = Number(account.balance) - amount;
                } else if (type === 'credit_payment') {
                    // จ่ายชำระหนี้บัตร: ตัดเงินบัญชีจ่าย (-) และ คืนวงเงินบัตรเครดิตปลายทาง (+)
                    account.balance = Number(account.balance) - amount;
                    const toAcc = db.accounts.find(a => a.id === to_wallet_id);
                    if (toAcc) {
                        toAcc.balance = Number(toAcc.balance) + amount;
                        await updateInDB('accounts', toAcc.id, { balance: toAcc.balance });
                    }
                }
                await updateInDB('accounts', account.id, { balance: account.balance });
            }

            const txData = {
                transaction_date: new Date(date).toISOString(),
                transaction_type: type,
                amount: amount,
                wallet_id: wallet_id,
                to_wallet_id: to_wallet_id,
                category_id: category_id,
                transaction_note: note,
                is_installment: is_installment,
                installment_total_months: installment_total_months,
                installment_current_month: installment_current_month
            };

            if (editId) {
                await updateInDB('transactions', editId, txData);
                showAlert('แก้ไขรายการสำเร็จ');
            } else {
                await saveToDB('transactions', txData);
                showAlert('บันทึกรายการสำเร็จ');
            }

            closeTransactionModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function deleteTransaction(id) {
            if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
                await deleteFromDB('transactions', id);
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบรายการสำเร็จ', 'success');
            }
        }

        // --- Corrected General Ledger Calculations & Display ---
        function openAccountLedger(accountId) {
            const acc = db.accounts.find(a => a.id === accountId);
            if (!acc) return;

            // 1. ดึงรายการธุรกรรมของบัญชีนี้ และเรียงจาก "เก่าไปใหม่" (Chronological Order)
            const accTxs = db.transactions.filter(t => t.wallet_id === accountId || t.to_wallet_id === accountId);
            accTxs.sort((a, b) => new Date(a.transaction_date) - new Date(b.transaction_date));

            // 2. คำนวณหาสุทธิการเปลี่ยนแปลงทั้งหมดเพื่อถอยกลับไปยังจุดเริ่มต้น
            let totalNetChange = 0;
            accTxs.forEach(t => {
                const amount = Number(t.amount);
                // เพิ่ม (DEBIT): income และ credit_spend (หรือ บัญชีปลายทางจากการโอน/จ่ายบิล)
                const isDebit = (t.transaction_type === 'income') || 
                                (t.transaction_type === 'credit_spend' && t.wallet_id === accountId) || 
                                (t.to_wallet_id === accountId);

                if (isDebit) {
                    totalNetChange += amount;
                } else {
                    totalNetChange -= amount;
                }
            });

            // คำนวณยอดคงเหลือเริ่มต้น
            const initialStartBalance = Number(acc.balance) - totalNetChange;

            // 3. วนลูปคำนวณ Running Balance
            let runningBalance = initialStartBalance;
            let rowsHtml = '';

            if (accTxs.length === 0) {
                rowsHtml = `<tr><td colspan="5" class="text-center py-6 text-slate-400 text-xs">ยังไม่มีรายการเคลื่อนไหวในบัญชีนี้</td></tr>`;
            } else {
                rowsHtml = accTxs.map(t => {
                    const amount = Number(t.amount);
                    // เงื่อนไข DEBIT (เพิ่ม): income และ credit_spend
                    // เงื่อนไข CREDIT (ลด): expense และ credit_payment
                    const isDebit = (t.transaction_type === 'income') || 
                                    (t.transaction_type === 'credit_spend' && t.wallet_id === accountId) || 
                                    (t.to_wallet_id === accountId);

                    if (isDebit) {
                        runningBalance += amount;
                    } else {
                        runningBalance -= amount;
                    }

                    const d = new Date(t.transaction_date);
                    const dateStr = d.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' });
                    const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                    return `
                        <tr class="border-b border-slate-100 dark:border-slate-700/50 text-[11px]">
                            <td class="py-2.5 px-2 text-slate-400">${dateStr} <span class="text-[9px] block">${timeStr}</span></td>
                            <td class="py-2.5 px-2 font-medium">
                                <div>${t.transaction_note || '-'}</div>
                                <div class="text-[9px] text-slate-400 uppercase">ประเภท: ${t.transaction_type}</div>
                            </td>
                            <td class="py-2.5 px-2 text-right text-emerald-600 font-semibold">${isDebit ? '+฿' + amount.toLocaleString() : '-'}</td>
                            <td class="py-2.5 px-2 text-right text-rose-500 font-semibold">${!isDebit ? '-฿' + amount.toLocaleString() : '-'}</td>
                            <td class="py-2.5 px-2 text-right font-bold text-slate-700 dark:text-slate-200">฿${runningBalance.toLocaleString()}</td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('ledgerTitle').innerHTML = `<i data-lucide="book-open" class="w-4 h-4 text-emerald-500"></i> สมุดบัญชี: ${acc.account_name}`;
            document.getElementById('ledgerContent').innerHTML = `
                <div class="bg-emerald-50 dark:bg-emerald-950/40 p-3 rounded-2xl flex justify-between items-center text-xs mb-3 border border-emerald-100 dark:border-emerald-900/40">
                    <span class="text-slate-600 dark:text-slate-300 font-medium">ยอดคงเหลือปัจจุบัน (Ending Balance)</span>
                    <span class="font-bold text-base text-emerald-600">฿${Number(acc.balance).toLocaleString()}</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 dark:border-slate-700 text-[10px] text-slate-400 uppercase">
                                <th class="py-2 px-2">วัน-เวลา</th>
                                <th class="py-2 px-2">รายการ / โน้ต</th>
                                <th class="py-2 px-2 text-right">เพิ่ม (DEBIT)</th>
                                <th class="py-2 px-2 text-right">ลด (CREDIT)</th>
                                <th class="py-2 px-2 text-right">คงเหลือ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('ledgerModal').classList.remove('hidden');
            lucide.createIcons();
        }

                        <div class="space-y-2.5">
                            ${db.savings_goals.map((goal, index) => {
                                const percent = Math.min(100, Math.round((goal.current_amount / goal.target_amount) * 100));
                                return `
                                    <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-2">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <h4 class="font-bold text-xs text-slate-900 dark:text-white">${goal.goal_title}</h4>
                                                <div class="text-[10px] text-slate-400">ออมเดือนละ ฿${Number(goal.monthly_target).toLocaleString()} (${goal.saved_periods}/${goal.total_periods} งวด)</div>
                                            </div>
                                            <div class="flex items-center space-x-1">
                                                ${index > 0 ? `<button onclick="moveItemOrder('savings_goals', '${goal.id}', -1)" class="text-slate-400 hover:text-emerald-500 p-1"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>` : ''}
                                                ${index < db.savings_goals.length - 1 ? `<button onclick="moveItemOrder('savings_goals', '${goal.id}', 1)" class="text-slate-400 hover:text-emerald-500 p-1"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>` : ''}
                                                <button onclick="openGoalModal('${goal.id}')" class="text-slate-400 hover:text-emerald-500 p-1"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                                                <button onclick="deleteGoal('${goal.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                            </div>
                                        </div>
                                        <div>
                                            <div class="flex justify-between text-[10px] mb-1 text-slate-400">
                                                <span>เก็บแล้ว: ฿${Number(goal.current_amount).toLocaleString()}</span>
                                                <span class="font-bold text-slate-700 dark:text-slate-200">เป้าหมาย: ฿${Number(goal.target_amount).toLocaleString()} (${percent}%)</span>
                                            </div>
                                            <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                                                <div class="bg-emerald-500 h-full rounded-full" style="width: ${percent}%"></div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('') || '<div class="text-center py-6 text-xs text-slate-400 bg-white dark:bg-slate-800 rounded-2xl">ยังไม่มีเป้าหมายเงินออม</div>'}
                        </div>
                    </div>
                </div>

                <!-- Budget Modal -->
                <div id="budModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                        <div class="flex justify-between items-center mb-3">
                            <h3 id="budModalTitle" class="text-sm font-bold flex items-center gap-2"><i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i> ตั้งงบประมาณรายจ่าย</h3>
                            <button onclick="closeBudgetModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveBudget(event)" class="space-y-3">
                            <input type="hidden" id="editBudId">
                            <div>
                                <label class="block text-[11px] font-medium mb-1">ชื่อรอบงบประมาณ</label>
                                <input type="text" id="budName" required placeholder="เช่น งบอาหาร ครึ่งปีแรก" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium mb-1">หมวดหมู่รายจ่าย</label>
                                <select id="budCategoryId" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                                    ${db.categories.filter(c => c.category_type === 'expense').map(c => `<option value="${c.id}">${c.category_name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium mb-1">วงเงินสูงสุด (บาท)</label>
                                <input type="number" step="0.01" id="budLimit" required placeholder="5000" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[10px] font-medium mb-1">เริ่มต้น (Start Period)</label>
                                    <input type="text" id="budStart" required value="2026-01" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-medium mb-1">สิ้นสุด (End Period)</label>
                                    <input type="text" id="budEnd" required value="2026-06" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md">บันทึกงบ</button>
                        </form>
                    </div>
                </div>

                <!-- Savings Goal Modal -->
                <div id="goalModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
                        <div class="flex justify-between items-center mb-3">
                            <h3 id="goalModalTitle" class="text-sm font-bold flex items-center gap-2"><i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> เพิ่มเป้าหมายเงินออม</h3>
                            <button onclick="closeGoalModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleSaveGoal(event)" class="space-y-3">
                            <input type="hidden" id="editGoalId">
                            <div>
                                <label class="block text-[11px] font-medium mb-1">ชื่อเป้าหมาย</label>
                                <input type="text" id="goalTitle" required placeholder="เช่น เก็บเงินเรียน" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium mb-1">ยอดเป้าหมายรวม (บาท)</label>
                                <input type="number" step="0.01" id="goalTarget" required placeholder="120000" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium mb-1">ยอดเก็บสะสมปัจจุบัน (บาท)</label>
                                <input type="number" step="0.01" id="goalCurrent" required value="0" class="w-full px-3 py-2 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-[10px] font-medium mb-1">จำนวนงวดทั้งหมด</label>
                                    <input type="number" id="goalPeriods" required value="12" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-medium mb-1">ยอดออมต่อเดือน</label>
                                    <input type="number" step="0.01" id="goalMonthly" required value="10000" class="w-full px-2 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-900">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md">บันทึกเป้าหมาย</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function openBudgetModal(id = null) {
            if (id) {
                const bud = db.budgets.find(b => b.id === id);
                if (bud) {
                    document.getElementById('editBudId').value = bud.id;
                    document.getElementById('budName').value = bud.budget_name;
                    document.getElementById('budCategoryId').value = bud.category_id;
                    document.getElementById('budLimit').value = bud.budget_limit;
                    document.getElementById('budStart').value = bud.start_period;
                    document.getElementById('budEnd').value = bud.end_period;
                    document.getElementById('budModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขงบประมาณ';
                }
            } else {
                document.getElementById('editBudId').value = '';
                document.getElementById('budName').value = '';
                document.getElementById('budModalTitle').innerHTML = '<i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i> ตั้งงบประมาณรายจ่าย';
            }
            document.getElementById('budModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeBudgetModal() { document.getElementById('budModal').classList.add('hidden'); }

        function openGoalModal(id = null) {
            if (id) {
                const goal = db.savings_goals.find(g => g.id === id);
                if (goal) {
                    document.getElementById('editGoalId').value = goal.id;
                    document.getElementById('goalTitle').value = goal.goal_title;
                    document.getElementById('goalTarget').value = goal.target_amount;
                    document.getElementById('goalCurrent').value = goal.current_amount;
                    document.getElementById('goalPeriods').value = goal.total_periods;
                    document.getElementById('goalMonthly').value = goal.monthly_target;
                    document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขเป้าหมาย';
                }
            } else {
                document.getElementById('editGoalId').value = '';
                document.getElementById('goalTitle').value = '';
                document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> เพิ่มเป้าหมายเงินออม';
            }
            document.getElementById('goalModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeGoalModal() { document.getElementById('goalModal').classList.add('hidden'); }

        async function handleSaveBudget(e) {
            e.preventDefault();
            const editId = document.getElementById('editBudId').value;
            const budData = {
                budget_name: document.getElementById('budName').value,
                category_id: document.getElementById('budCategoryId').value,
                budget_limit: Number(document.getElementById('budLimit').value),
                start_period: document.getElementById('budStart').value,
                end_period: document.getElementById('budEnd').value
            };
            if (editId) {
                await updateInDB('budgets', editId, budData);
                showAlert('แก้ไขงบประมาณสำเร็จ');
            } else {
                await saveToDB('budgets', budData);
                showAlert('สร้างงบประมาณสำเร็จ');
            }
            closeBudgetModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function handleSaveGoal(e) {
            e.preventDefault();
            const editId = document.getElementById('editGoalId').value;
            const goalData = {
                goal_title: document.getElementById('goalTitle').value,
                target_amount: Number(document.getElementById('goalTarget').value),
                current_amount: Number(document.getElementById('goalCurrent').value),
                total_periods: Number(document.getElementById('goalPeriods').value),
                saved_periods: 0,
                monthly_target: Number(document.getElementById('goalMonthly').value)
            };
            if (editId) {
                await updateInDB('savings_goals', editId, goalData);
                showAlert('แก้ไขเป้าหมายสำเร็จ');
            } else {
                await saveToDB('savings_goals', goalData);
                showAlert('สร้างเป้าหมายสำเร็จ');
            }
            closeGoalModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function deleteBudget(id) {
            if (confirm('ต้องการลบงบประมาณนี้ใช่หรือไม่?')) {
                await deleteFromDB('budgets', id);
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบงบประมาณสำเร็จ', 'success');
            }
        }
        async function deleteGoal(id) {
            if (confirm('ต้องการลบเป้าหมายนี้ใช่หรือไม่?')) {
                await deleteFromDB('savings_goals', id);
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบเป้าหมายสำเร็จ', 'success');
            }
        }

        function renderAnalytics(container) {
            const filteredTxs = filterTransactionsByDate(db.transactions);
            const totalAssets = db.accounts.filter(a => ['cash', 'bank', 'investment'].includes(a.account_type)).reduce((s, a) => s + Number(a.balance), 0);
            const totalLiabilities = db.accounts.filter(a => ['credit', 'loan'].includes(a.account_type)).reduce((s, a) => s + Math.abs(Number(a.balance)), 0);

            container.innerHTML = `
                <div class="space-y-4 animate-in fade-in duration-200">
                    ${renderDateFilterBar()}

                    <div class="px-1">
                        <h2 class="text-sm font-bold">วิเคราะห์ข้อมูล (Analytics)</h2>
                        <p class="text-[10px] text-slate-400">สัดส่วนสินทรัพย์ หนี้สิน และรายจ่ายตามหมวดหมู่</p>
                    </div>

                    <!-- Assets & Liabilities Breakdown Summary -->
                    <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-3">
                        <h3 class="font-bold text-xs text-slate-700 dark:text-slate-200">โครงสร้างสินทรัพย์ & หนี้สิน</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/50">
                                <span class="text-[10px] text-emerald-600 font-bold block mb-1">สินทรัพย์รวม (Assets)</span>
                                <span class="text-base font-bold text-emerald-700 dark:text-emerald-300">฿${totalAssets.toLocaleString()}</span>
                            </div>
                            <div class="p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/50">
                                <span class="text-[10px] text-rose-600 font-bold block mb-1">หนี้สินรวม (Liabilities)</span>
                                <span class="text-base font-bold text-rose-700 dark:text-rose-300">฿${totalLiabilities.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm">
                        <h3 class="font-bold text-xs mb-3 text-slate-700 dark:text-slate-200">สัดส่วนรายจ่ายตามหมวดหมู่</h3>
                        <div class="h-56 flex items-center justify-center">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm">
                        <h3 class="font-bold text-xs mb-3 text-slate-700 dark:text-slate-200">ยอดเงินคงเหลือแต่ละบัญชี</h3>
                        <div class="h-56 flex items-center justify-center">
                            <canvas id="accountChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const expenseCategories = db.categories.filter(c => c.category_type === 'expense');
                const expLabels = expenseCategories.map(c => c.category_name);
                const expData = expenseCategories.map(c => {
                    return filteredTxs
                        .filter(tx => tx.category_id === c.id && ['expense', 'credit_spend'].includes(tx.transaction_type))
                        .reduce((s, t) => s + Number(t.amount), 0);
                });

                const ctx1 = document.getElementById('expenseChart').getContext('2d');
                new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: expLabels.length ? expLabels : ['ยังไม่มีรายจ่าย'],
                        datasets: [{
                            data: expData.some(v => v > 0) ? expData : [1],
                            backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#ec4899', '#8b5cf6', '#64748b']
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } } }
                });

                const accLabels = db.accounts.map(a => a.account_name);
                const accData = db.accounts.map(a => Number(a.balance));
                const ctx2 = document.getElementById('accountChart').getContext('2d');
                new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: accLabels,
                        datasets: [{
                            label: 'ยอดเงิน (บาท)',
                            data: accData,
                            backgroundColor: '#10b981',
                            borderRadius: 8
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
            }, 100);
        }
    </script>
</body>
</html>
