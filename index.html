        function openBudgetModal(id = null) {
            if (id) {
                const bud = db.budgets.find(b => b.id === id);
                if (bud) {
                    document.getElementById('editBudId').value = bud.id;
                    document.getElementById('budName').value = bud.budget_name;
                    document.getElementById('budCategoryId').value = bud.category_id;
                    document.getElementById('budLimit').value = bud.budget_limit;
                    document.getElementById('budStart').value = budgetPeriodInputValue(bud.start_period);
                    document.getElementById('budEnd').value = budgetPeriodInputValue(bud.end_period, true);
                    document.getElementById('budModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขงบประมาณ';
                }
            } else {
                document.getElementById('editBudId').value = '';
                document.getElementById('budName').value = '';
                document.getElementById('budModalTitle').innerHTML = '<i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i> ตั้งงบประมาณรายจ่าย';
            }
            document.getElementById('budModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeBudgetModal() { document.getElementById('budModal').classList.add('hidden'); }

        function openGoalModal(id = null) {
            if (id) {
                const goal = db.savings_goals.find(g => g.id === id);
                if (goal) {
                    document.getElementById('editGoalId').value = goal.id;
                    document.getElementById('goalTitle').value = goal.goal_title;
                    document.getElementById('goalTarget').value = goal.target_amount;
                    document.getElementById('goalCurrent').value = goal.current_amount;
                    document.getElementById('goalPeriods').value = goal.total_periods;
                    document.getElementById('goalMonthly').value = goal.monthly_target;
                    document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-emerald-500"></i> แก้ไขเป้าหมาย';
                }
            } else {
                document.getElementById('editGoalId').value = '';
                document.getElementById('goalTitle').value = '';
                document.getElementById('goalModalTitle').innerHTML = '<i data-lucide="target" class="w-4 h-4 text-emerald-500"></i> เพิ่มเป้าหมายเงินออม';
            }
            document.getElementById('goalModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeGoalModal() { document.getElementById('goalModal').classList.add('hidden'); }

        async function handleSaveBudget(e) {
            e.preventDefault();
            const editId = document.getElementById('editBudId').value;
            const startPeriod = document.getElementById('budStart').value;
            const endPeriod = document.getElementById('budEnd').value;
            if (!startPeriod || !endPeriod || startPeriod > endPeriod) {
                showAlert('กรุณาเลือกช่วงวันที่ให้ถูกต้อง โดยวันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น', 'error');
                return;
            }
            const budData = {
                budget_name: document.getElementById('budName').value,
                category_id: document.getElementById('budCategoryId').value,
                budget_limit: Number(document.getElementById('budLimit').value),
                start_period: startPeriod,
                end_period: endPeriod
            };
            const saved = editId
                ? await updateInDB('budgets', editId, budData)
                : await saveToDB('budgets', budData);
            if (!saved) return;
            showAlert(editId ? 'แก้ไขงบประมาณสำเร็จ' : 'สร้างงบประมาณสำเร็จ');
            closeBudgetModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function handleSaveGoal(e) {
            e.preventDefault();
            const editId = document.getElementById('editGoalId').value;
            const goalData = {
                goal_title: document.getElementById('goalTitle').value,
                target_amount: Number(document.getElementById('goalTarget').value),
                current_amount: Number(document.getElementById('goalCurrent').value),
                total_periods: Number(document.getElementById('goalPeriods').value),
                monthly_target: Number(document.getElementById('goalMonthly').value)
            };
            if (!editId) goalData.saved_periods = 0;
            const saved = editId
                ? await updateInDB('savings_goals', editId, goalData)
                : await saveToDB('savings_goals', goalData);
            if (!saved) return;
            showAlert(editId ? 'แก้ไขเป้าหมายสำเร็จ' : 'สร้างเป้าหมายสำเร็จ');
            closeGoalModal();
            await loadAllData();
            renderCurrentTab();
        }

        async function deleteBudget(id) {
            if (confirm('ต้องการลบงบประมาณนี้ใช่หรือไม่?')) {
                if (!await deleteFromDB('budgets', id)) return;
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบงบประมาณสำเร็จ', 'success');
            }
        }
        async function deleteGoal(id) {
            const linkedContributions = db.transactions.some(tx =>
                String(getTransactionSavingsGoalId(tx)) === String(id)
            );
            if (linkedContributions) {
                showAlert('ยังลบเป้าหมายนี้ไม่ได้ เพราะมีรายการเงินออมผูกอยู่', 'error');
                return;
            }
            if (confirm('ต้องการลบเป้าหมายนี้ใช่หรือไม่?')) {
                if (!await deleteFromDB('savings_goals', id)) return;
                await loadAllData();
                renderCurrentTab();
                showAlert('ลบเป้าหมายสำเร็จ', 'success');
            }
        }

                function setAnalyticsAccount(accountId) {
            analyticsAccountId = accountId;
            renderCurrentTab();
        }

        function setAnalyticsCategory(categoryId) {
            analyticsCategoryId = categoryId;
            renderCurrentTab();
        }

        function renderAnalytics(container) {
            const filteredTxs = filterTransactionsByDate(db.transactions);
            const totalAssets = db.accounts
                .filter(account => ['cash', 'bank', 'investment'].includes(account.account_type))
                .reduce((sum, account) => sum + (Number(account.balance) || 0), 0);
            const totalLiabilities = db.accounts
                .filter(account => ['credit', 'loan'].includes(account.account_type))
                .reduce((sum, account) => sum + Math.abs(Number(account.balance) || 0), 0);
            const netWorth = totalAssets - totalLiabilities;
            const periodExpense = filteredTxs
                .filter(tx => ['expense', 'credit_spend'].includes(tx.transaction_type))
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const periodIncome = filteredTxs
                .filter(tx => tx.transaction_type === 'income')
                .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const isAllAccounts = analyticsAccountId === 'all';
            const selectedAccount = isAllAccounts ? null : db.accounts.find(account => String(account.id) === String(analyticsAccountId)) || db.accounts[0] || null;
            analyticsAccountId = isAllAccounts ? 'all' : selectedAccount ? selectedAccount.id : '';
                        const accountExpenseTxs = isAllAccounts
                ? filteredTxs.filter(tx => ['expense', 'credit_spend'].includes(tx.transaction_type))
                : selectedAccount
                    ? filteredTxs.filter(tx => tx.wallet_id === selectedAccount.id && ['expense', 'credit_spend'].includes(tx.transaction_type))
                    : [];
            const expenseCategories = db.categories.filter(category => category.category_type === 'expense');
            if (analyticsCategoryId && !expenseCategories.some(category => String(category.id) === String(analyticsCategoryId))) {
                analyticsCategoryId = '';
            }
            const selectedExpenseTxs = accountExpenseTxs
                .filter(tx => !analyticsCategoryId || String(tx.category_id) === String(analyticsCategoryId))
                .sort((a, b) => new Date(b.transaction_date) - new Date(a.transaction_date));
            const selectedExpenseTotal = selectedExpenseTxs.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const accountExpenseTotal = accountExpenseTxs.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const accountExpenseByCategory = Object.values(accountExpenseTxs.reduce((groups, tx) => {
                const category = db.categories.find(item => item.id === tx.category_id);
                const key = tx.category_id || 'uncategorized';
                if (!groups[key]) groups[key] = { name: category ? category.category_name : 'ไม่ระบุหมวดหมู่', color: category?.color || '#94a3b8', total: 0 };
                groups[key].total += Number(tx.amount) || 0;
                return groups;
            }, {})).sort((a, b) => b.total - a.total);
            const expenseByCategory = db.categories
                .filter(category => category.category_type === 'expense')
                .map(category => ({
                    ...category,
                    total: filteredTxs
                        .filter(tx => tx.category_id === category.id && ['expense', 'credit_spend'].includes(tx.transaction_type))
                        .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0)
                }))
                .filter(category => category.total > 0)
                .sort((a, b) => b.total - a.total);
                        const formatBaht = amount => `${amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            container.innerHTML = `

                        <div class="absolute -right-8 -top-10 h-36 w-36 rounded-full bg-blue-400/20 blur-2xl"></div>
                        <div class="relative flex items-start justify-between gap-3">
                            <div>
                                <span class="inline-flex items-center gap-1.5 rounded-full border border-white/15 bg-white/10 px-2.5 py-1 text-[10px] font-medium text-blue-100">
                                    <i data-lucide="chart-no-axes-combined" class="h-3 w-3"></i> ภาพรวมการเงิน
                                </span>
                                <h2 class="mt-3 text-lg font-bold">วิเคราะห์ข้อมูล</h2>
                                <p class="text-[10px] text-slate-300">สินทรัพย์ รายจ่าย และบัญชีของคุณ</p>
                            </div>
                            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-white/15 bg-white/10">
                                <i data-lucide="chart-pie" class="h-5 w-5 text-blue-200"></i>
                            </div>
                        </div>
                        <div class="relative mt-4">${renderDateFilterBar()}</div>

                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">สินทรัพย์รวม</span>
                                <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-100 text-blue-600 dark:bg-blue-950/50 dark:text-blue-300"><i data-lucide="landmark" class="h-4 w-4"></i></span>
                            </div>
                            <div class="mt-2 text-base font-bold text-slate-900 dark:text-white">${formatBaht(totalAssets)}</div>
                            <div class="mt-1 text-[9px] text-slate-400">เงินสด · ธนาคาร · ลงทุน</div>
                        </div>
                        <div class="rounded-3xl border border-rose-100 bg-gradient-to-br from-rose-50 to-white p-4 shadow-sm dark:border-slate-700 dark:from-slate-800 dark:to-slate-800">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">หนี้สินรวม</span>
                                <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-rose-100 text-rose-600 dark:bg-rose-950/40 dark:text-rose-300"><i data-lucide="credit-card" class="h-4 w-4"></i></span>
                            </div>
                            <div class="mt-2 text-base font-bold text-rose-600 dark:text-rose-300">${formatBaht(totalLiabilities)}</div>
                            <div class="mt-1 text-[9px] text-slate-400">บัตรเครดิต · เงินกู้</div>
                        </div>
                        <div class="col-span-2 flex items-center justify-between gap-3 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                            <div class="flex items-center gap-3">
                                <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-violet-100 text-violet-600 dark:bg-violet-950/40 dark:text-violet-300"><i data-lucide="scale" class="h-5 w-5"></i></span>
                                <div><div class="text-[10px] text-slate-500 dark:text-slate-400">สินทรัพย์สุทธิ</div><div class="text-[9px] text-slate-400">สินทรัพย์ − หนี้สิน</div></div>
                            </div>
                            <div class="text-right text-lg font-bold ${netWorth < 0 ? 'text-rose-500' : 'text-slate-900 dark:text-white'}">${formatBaht(netWorth)}</div>
                        </div>
                    </section>

                    <section class="grid grid-cols-2 gap-3">
                        <div class="rounded-2xl border border-emerald-100 bg-emerald-50/70 p-3 dark:border-slate-700 dark:bg-slate-800">
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-500 dark:text-slate-400"><i data-lucide="arrow-down-left" class="h-3.5 w-3.5 text-emerald-500"></i> รายรับช่วงนี้</div>
                            <div class="mt-1 text-sm font-bold text-emerald-600 dark:text-emerald-300">${formatBaht(periodIncome)}</div>

                            <div class="mt-1 text-sm font-bold text-orange-600 dark:text-orange-300">${formatBaht(periodExpense)}</div>
                        </div>
                    </section>

                                        <section class="rounded-3xl border border-blue-100 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                        <div class="mb-3 flex items-start justify-between gap-3">
                            <div>
                                <h3 class="text-xs font-bold text-slate-800 dark:text-white">รายจ่ายแยกตามบัญชี</h3>
                                <p class="mt-0.5 text-[9px] text-slate-400">ดูว่าแต่ละบัญชีใช้จ่ายไปกับหมวดไหนในช่วงเวลาที่เลือก</p>
                            </div>
                            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-300"><i data-lucide="wallet-cards" class="h-4 w-4"></i></span>
                        </div>
                        ${db.accounts.length ? `
                            <label for="analyticsAccountSelect" class="mb-1.5 block text-[10px] font-medium text-slate-500 dark:text-slate-400">เลือกบัญชี</label>
                            <select id="analyticsAccountSelect" onchange="setAnalyticsAccount(this.value)" class="mb-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-600 dark:bg-slate-900 dark:focus:ring-blue-900">
                                <option value="all" ${isAllAccounts ? 'selected' : ''}>รวมทุกบัญชี</option>
                                ${db.accounts.map(account => `<option value="${account.id}" ${selectedAccount?.id === account.id ? 'selected' : ''}>${escapeHtml(account.account_name)} · ${account.account_type === 'credit' ? 'บัตรเครดิต' : account.account_type === 'bank' ? 'ธนาคาร' : account.account_type === 'cash' ? 'เงินสด' : account.account_type === 'investment' ? 'ลงทุน' : 'หนี้สิน'}</option>`).join('')}
                                                        </select>
                            <label for="analyticsCategorySelect" class="mb-1.5 block text-[10px] font-medium text-slate-500 dark:text-slate-400">เลือกหมวดรายจ่าย</label>
                            <select id="analyticsCategorySelect" onchange="setAnalyticsCategory(this.value)" class="mb-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 dark:border-slate-600 dark:bg-slate-900 dark:focus:ring-blue-900">
                                <option value="" ${!analyticsCategoryId ? 'selected' : ''}>ทุกหมวดหมู่</option>
                                ${expenseCategories.map(category => `<option value="${category.id}" ${String(analyticsCategoryId) === String(category.id) ? 'selected' : ''}>${escapeHtml(category.category_name)}</option>`).join('')}
                            </select>
                            <div class="mb-3 flex items-center justify-between rounded-2xl bg-blue-50 p-3 dark:bg-blue-950/30">
                                <div><div class="text-[10px] text-slate-500 dark:text-slate-400">${isAllAccounts ? 'ทุกบัญชี' : escapeHtml(selectedAccount?.account_name || '')} · ${analyticsCategoryId ? escapeHtml(expenseCategories.find(category => String(category.id) === String(analyticsCategoryId))?.category_name || '') : 'รายจ่ายรวม'}</div><div class="mt-0.5 text-lg font-bold text-blue-700 dark:text-blue-300">${formatBaht(selectedExpenseTotal)}</div></div>
                                <span class="rounded-full bg-white px-2.5 py-1 text-[9px] font-semibold text-blue-600 dark:bg-slate-800 dark:text-blue-300">${selectedExpenseTxs.length} รายการ</span>
                            </div>
                            <div class="space-y-2.5">
                                ${accountExpenseByCategory.map(category => {
                                    const percent = accountExpenseTotal ? Math.round(category.total / accountExpenseTotal * 100) : 0;
                                    return `<div>
                                        <div class="mb-1 flex items-center justify-between gap-2 text-[10px]"><span class="truncate font-medium text-slate-700 dark:text-slate-200">${escapeHtml(category.name)}</span><span class="shrink-0 font-semibold text-slate-600 dark:text-slate-300">${formatBaht(category.total)} <span class="text-slate-400">(${percent}%)</span></span></div>
                                        <div class="h-2 overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700"><div class="h-full rounded-full" style="width:${percent}%;background-color:${category.color}"></div></div>
                                    </div>`;
                                }).join('') || '<div class="rounded-2xl bg-slate-50 py-5 text-center text-[10px] text-slate-400 dark:bg-slate-900">ไม่มีรายจ่ายของบัญชีนี้ในช่วงเวลาที่เลือก</div>'}
                            </div>
                                                        ${selectedExpenseTxs.length ? `
                                <div class="mt-4 border-t border-slate-100 pt-3 dark:border-slate-700">
                                    <div class="mb-2 text-[10px] font-bold text-slate-500 dark:text-slate-400">รายการที่ตรงกับตัวกรอง</div>
                                    <div class="space-y-2">
                                        ${selectedExpenseTxs.map(tx => {
                                            const category = db.categories.find(item => item.id === tx.category_id);
                                            const account = db.accounts.find(item => item.id === tx.wallet_id);
                                            const date = new Date(tx.transaction_date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                                            const accountLabel = isAllAccounts && account ? ` · ${escapeHtml(account.account_name)}` : '';
                                            return `<div class="flex items-center justify-between gap-2 text-[10px]"><div class="min-w-0"><div class="truncate font-medium text-slate-700 dark:text-slate-200">${escapeHtml(getTransactionNote(tx) || category?.category_name || 'รายจ่าย')}</div><div class="text-[9px] text-slate-400">${escapeHtml(category?.category_name || 'ไม่ระบุหมวดหมู่')}${accountLabel} · ${date}</div></div><span class="shrink-0 font-semibold text-slate-700 dark:text-slate-200">−${formatBaht(Number(tx.amount) || 0)}</span></div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        ` : '<div class="rounded-2xl bg-slate-50 py-6 text-center text-[10px] text-slate-400 dark:bg-slate-900">เพิ่มบัญชีและบันทึกรายจ่ายเพื่อดูการวิเคราะห์</div>'}
                    </section>

                    <section class="rounded-3xl border border-slate-200/80 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
                        <div class="mb-3 flex items-center justify-between gap-2">
                            <div><h3 class="text-xs font-bold text-slate-800 dark:text-white">รายจ่ายตามหมวดหมู่</h3>
<p class="mt-0.5 text-[9px] text-slate-400">สัดส่วนจากช่วงเวลาที่เลือก</p></div>
                            <span class="rounded-full bg-orange-50 px-2.5 py-1 text-[9px] font-semibold text-orange-600 dark:bg-orange-950/30 dark:text-orange-300">${expenseByCategory.length} หมวด</span>
                        </div>
                        <div class="relative h-56">
                            ${expenseByCategory.length ? '<canvas id="expenseChart"></canvas>' : '<div class="flex h-full flex-col items-center justify-center rounded-2xl bg-slate-50 text-center dark:bg-slate-900"><span class="mb-2 flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 text-slate-400 dark:bg-slate-800"><i data-lucide="chart-pie" class="h-5 w-5"></i></span><p class="text-xs font-medium text-slate-500">ยังไม่มีรายจ่ายในช่วงนี้</p><p class="mt-1 text-[10px] text-slate-400">ลองเปลี่ยนช่วงเวลาเพื่อดูข้อมูล</p></div>'}
                        </div>
                    </section>

                    
                </div>
            `;

            setTimeout(() => {
                const formatTooltipBaht = value => `${Number(value).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                const palette = ['#2563eb', '#8b5cf6', '#f97316', '#14b8a6', '#ec4899', '#f59e0b', '#06b6d4', '#84cc16'];
                const expenseCanvas = document.getElementById('expenseChart');
                if (expenseCanvas) {
                    new Chart(expenseCanvas.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: expenseByCategory.map(category => category.category_name),
                            datasets: [{
                                data: expenseByCategory.map(category => category.total),
                                backgroundColor: expenseByCategory.map((category, index) => category.color || palette[index % palette.length]),
                                borderColor: document.documentElement.classList.contains('dark') ? '#273449' : '#ffffff',
                                borderWidth: 4,
                                hoverOffset: 7,
                                borderRadius: 5,
                                spacing: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '72%',
                            plugins: {
                                legend: { position: 'bottom', labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 7, padding: 14, font: { family: 'Prompt', size: 10 } } },
                                tooltip: { callbacks: { label: context => ` ${context.label}: ${formatTooltipBaht(context.raw)}` } }
                            }
                        },
                        plugins: [{
                            id: 'expenseCenterLabel',
                            afterDraw(chart) {
                                const { ctx, chartArea } = chart;
                                if (!chartArea) return;
                                const x = (chartArea.left + chartArea.right) / 2;
                                const y = (chartArea.top + chartArea.bottom) / 2;
                                ctx.save();
                                ctx.textAlign = 'center';
                                ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
                                ctx.font = '10px Prompt, sans-serif';
                                ctx.fillText('รวมรายจ่าย', x, y - 8);
                                ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#f8fafc' : '#0f172a';

                                ctx.fillText(formatTooltipBaht(periodExpense), x, y + 14);

                            }
                        }]
                    });
                }

                
            }, 100);
        }
    </script>
